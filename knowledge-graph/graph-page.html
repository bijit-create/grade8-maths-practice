instead of a rectangle.", "stop": "The three sets of edges are drawn along the dot lines in one sequence; no smaller task shows the representation.", "role": "outcome task"}, {"id": "SK-GE-23", "t": "SK", "g": 8, "s": "Counts the faces, vertices and edges of a prism or a pyramid.", "action": "counts", "content": "the faces, vertices and edges of a prism or a pyramid", "cond": "prism or pyramid with a base of 3 to 6 sides, including the cube and the cuboid as prisms, shown as a picture or a model; response: the three numbers", "ex": "Count the faces, vertices and edges of a pentagonal prism.", "sep": "SK-GE-24", "sepl": "A learner reads F + V − E = 2 from a table of counts but counts the edges of a hexagonal pyramid as 6, the edges of its base only.", "stop": "Counting faces, vertices and edges of one solid uses the same three definitions; counting each separately does not give a separate task type.", "role": "step"}, {"id": "SK-GE-24", "t": "SK", "g": 8, "s": "Verifies Euler's relation, F + V − E = 2, for prisms and pyramids by completing a table of their faces, vertices and edges.", "action": "verifies", "content": "Euler's relation for a set of prisms and pyramids, through the pattern in a table", "cond": "at least four solids from the cube, the cuboid and prisms and pyramids with a base of 3 to 6 sides; table with columns F, V, E and F + V − E; response: the completed table and a written statement of the relation the last column shows", "ex": "Complete the table for a triangular prism, a cube, a square pyramid and a hexagonal pyramid. What do you notice about F + V − E?", "sep": "SK-GE-23", "sepl": "A learner counts F, V and E correctly for a triangular prism (5, 6, 9), a cube (6, 8, 12) and a square pyramid (5, 5, 8) and finds F + V − E = 2 each time, but states the relation as F + V = E.", "stop": "The counts, the value of F + V − E and the statement of what stays the same are read from one table; a table of one solid shows no pattern.", "role": "outcome task"}, {"id": "SK-GE-25", "t": "SK", "g": 8, "s": "Constructs a triangle from its three sides with compasses and a straight edge.", "action": "constructs", "content": "a triangle from three given side lengths", "cond": "side lengths from 2 cm to 8 cm to the nearest half centimetre that satisfy the triangle condition; compasses and a straight edge marked in centimetres; response: the construction with the arcs left visible", "ex": "Construct triangle ABC with AB = 4.5 cm, BC = 5.5 cm and AC = 7 cm.", "sep": "SK-GE-26", "sepl": "A learner constructs a triangle with sides 4.5 cm, 5.5 cm and 7 cm correctly, but for the quadrilateral ABCD with diagonal AC = 7 cm draws triangle ACD on the same side of AC as triangle ABC, so that the two triangles overlap.", "stop": "The base, the two arcs and the joins make one construction; no smaller task shows a triangle constructed.", "role": "step"}, {"id": "SK-GE-26", "t": "SK", "g": 8, "s": "Constructs a quadrilateral from its four sides and one diagonal with compasses and a straight edge.", "action": "constructs", "content": "a quadrilateral from four sides and a diagonal", "cond": "lengths from 2 cm to 8 cm to the nearest half centimetre, the five lengths forming two triangles that can be constructed on the diagonal; compasses and a straight edge marked in centimetres; response: the construction with the arcs left visible", "ex": "Construct quadrilateral ABCD with AB = 4.5 cm, BC = 5.5 cm, CD = 4 cm, AD = 6 cm and AC = 7 cm.", "sep": "SK-GE-27", "sepl": "A learner constructs ABCD from four sides and a diagonal correctly, but for LIFT with LI = 4 cm, IF = 3 cm, TL = 2.5 cm, LF = 4.5 cm and IT = 4 cm uses IT as the distance of T from L, so that LT = 4 cm instead of 2.5 cm.", "stop": "Constructing the two triangles on the diagonal is one sequence; no smaller task shows the quadrilateral constructed.", "role": "outcome task"}, {"id": "SK-GE-27", "t": "SK", "g": 8, "s": "Constructs a quadrilateral from its two diagonals and three sides with compasses and a straight edge.", "action": "constructs", "content": "a quadrilateral from two diagonals and three sides", "cond": "lengths from 2 cm to 10 cm to the nearest half centimetre, the five lengths forming a first triangle from two sides and a diagonal and a fourth vertex that the remaining side and diagonal reach; compasses and a straight edge marked in centimetres; response: the construction with the arcs left visible", "ex": "Construct quadrilateral LIFT with LI = 4 cm, IF = 3 cm, TL = 2.5 cm, LF = 4.5 cm and IT = 4 cm.", "sep": "SK-GE-26", "sepl": "A learner constructs LIFT from two diagonals and three sides correctly, but for ABCD with four sides and the diagonal AC draws AB, BC and CD as a chain and tries to place D by measuring AD = 6 cm along a direction chosen by eye.", "stop": "Constructing the first triangle and locating the fourth vertex by two arcs is one sequence; no smaller task shows the quadrilateral constructed.", "role": "outcome task"}, {"id": "SK-GE-28", "t": "SK", "g": 8, "s": "Constructs a quadrilateral from two adjacent sides and the angles at the three vertices of those sides with compasses and a straight edge.", "action": "constructs", "content": "a quadrilateral from two adjacent sides and three angles", "cond": "sides from 3 cm to 8 cm to the nearest half centimetre; the three angles whole numbers of degrees from 45° to 135° with the fourth angle less than 180°; compasses and a straight edge marked in centimetres, with a protractor used only to set the angles; response: the construction", "ex": "Construct quadrilateral MORE with MO = 6 cm, OR = 4.5 cm, ∠M = 60°, ∠O = 105° and ∠R = 105°.", "sep": "SK-GE-29", "sepl": "A learner constructs MORE correctly from two sides and three angles, but for ABCD with AB = 4 cm, BC = 5 cm, CD = 6.5 cm, ∠B = 105° and ∠C = 80° draws the angles at A and D instead of at the ends of BC.", "stop": "Drawing the two sides, then the three angle arms, then marking the fourth vertex is one sequence; no smaller task shows the quadrilateral constructed.", "role": "outcome task"}, {"id": "SK-GE-29", "t": "SK", "g": 8, "s": "Constructs a quadrilateral from three sides and the two angles between them with compasses and a straight edge.", "action": "constructs", "content": "a quadrilateral from three sides and the two included angles", "cond": "sides from 3 cm to 8 cm to the nearest half centimetre; the two angles whole numbers of degrees from 45° to 135°; compasses and a straight edge marked in centimetres, with a protractor used only to set the angles; response: the construction", "ex": "Construct quadrilateral ABCD with AB = 4 cm, BC = 5 cm, CD = 6.5 cm, ∠B = 105° and ∠C = 80°.", "sep": "SK-GE-28", "sepl": "A learner constructs ABCD from three sides and two included angles correctly, but for MORE with MO = 6 cm, OR = 4.5 cm, ∠M = 60°, ∠O = 105° and ∠R = 105° draws MO and OR with ∠O and joins M to R, without drawing the angles at M and R.", "stop": "Drawing the middle side, the two angle arms, the two outer sides and the closing join is one sequence; no smaller task shows the quadrilateral constructed.", "role": "outcome task"}, {"id": "SK-GE-30", "t": "SK", "g": 8, "s": "Constructs a parallelogram from two adjacent sides and the angle between them with compasses and a straight edge.", "action": "constructs", "content": "a parallelogram from two adjacent sides and the included angle", "cond": "sides from 3 cm to 8 cm to the nearest half centimetre; the angle a whole number of degrees from 45° to 135°; compasses and a straight edge marked in centimetres, with a protractor used only to set the angle; response: the construction", "ex": "Construct parallelogram ABCD with AB = 5 cm, AD = 3.5 cm and ∠A = 60°.", "sep": "SK-GE-29", "sepl": "A learner constructs a quadrilateral from three sides and two included angles correctly, but for parallelogram ABCD with ∠A = 60° draws ∠B = 60° as well, treating adjacent angles as equal.", "stop": "Drawing the angle, the two sides and finding the fourth vertex by two arcs is one sequence; no smaller task shows the parallelogram constructed.", "role": "outcome task"}, {"id": "SK-GE-31", "t": "SK", "g": 8, "s": "Constructs a rhombus from its two diagonals with compasses and a straight edge.", "action": "constructs", "content": "a rhombus from two diagonals", "cond": "diagonals from 4 cm to 10 cm to the nearest tenth of a centimetre; compasses and a straight edge marked in centimetres; response: the construction with the arcs of the perpendicular bisector left visible", "ex": "Construct a rhombus whose diagonals are 5.2 cm and 6.4 cm.", "sep": "SK-GE-30", "sepl": "A learner constructs a parallelogram from two sides and an angle correctly, but for a rhombus with diagonals 5.2 cm and 6.4 cm draws the diagonals so that they cross at 60° instead of at right angles.", "stop": "Drawing one diagonal, its perpendicular bisector and marking the other diagonal on it is one sequence; no smaller task shows the rhombus constructed.", "role": "outcome task"}, {"id": "SK-GE-32", "t": "SK", "g": 8, "s": "Constructs a rectangle or a square from the lengths of two adjacent sides with compasses and a straight edge.", "action": "constructs", "content": "a rectangle, or a square when the two sides are equal, from two adjacent sides", "cond": "sides from 3 cm to 8 cm to the nearest half centimetre; compasses and a straight edge marked in centimetres; response: the construction with the arcs of the perpendiculars left visible", "ex": "Construct a rectangle with adjacent sides 5 cm and 4 cm. Construct a square of side 4.5 cm.", "sep": "SK-GE-31", "sepl": "A learner constructs a rectangle with sides 5 cm and 4 cm correctly, but for a rhombus with diagonals 5.2 cm and 6.4 cm draws the diagonals so that they cross at right angles but are not bisected, so the four sides are not equal.", "stop": "Drawing the base, the two perpendiculars and marking the opposite side is one sequence; a square is the same sequence with equal sides.", "role": "outcome task"}, {"id": "SK-ME-01", "t": "SK", "g": 8, "s": "Finds the area of a triangle from its base and its perpendicular height.", "action": "finds", "content": "the area of a triangle", "cond": "acute, right-angled and obtuse triangles, with the height inside or outside the triangle; slanting sides may be shown as extra lengths; lengths in cm or m, whole numbers or one decimal place; response: area with square units", "ex": "A triangle has base 12 cm, perpendicular height 7.5 cm and slanting sides 9 cm and 10 cm. Find its area.", "sep": "SK-ME-02", "sepl": "A learner finds the area of a parallelogram with base 12 cm and height 7.5 cm as 90 cm², but gives 90 cm² for the triangle with the same base and height, leaving out the half.", "stop": "Triangles of every shape use one formula with the height at right angles to the base; splitting by type of triangle gives tasks of one type.", "role": "outcome task"}, {"id": "SK-ME-02", "t": "SK", "g": 8, "s": "Finds the area of a parallelogram from its base and its perpendicular height.", "action": "finds", "content": "the area of a parallelogram", "cond": "parallelograms drawn in different orientations, with the slanting side also given; lengths in cm or m, whole numbers or one decimal place; response: area with square units", "ex": "A parallelogram has base 9 cm, slanting side 5 cm and perpendicular height 4 cm. Find its area.", "sep": "SK-ME-01", "sepl": "A learner finds the area of a parallelogram with base 8 cm and height 5 cm as 40 cm² but gives the area of a triangle with base 8 cm and height 5 cm as 40 cm² too, leaving out the half.", "stop": "One formula covers every parallelogram, rectangles included; splitting by orientation gives tasks of one type.", "role": "outcome task"}, {"id": "SK-ME-03", "t": "SK", "g": 8, "s": "Finds the area of a trapezium from its two parallel sides and the perpendicular distance between them.", "action": "finds", "content": "the area of a trapezium", "cond": "trapeziums including right-angled and isosceles ones, parallel sides drawn horizontal or vertical; slanting sides may be shown as extra lengths; lengths in cm or m, whole numbers or one decimal place; response: area with square units", "ex": "A trapezium-shaped plot has parallel sides 8 m and 14 m, which are 5 m apart. Find its area.", "sep": "SK-ME-01", "sepl": "A learner finds the area of a triangle with base 12 cm and height 7.5 cm as 45 cm², but gives the area of the plot as 8 × 14 × 5 = 560 m², multiplying the two parallel sides.", "stop": "One formula covers every trapezium; splitting by type of trapezium gives tasks of one type.", "role": "outcome task"}, {"id": "SK-ME-11", "t": "SK", "g": 8, "s": "Finds the volume of a cuboid or a cube from its edge lengths.", "action": "finds", "content": "the volume of a cuboid or a cube", "cond": "length, width and height given in the same unit, cm or m, whole numbers or one decimal place; a cube given by one edge; response: volume with cubic units (cm³ or m³)", "ex": "A box is 12 cm long, 8 cm wide and 5 cm high. Find its volume.", "sep": "SK-ME-12", "sepl": "A learner finds the volume of the box as 480 cm³, but gives its surface area as 12 × 8 + 8 × 5 + 12 × 5 = 196 cm², counting each pair of opposite faces once.", "stop": "A cube is a cuboid with equal edges, so cubes and cuboids give one task type.", "role": "outcome task"}, {"id": "SK-ME-12", "t": "SK", "g": 8, "s": "Finds the total surface area of a cuboid or a cube from its edge lengths.", "action": "finds", "content": "the total surface area of a cuboid or a cube", "cond": "length, width and height given in the same unit, cm or m, whole numbers or one decimal place; a cube given by one edge; all six faces counted; response: area with square units (cm² or m²)", "ex": "Find the total surface area of a box 12 cm long, 8 cm wide and 5 cm high.", "sep": "SK-ME-11", "sepl": "A learner finds the volume of a cube with edge 5 cm as 125 cm³, but gives its surface area as 4 × 25 = 100 cm², counting only the four side faces.", "stop": "The six faces of a cuboid are three pairs of equal rectangles in every task; boxes without a lid are a condition of the problem skill SK-ME-14.", "role": "outcome task"}, {"id": "SK-ME-14", "t": "SK", "g": 8, "s": "Solves a problem from a real-life situation that needs the volume or the surface area of a cuboid or a cube.", "action": "solves", "content": "a situation that calls for the volume or the surface area of a cuboid or a cube, sometimes followed by a cost or a count", "cond": "situation in words: filling a tank or a box, packing cubes into a box, painting the walls of a room, making or wrapping a box, including a box or tank without a lid; edges in m and cm, written in one unit where needed; may end with a cost or a count; two to four steps; response: the answer with units and its meaning in the situation", "ex": "An open water tank is 2 m long, 1.5 m wide and 1 m deep. Find the area of metal sheet needed to make it.", "sep": "SK-ME-12", "sepl": "A learner finds the total surface area of a 2 m by 1.5 m by 1 m cuboid as 13 m², but for the open tank also gives 13 m², including the top that the tank does not have.", "stop": "Deciding from the situation between volume and surface area, and which faces count, is one decision; the calculations inside it are separate step skills.", "role": "outcome task"}, {"id": "SK-ME-15", "t": "SK", "g": 8, "s": "Estimates the area of a polygon drawn on a square grid by counting the full squares and the part squares it covers.", "action": "estimates", "content": "the area of a polygon drawn on a square grid, from the squares it covers", "cond": "trapezium, quadrilateral, pentagon or hexagon with its vertices at grid points, drawn on a grid of 1 cm squares; the area is up to 50 cm²; squares covered by more than half, by half and by less than half all occur; response: the estimate in square centimetres", "ex": "A trapezium is drawn on a grid of 1 cm squares. Its parallel sides, 10 cm and 6 cm long, lie along grid lines 4 cm apart, and each slanting side runs 2 cm across. Count the squares it covers and write an estimate of its area.", "sep": "SK-ME-16", "sepl": "A learner finds the area of this trapezium as 32 cm² by the formula, but counts only the 28 full squares on the grid and gives 28 cm² as the estimate, leaving out the part squares.", "stop": "Counting the full squares and judging the part squares are done together in every task; the full squares alone do not give the estimate.", "role": "outcome task"}, {"id": "SK-ME-16", "t": "SK", "g": 8, "s": "Verifies an estimate of the area of a polygon drawn on a square grid by finding its area with a formula and comparing the two values.", "action": "verifies", "content": "an estimate of an area, checked against the area found by a formula", "cond": "trapezium, quadrilateral with a diagonal along a grid line, or pentagon or hexagon that splits into triangles and trapeziums along grid lines; grid of 1 cm squares with the vertices at grid points; the lengths for the formula read off the grid by counting units; the estimate given as a number of square centimetres; response: the area by the formula, the difference from the estimate, and a statement whether the estimate is close", "ex": "On a grid of 1 cm squares a trapezium has parallel sides of 10 cm and 6 cm, 4 cm apart. A learner counted squares and estimated its area as 33 cm². Find the area by the formula and say whether the estimate is close.", "sep": "SK-ME-15", "sepl": "A learner estimates the area of a trapezium by counting as 33 cm² and finds 1/2 × (10 + 6) × 4 = 32 cm² by the formula, but states that the estimate is wrong because 33 is not equal to 32.", "stop": "Finding the area by formula and comparing it with the estimate are one act of checking; the formula for each shape is the task of a skill of LO-M817.", "role": "outcome task"}, {"id": "SK-ME-17", "t": "SK", "g": 8, "s": "Finds the area of a quadrilateral from one diagonal and the perpendiculars to it from the two opposite vertices.", "action": "finds", "content": "the area of a quadrilateral as the sum of the areas of the two triangles on its diagonal", "cond": "convex quadrilaterals with one diagonal and the two perpendiculars to it drawn and marked; lengths in cm or m, whole numbers or one decimal place; response: area with square units", "ex": "In quadrilateral ABCD the diagonal AC is 12 cm long. The perpendiculars from B and D to AC are 4 cm and 5 cm long. Find the area of ABCD.", "sep": "SK-ME-01", "sepl": "A learner finds the area of a triangle with base 12 cm and height 4 cm as 24 cm², but gives the area of quadrilateral ABCD, with diagonal AC = 12 cm and perpendiculars 4 cm and 5 cm, as 24 cm², using one perpendicular and leaving out triangle ACD.", "stop": "Both triangles on the diagonal are found and added by one formula in every task; the area of a single triangle is the task of SK-ME-01.", "role": "outcome task"}, {"id": "SK-ME-18", "t": "SK", "g": 8, "s": "Finds the area of a rhombus from the lengths of its two diagonals.", "action": "finds", "content": "the area of a rhombus", "cond": "both diagonals given in cm or m, whole numbers or one decimal place, in a drawing or in words; response: area with square units", "ex": "A tile is a rhombus with diagonals 12 cm and 9 cm long. Find the area of the tile.", "sep": "SK-ME-17", "sepl": "A learner finds the area of quadrilateral ABCD, with diagonal 12 cm and perpendiculars 4 cm and 5 cm, as 54 cm², but gives the area of a rhombus with diagonals 12 cm and 9 cm as 12 × 9 = 108 cm², leaving out the half.", "stop": "One formula uses the two diagonals; no smaller part can be practised apart.", "role": "outcome task"}, {"id": "SK-ME-19", "t": "SK", "g": 8, "s": "Finds the area of a pentagon or a hexagon by splitting it into triangles and trapeziums.", "action": "finds", "content": "the area of a pentagon or a hexagon as the sum of the areas of triangles and trapeziums", "cond": "pentagon or hexagon drawn with one diagonal and the perpendicular distances from the other vertices to it marked; two to four pieces; lengths in cm or m, whole numbers or one decimal place; response: area with square units and working that shows each piece", "ex": "In pentagon ABCDE the diagonal AD is 12 cm long. The perpendiculars from B and C to AD meet it at M and N, with AM = 3 cm, ND = 2 cm, BM = 4 cm and CN = 5 cm. The perpendicular from E to AD is 3 cm long. Find the area of ABCDE.", "sep": "SK-ME-17", "sepl": "A learner finds the area of a quadrilateral from a diagonal and two perpendiculars correctly, but gives the area of pentagon ABCDE as 6 + 31.5 + 5 = 42.5 cm², adding the three pieces on one side of AD and leaving out triangle ADE of 18 cm².", "stop": "Choosing the pieces, finding each area and adding are carried out together in every task; the formula for one piece is the task of SK-ME-01 or SK-ME-03.", "role": "outcome task"}, {"id": "SK-ME-20", "t": "SK", "g": 8, "s": "Finds the lateral surface area of a cuboid or a cube from its edge lengths.", "action": "finds", "content": "the area of the four side faces of a cuboid or a cube", "cond": "length, width and height given in the same unit, cm or m, whole numbers or one decimal place; a cube given by one edge; the top and the bottom not counted; response: area with square units (cm² or m²)", "ex": "Find the area of the four walls of a hall 10 m long, 8 m wide and 4 m high.", "sep": "SK-ME-12", "sepl": "A learner finds the total surface area of a box 12 cm long, 8 cm wide and 5 cm high as 392 cm², but gives its lateral surface area as 392 cm², counting the top and the bottom as well.", "stop": "The four side faces are two pairs of equal rectangles in every task, and a cube is a cuboid with equal edges, so cubes and cuboids give one task type.", "role": "outcome task"}, {"id": "SK-ME-21", "t": "SK", "g": 8, "s": "Finds the volume of a cylinder from its radius or its diameter and its height.", "action": "finds", "content": "the volume of a cylinder", "cond": "radius or diameter and height given in the same unit, cm or m, whole numbers or one decimal place; π given as 22/7 or 3.14 in the task; response: volume with cubic units (cm³ or m³)", "ex": "A cylindrical drum has diameter 14 cm and height 10 cm. Find its volume. Use π = 22/7.", "sep": "SK-ME-22", "sepl": "A learner finds the curved surface area of a cylinder with radius 7 cm and height 10 cm as 440 cm², but gives its volume as 22/7 × 7 × 10 = 220 cm³, using r in place of r².", "stop": "Starting from the radius or from the diameter differs by one halving inside the same task type.", "role": "outcome task"}, {"id": "SK-ME-22", "t": "SK", "g": 8, "s": "Finds the curved surface area of a cylinder from its radius or its diameter and its height.", "action": "finds", "content": "the area of the curved surface of a cylinder", "cond": "radius or diameter and height given in the same unit, cm or m, whole numbers or one decimal place; π given as 22/7 or 3.14 in the task; the two circular ends not counted; response: area with square units (cm² or m²)", "ex": "A cylindrical tin has radius 7 cm and height 10 cm. Find the area of its curved surface, where the label goes. Use π = 22/7.", "sep": "SK-ME-21", "sepl": "A learner finds the volume of a cylinder with radius 7 cm and height 10 cm as 1540 cm³, but gives its curved surface area as 22/7 × 7 × 10 = 220 cm², leaving out the factor 2.", "stop": "Starting from the radius or from the diameter differs by one halving inside the same task type.", "role": "outcome task"}, {"id": "SK-ME-23", "t": "SK", "g": 8, "s": "Finds the total surface area of a closed cylinder from its radius or its diameter and its height.", "action": "finds", "content": "the total surface area of a cylinder, the curved surface and the two circular ends", "cond": "radius or diameter and height given in the same unit, cm or m, whole numbers or one decimal place; π given as 22/7 or 3.14 in the task; both circular ends counted; response: area with square units (cm² or m²)", "ex": "Find the total surface area of a closed cylindrical tin with radius 7 cm and height 10 cm. Use π = 22/7.", "sep": "SK-ME-22", "sepl": "A learner finds the curved surface area of the tin as 440 cm², but gives its total surface area as 440 + 154 = 594 cm², adding the area of one circular end and leaving out the other.", "stop": "The curved surface and the two ends are found and added by one formula in every task; the curved surface alone is the task of SK-ME-22.", "role": "outcome task"}, {"id": "SK-ME-24", "t": "SK", "g": 8, "s": "Converts a volume between cubic centimetres, cubic metres and litres.", "action": "converts", "content": "a volume or a capacity written in cm³, m³ or litres", "cond": "cm³ to litres and litres to cm³, m³ to cm³, and m³ to litres and litres to m³; amounts that are whole numbers or have one decimal place; one conversion in each task; response: the amount in the unit asked for", "ex": "Write 2.5 m³ in litres.", "sep": "SK-ME-11", "sepl": "A learner finds the volume of a tank 2 m long, 1.5 m wide and 1 m deep as 3 m³, but writes 3 m³ as 300 cm³, using 1 m³ = 100 cm³.", "stop": "Each task is one multiplication or division by 1000 or by 1 000 000; no smaller part can be practised apart.", "role": "step"}, {"id": "SK-ME-25", "t": "SK", "g": 8, "s": "Solves a problem from a real-life situation that needs the volume, the capacity or the surface area of a cuboid, a cube or a cylinder.", "action": "solves", "content": "a situation that calls for a volume, a capacity or a surface area of a cuboid, a cube or a cylinder, sometimes followed by a cost or a count", "cond": "situation in words, with a diagram where useful: filling a tank, a drum or a cistern and giving its capacity in litres, packing, painting the four walls of a room or the curved surface of a pillar, wrapping a box, making a tin, a garden roller, including a tank or a box without a lid; dimensions in m and cm, written in one unit where needed; π given as 22/7 or 3.14; may need a conversion of volume to litres or between m³ and cm³; may end with a cost or a count; two to four steps; response: the answer with units and its meaning in the situation", "ex": "A cylindrical tank has radius 0.7 m and height 2 m. How many litres of water does it hold when full? Use π = 22/7.", "sep": "SK-ME-21", "sepl": "A learner finds the volume of a cylindrical tank with radius 0.7 m and height 2 m as 3.08 m³ when asked for the volume, but when asked how many litres it holds gives 3.08 litres, leaving out the conversion.", "stop": "Deciding from the situation which measure is needed, and which faces count, is one decision; the calculations inside it are separate step skills, and a split by context gives tasks of one type.", "role": "outcome task"}, {"id": "SK-PR-05", "t": "SK", "g": 8, "s": "Calculates the theoretical probability of an event in an experiment of one stage with equally likely outcomes.", "action": "calculates", "content": "the theoretical probability of an event, one stage", "cond": "a fair coin, a fair die with 4, 6, 8 or 12 faces, a spinner with up to 10 equal sectors, or a counter, card or letter taken at random from up to 52 items; events described in words, including 'not' events; answer as a fraction in simplest form, or as a decimal or percentage when asked", "ex": "A bag holds 5 red, 3 blue and 4 green counters. One counter is taken at random. Find the probability that it is (a) blue, (b) not red.", "sep": "SK-PR-08", "sepl": "A learner finds the experimental probability of blue as 21/50 from 50 recorded spins of a three-sector spinner but gives the probability of blue for the same spinner, worked out from its equal sectors, as 21/50 again instead of 1/3.", "stop": "Counting the outcomes in the event and in the sample space and writing their ratio is one procedure practised as a whole.", "role": "step"}, {"id": "SK-PR-08", "t": "SK", "g": 8, "s": "Calculates the experimental probability of an event from the recorded results of trials.", "action": "calculates", "content": "the experimental probability of an event", "cond": "20 to 200 trials, from a simulation the learner has run and recorded in a tally or frequency table, or results given in a table; answer as a fraction, a decimal or a percentage as asked", "ex": "A spinner with three equal sectors was spun 50 times: red 18, blue 21, yellow 11. Find the experimental probability of landing on blue, as a decimal and as a percentage.", "sep": "SK-PR-05", "sepl": "A learner gives the theoretical probability of blue on the spinner as 1/3 but, asked for the experimental probability after the 50 recorded spins, writes 1/3 again instead of 21/50 = 0.42.", "stop": "One division of the number of successes by the number of trials.", "role": "step"}, {"id": "SK-DA-19", "t": "SK", "g": 8, "s": "Draws a bar graph of a data set from a table, with a scale the learner chooses.", "action": "draws", "content": "a bar graph of one data set", "cond": "table of 4 to 8 categories with whole-number values from 5 to 500; categories such as sports, months, subjects, years; graph paper; scale chosen by the learner; bars of equal width with equal gaps; both axes labelled and the graph titled", "ex": "The table shows the number of Class 8 students whose favourite sport is Cricket 45, Football 30, Hockey 15, Kabaddi 20, Kho-kho 10. Draw a bar graph on graph paper, choosing a scale.", "sep": "SK-DA-20", "sepl": "A learner draws a bar graph of the five sports correctly but, for boys 25, 20, 15 and girls 35, 10, 5 in cricket, football and hockey, draws the girls' bar over the boys' bar in the same place, shades both alike and gives no key.", "stop": "Marking the axes, drawing each bar to its length and labelling are done together in every graph and cannot be evidenced apart; choosing the scale is split off as SK-DA-21.", "role": "outcome task"}, {"id": "SK-DA-20", "t": "SK", "g": 8, "s": "Draws a double bar graph of two data sets for the same categories from a table, with a key and a scale the learner chooses.", "action": "draws", "content": "a double bar graph of two data sets", "cond": "table of 3 to 6 categories with two whole-number values each, from 5 to 500; contexts such as boys and girls, marks in two terms, rainfall in two years; graph paper; one scale for both data sets; two shades and a key; both axes labelled and the graph titled", "ex": "The table gives the marks of one student in the half-yearly and the annual examination: Maths 60 and 75, Science 55 and 68, English 70 and 64, Hindi 62 and 80. Draw a double bar graph with a key.", "sep": "SK-DA-19", "sepl": "A learner draws a double bar graph with the half-yearly and annual bars side by side and shaded differently but gives no key, so the reader cannot tell which shade is which examination.", "stop": "Placing the two bars of each category side by side, shading them and writing the key are done together in every graph.", "role": "outcome task"}, {"id": "SK-DA-21", "t": "SK", "g": 8, "s": "Chooses a scale for the axis of a bar graph so that the greatest value fits on the axis and the divisions are equal.", "action": "chooses", "content": "a scale for the value axis of a bar graph", "cond": "4 to 8 whole-number values from 5 to 500; axis of 10 to 20 cm or 10 to 20 squares of graph paper; scale of 1 division for 1, 2, 5, 10, 20, 50 or 100 units; written as, for example, 1 cm = 10 students", "ex": "The values are 45, 30, 15, 20 and 10 and the axis is 10 cm long. Write a scale and say how long the bar for 45 is.", "sep": "SK-DA-19", "sepl": "A learner writes the scale 1 cm = 5 students for the values 45, 30, 15, 20 and 10 but draws the bars 4.5 cm, 3 cm, 1.5 cm, 2 cm and 1 cm long, dividing each value by 10 instead of by 5.", "stop": "Choosing the scale and stating the bar length it gives for one value can be practised apart from drawing the whole graph; a smaller part is only dividing a value by the scale, which gives no new task type.", "role": "step"}, {"id": "SK-DA-22", "t": "SK", "g": 8, "s": "Draws a pie chart of a data set from a table, with each sector drawn to its central angle using a protractor.", "action": "draws", "content": "a pie chart of one data set", "cond": "table of 3 to 6 categories with whole-number values whose total divides 360 (such as 12, 24, 30, 36, 40, 60, 72, 90), or with percentages that give whole-number central angles; contexts such as hours in a day, favourite colours, modes of travel to school; circle drawn with compasses, radius 4 to 6 cm, on plain paper; sectors labelled", "ex": "Priya spends the 24 hours of a day as follows: sleep 8, school 6, homework 4, play 2, other 4. Draw a pie chart.", "sep": "SK-DA-23", "sepl": "A learner finds the angles 120°, 90°, 60°, 30° and 60° for Priya's day correctly but measures every angle from the same horizontal line, so the sectors overlap and part of the circle is left empty.", "stop": "Drawing the circle, marking each sector from the end of the one before and labelling are done together in every chart; finding the angles is split off as SK-DA-23.", "role": "outcome task"}, {"id": "SK-DA-23", "t": "SK", "g": 8, "s": "Finds the central angle of each sector of a pie chart from the values or percentages in a table.", "action": "finds", "content": "the central angle of a sector of a pie chart", "cond": "3 to 6 categories; whole-number values whose total divides 360 (such as 12, 24, 30, 36, 40, 60, 72, 90), or whole-number percentages that give whole-number angles; written working as a fraction of 360°; angles checked to add up to 360°", "ex": "Priya spends 8 hours sleeping, 6 at school, 4 on homework, 2 at play and 4 on other things in a day of 24 hours. Find the central angle of each sector.", "sep": "SK-DA-22", "sepl": "A learner finds 120°, 90°, 60°, 30° and 60° for Priya's day correctly but, drawing the chart, measures every angle from the same horizontal line, so the sectors overlap.", "stop": "Writing a value as a fraction of the total and multiplying by 360° is one procedure; a smaller part is a single multiplication with no new task type.", "role": "step"}, {"id": "SK-DA-24", "t": "SK", "g": 8, "s": "Writes the share of the whole shown by a sector of a pie chart as a fraction or a percentage.", "action": "writes", "content": "the share of the whole shown by one sector of a pie chart", "cond": "pie chart of 3 to 6 sectors with the central angle of each sector given in degrees (multiples of 5), or the share given as a percentage; fraction in simplest form with denominator up to 36, or percentage up to one decimal place; written answer", "ex": "In a pie chart of Priya's day, the sector for school has a central angle of 90°. What fraction of the day is this, and what percentage?", "sep": "SK-DA-25", "sepl": "A learner writes that the 80° sector of a pie chart of 540 marks shows 2/9 of the marks but, asked how many marks the sector shows, answers 80 marks, reading the angle as the quantity.", "stop": "Writing the angle over 360, simplifying and, when asked, converting to a percentage are done together in every task.", "role": "outcome task"}, {"id": "SK-DA-25", "t": "SK", "g": 8, "s": "Finds the quantity shown by a sector of a pie chart from the total of the data.", "action": "finds", "content": "the quantity shown by one sector of a pie chart", "cond": "pie chart of 3 to 6 sectors with the central angle of the sector given in degrees (multiples of 5), or its share given as a percentage; total from 100 to 1000 (marks, rupees, students, people) chosen so that the quantity is a whole number; written working and answer with its unit", "ex": "A pie chart shows how a student's 540 marks are divided over five subjects. The sector for Mathematics has a central angle of 80°. How many marks are shown for Mathematics?", "sep": "SK-DA-24", "sepl": "A learner finds 540 × 80/360 = 120 marks for the 80° sector but, asked what fraction of the total the sector shows, writes 80/100 = 4/5, reading degrees as a percentage.", "stop": "Taking the sector's share of the total is one calculation; the share and the multiplication are done together in every task.", "role": "outcome task"}, {"id": "SK-DA-26", "t": "SK", "g": 8, "s": "Answers questions about a bar graph or a double bar graph by reading the values of bars and comparing categories.", "action": "answers", "content": "questions about the values and categories of a bar graph or double bar graph", "cond": "graph of 4 to 8 categories on a scale marked in 1s, 2s, 5s, 10s, 20s, 50s or 100s, with values on marked divisions or halfway between them; questions ask for the value of a category, the greatest or least, the difference between two categories, or, in a double bar graph, the category with the greater value in one data set or the greatest difference between the two; contexts such as sales, marks, rainfall, population; written answers with units", "ex": "A bar graph with 1 division = 10 bicycles shows bicycles sold in six months: January 40, February 55, March 70, April 45, May 60, June 85. In which month were the most bicycles sold? How many more were sold in March than in January?", "sep": "SK-DA-19", "sepl": "A learner draws a bar graph correctly from a table but, reading a given graph where 1 square = 20 vehicles and the bar for Tuesday ends at the 7th square, answers 7 vehicles instead of 140.", "stop": "Reading a bar's value and comparing it with another bar are done together in the same question; a double bar graph differs only in the key.", "role": "outcome task"}, {"id": "SK-PR-09", "t": "SK", "g": 8, "s": "Writes, as a fraction, the chance that an event happens in a further trial, using the recorded results of earlier trials of the same experiment.", "action": "writes", "content": "the chance of an event in a further trial, from earlier results", "cond": "records of 20 to 200 trials or observations in a tally or frequency table or a list: tosses of a coin, throws of a die, spins of a spinner, or daily-life records such as days of rain in a month or matches won; events of one outcome or of several outcomes (for example 'an even number'); fraction in simplest form, written as a sentence about the next trial", "ex": "A die was thrown 60 times and a 4 came up 12 times. Write the chance, as a fraction in simplest form, that a 4 comes up on the next throw.", "sep": "SK-PR-08", "sepl": "A learner writes 22/100 = 11/50 as the fraction of 6s in 100 recorded throws but, asked for the chance of a 6 on the next throw, answers that nobody can say because the next throw has not happened yet.", "stop": "Finding the fraction from the record (SK-PR-08) and stating it as the chance of the next trial are done together; the part that cannot be practised apart from the record is the statement about the next trial.", "role": "outcome task"}, {"id": "SK-PR-10", "t": "SK", "g": 8, "s": "Predicts how many times an event will happen in a stated number of further trials, using the chance found from earlier trials.", "action": "predicts", "content": "the number of times an event happens in further trials", "cond": "earlier results of 20 to 200 trials given in a table or list (coin, die, spinner, or a daily-life record); further trials from 100 to 1000, chosen so that the expected number is a whole number; answer written as 'about N times'", "ex": "In 50 tosses of a coin, heads came up 21 times. Using this record, how many heads do you expect in 200 more tosses?", "sep": "SK-PR-09", "sepl": "A learner writes the chance of an event as 7/20 from 40 earlier trials but, asked how many times it will happen in 200 further trials, answers 1400 by multiplying 7 by 200.", "stop": "Finding the chance and taking that fraction of the number of further trials are done together in every task.", "role": "outcome task"}, {"id": "SK-PR-11", "t": "SK", "g": 8, "s": "Says whether the recorded result of repeated trials of a coin, a die or a spinner is close to the result expected from the theoretical probability of the event.", "action": "says", "content": "whether a recorded result agrees with the theoretical probability", "cond": "40 to 200 trials of a fair coin, a six-faced die, a spinner with equal sectors, or a counter drawn at random from a bag and put back; one event of one or several outcomes; recorded count chosen to be clearly close to or clearly far from the expected count; the learner writes the two fractions or the expected and recorded counts, then a verdict with a reason in one sentence", "ex": "A coin is tossed 100 times and lands heads 46 times. Write the theoretical probability of heads, the number of heads expected in 100 tosses, and say whether 46 is close to what was expected.", "sep": "SK-PR-09", "sepl": "A learner writes 28/50 = 14/25 as the fraction of heads in 50 tosses and 1/2 as the theoretical probability but says the coin is not fair because 14/25 is not 1/2, expecting the record to equal 1/2 exactly.", "stop": "Finding the two fractions and judging their closeness are done together in every task; the judgement cannot be evidenced without both fractions.", "role": "outcome task"}, {"id": "KI-RN-07", "t": "KI", "g": 7, "fg": 3, "s": "A fraction a/b is a of the b equal parts into which a whole is divided.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-RN-13", "t": "KI", "g": 7, "fg": 6, "s": "Multiplying or dividing the numerator and denominator of a fraction by the same non-zero number gives an equivalent fraction.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RN-54", "t": "KI", "g": 8, "fg": 8, "s": "Addition and multiplication of rational numbers are commutative and associative.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RN-55", "t": "KI", "g": 8, "fg": 8, "s": "Subtraction and division of rational numbers are neither commutative nor associative.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RN-56", "t": "KI", "g": 8, "fg": 8, "s": "The sum, difference and product of two rational numbers is a rational number, and so is the quotient when the divisor is not zero.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RN-57", "t": "KI", "g": 8, "fg": 8, "s": "For rational numbers a, b and c, a(b + c) = ab + ac.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RN-58", "t": "KI", "g": 8, "fg": 8, "s": "For every rational number a, a + 0 = a and a × 1 = a.", "kind": "Principle", "rat": "without", "fail": false}, {"id": "KI-RN-59", "t": "KI", "g": 8, "fg": 8, "s": "Every rational number a has an additive inverse -a, and a + (-a) = 0.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RN-60", "t": "KI", "g": 8, "fg": 8, "s": "Between any two different rational numbers there is another rational number.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RN-61", "t": "KI", "g": 8, "fg": 8, "s": "The mean of two different rational numbers lies between them.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RN-62", "t": "KI", "g": 8, "fg": 8, "s": "To find n rational numbers between two rational numbers, rewrite both with a common denominator large enough that at least n integers lie strictly between the two numerators.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-RN-63", "t": "KI", "g": 8, "fg": 8, "s": "A statement about all rational numbers is shown false by one case in which it fails.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RP-08", "t": "KI", "g": 7, "fg": 7, "s": "Two quantities are in direct proportion when the ratio of corresponding values is the same for every pair.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-RP-09", "t": "KI", "g": 7, "fg": 7, "s": "A percentage is a fraction with denominator 100.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-RP-10", "t": "KI", "g": 7, "fg": 7, "s": "A fraction or a decimal is written as a percentage by multiplying it by 100.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-RP-11", "t": "KI", "g": 7, "fg": 7, "s": "Profit is selling price minus cost price when the selling price is higher, and loss is cost price minus selling price when the cost price is higher.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-RP-12", "t": "KI", "g": 7, "fg": 7, "s": "Profit percent and loss percent are the profit or loss written as a percentage of the cost price.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-RP-14", "t": "KI", "g": 7, "fg": 7, "s": "The amount is the principal plus the interest.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-RP-15", "t": "KI", "g": 8, "fg": 8, "s": "Discount is the marked price minus the selling price, and discount percent is the discount written as a percentage of the marked price.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-RP-16", "t": "KI", "g": 8, "fg": 8, "s": "Sales tax is a stated percentage of the price, added to the price the buyer pays.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-RP-17", "t": "KI", "g": 8, "fg": 8, "s": "When interest is compounded annually at R percent per year, the amount after n years is P(1 + R/100) to the power n.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RP-18", "t": "KI", "g": 8, "fg": 8, "s": "When interest is compounded half-yearly, the rate for each period is half the annual rate and the number of periods is twice the number of years.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RP-19", "t": "KI", "g": 8, "fg": 8, "s": "Two quantities are in inverse proportion when the product of corresponding values is the same for every pair.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-RP-20", "t": "KI", "g": 8, "fg": 8, "s": "If x and y are in direct proportion, x1/y1 = x2/y2 for any two pairs of values.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RP-21", "t": "KI", "g": 8, "fg": 8, "s": "If x and y are in inverse proportion, x1 × y1 = x2 × y2 for any two pairs of values.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RP-23", "t": "KI", "g": 7, "fg": 7, "s": "A quantity A is written as a percentage of a quantity B by computing A/B × 100.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-RP-25", "t": "KI", "g": 8, "fg": 8, "s": "When the selling price is (100 + p) percent of the cost price, the cost price is the selling price × 100 / (100 + p).", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-01", "t": "KI", "g": 8, "fg": 8, "s": "The square of a number n, written n², is n × n.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-NN-02", "t": "KI", "g": 8, "fg": 8, "s": "The cube of a number n, written n³, is n × n × n.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-NN-03", "t": "KI", "g": 8, "fg": 8, "s": "A square number is the square of a whole number.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-NN-04", "t": "KI", "g": 8, "fg": 8, "s": "A cube number is the cube of a whole number.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-NN-05", "t": "KI", "g": 8, "fg": 8, "s": "The square root of a non-negative number m, written √m, is the non-negative number whose square is m.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-NN-06", "t": "KI", "g": 8, "fg": 8, "s": "The cube root of a number m, written ∛m, is the number whose cube is m.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-NN-07", "t": "KI", "g": 7, "fg": 7, "s": "An index applies only to the number or bracket written directly before it, so -3² = -(3²) = -9 while (-3)² = 9.", "kind": "Principle", "rat": "without", "fail": false}, {"id": "KI-RN-25", "t": "KI", "g": 7, "fg": 7, "s": "The product of two integers with the same sign is positive, and the product of two integers with different signs is negative.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RN-30", "t": "KI", "g": 7, "fg": 3, "s": "Single-digit multiplication facts", "kind": "Fact or term", "rat": "without", "fail": true}, {"id": "KI-RN-17", "t": "KI", "g": 7, "fg": 6, "s": "To add or subtract like fractions, add or subtract the numerators and keep the denominator.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-RN-18", "t": "KI", "g": 7, "fg": 6, "s": "To add or subtract fractions with unlike denominators, rewrite them with a common denominator, then add or subtract the numerators.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-RN-19", "t": "KI", "g": 7, "fg": 6, "s": "A common denominator of two fractions is a common multiple of their denominators.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RN-31", "t": "KI", "g": 7, "fg": 7, "s": "The product of two fractions has the product of the numerators as its numerator and the product of the denominators as its denominator.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-RN-34", "t": "KI", "g": 7, "fg": 7, "s": "The reciprocal of a non-zero fraction a/b is b/a, and a number multiplied by its reciprocal is 1.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-RN-38", "t": "KI", "g": 7, "fg": 7, "s": "Multiplying a decimal by 10, 100 or 1000 makes the place value of each digit 10, 100 or 1000 times greater; dividing makes it that many times smaller.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RN-39", "t": "KI", "g": 7, "fg": 7, "s": "To divide by a decimal, multiply the dividend and the divisor by the same power of ten so that the divisor is a whole number, then divide.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-RN-64", "t": "KI", "g": 7, "fg": 3, "s": "For positive numbers, a ÷ b is the number of b's that together make a.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-ME-11", "t": "KI", "g": 7, "fg": 6, "s": "To round a decimal to a given number of decimal places, keep the digits up to that place and increase the last kept digit by one when the next digit is 5 or more.", "kind": "Procedure", "rat": "without", "fail": false}, {"id": "KI-AG-20", "t": "KI", "g": 7, "fg": 7, "s": "To solve a linear equation in which the variable appears once, undo the operations applied to the variable in the reverse order of their application, doing the same to both sides.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-NN-08", "t": "KI", "g": 7, "fg": 6, "s": "An integer n is divisible by a non-zero whole number d when n = d × k for some integer k; for whole numbers this means n is a multiple of d and d is a factor of n.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-NN-09", "t": "KI", "g": 7, "fg": 6, "s": "If one of two integers is divisible by a non-zero whole number d, then their sum is divisible by d exactly when the other integer is divisible by d.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-10", "t": "KI", "g": 7, "fg": 6, "s": "A product of integers is divisible by a non-zero whole number d when one of its factors is divisible by d.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-11", "t": "KI", "g": 8, "fg": 8, "s": "A two-digit number with tens digit a and units digit b is 10a + b, and a three-digit number with hundreds digit a, tens digit b and units digit c is 100a + 10b + c.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-NN-12", "t": "KI", "g": 7, "fg": 6, "s": "10 is divisible by 2 and by 5, and 100 is divisible by 4.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-NN-13", "t": "KI", "g": 8, "fg": 8, "s": "10 = 9 + 1 and 100 = 99 + 1, so each of 10 and 100 is one more than a multiple of 9.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-NN-14", "t": "KI", "g": 8, "fg": 8, "s": "10 = 11 − 1 and 100 = 99 + 1, so 10 is one less than 11 and 100 is one more than 99, a multiple of 11.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-NN-15", "t": "KI", "g": 7, "fg": 6, "s": "Two whole numbers are co-prime when their only common factor is 1.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-NN-16", "t": "KI", "g": 7, "fg": 6, "s": "A whole number divisible by each of two co-prime numbers is divisible by their product.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-17", "t": "KI", "g": 7, "fg": 6, "s": "A whole number is divisible by 2 exactly when its units digit is 0, 2, 4, 6 or 8.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-18", "t": "KI", "g": 7, "fg": 6, "s": "A whole number is divisible by 5 exactly when its units digit is 0 or 5.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-19", "t": "KI", "g": 7, "fg": 6, "s": "A whole number is divisible by 4 exactly when the number formed by its last two digits is divisible by 4.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-20", "t": "KI", "g": 7, "fg": 6, "s": "A whole number is divisible by 3 exactly when the sum of its digits is divisible by 3.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-21", "t": "KI", "g": 7, "fg": 6, "s": "A whole number is divisible by 9 exactly when the sum of its digits is divisible by 9.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-22", "t": "KI", "g": 7, "fg": 6, "s": "A whole number is divisible by 6 exactly when it is divisible by both 2 and 3.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-23", "t": "KI", "g": 7, "fg": 6, "s": "A whole number is divisible by 11 exactly when the difference between the sum of its digits in the odd places and the sum of its digits in the even places, counted from the right, is 0 or divisible by 11.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-24", "t": "KI", "g": 7, "fg": 6, "s": "A prime number is a whole number greater than 1 whose only factors are 1 and itself.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-NN-25", "t": "KI", "g": 7, "fg": 6, "s": "Every whole number greater than 1 can be written as a product of prime numbers, and the primes in the product are the same for every way of writing it, apart from their order.", "kind": "Principle", "rat": "without", "fail": false}, {"id": "KI-NN-26", "t": "KI", "g": 7, "fg": 6, "s": "To write a number as a product of primes, divide it by a prime that divides it, repeat on each quotient until the quotient is 1, and write the divisors as a product.", "kind": "Procedure", "rat": "without", "fail": false}, {"id": "KI-NN-27", "t": "KI", "g": 8, "fg": 8, "s": "A whole number is a perfect square exactly when every prime occurs an even number of times in its prime factorisation, so that its prime factors can be grouped in pairs of equal primes with none left over.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-28", "t": "KI", "g": 8, "fg": 8, "s": "A whole number is a perfect cube exactly when every prime occurs a multiple of three times in its prime factorisation, so that its prime factors can be grouped in triples of equal primes with none left over.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-29", "t": "KI", "g": 8, "fg": 8, "s": "To find the square root of a perfect square by prime factorisation, write its prime factorisation, group equal primes in pairs, and multiply one prime from each pair.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-NN-30", "t": "KI", "g": 8, "fg": 8, "s": "To find the cube root of a perfect cube by prime factorisation, write its prime factorisation, group equal primes in triples, and multiply one prime from each triple.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-NN-31", "t": "KI", "g": 8, "fg": 8, "s": "The sum of the first n odd numbers is n².", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-32", "t": "KI", "g": 8, "fg": 8, "s": "To find the square root of a perfect square by repeated subtraction, subtract the odd numbers 1, 3, 5, … in order from the number until the result is 0; the number of subtractions is the square root.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-NN-33", "t": "KI", "g": 8, "fg": 8, "s": "To find the square root of a whole number by the division method, group its digits in pairs from the right; take as the first digit of the root the largest digit whose square is not more than the first group, subtract, bring down the next pair, and choose each next digit so that the new divisor, which is twice the root so far followed by that digit, multiplied by that digit is not more than the remainder; repeat until no pairs are left.", "kind": "Procedure", "rat": "without", "fail": false}, {"id": "KI-NN-34", "t": "KI", "g": 8, "fg": 8, "s": "To find the square root of a decimal by the division method, group the digits of the whole-number part in pairs leftwards from the decimal point and the digits of the decimal part in pairs rightwards, adding a zero to complete the last pair, divide as for a whole number, and write the decimal point in the root when the first pair after the decimal point is brought down.", "kind": "Procedure", "rat": "without", "fail": false}, {"id": "KI-NN-35", "t": "KI", "g": 8, "fg": 8, "s": "When the division method for a whole number leaves a non-zero remainder after the last pair, write a decimal point after the root and continue by bringing down pairs of zeros; each further pair of zeros gives one more decimal place of an approximate root.", "kind": "Procedure", "rat": "without", "fail": false}, {"id": "KI-NN-36", "t": "KI", "g": 8, "fg": 8, "s": "To find the smallest number by which a number must be multiplied, or divided, to make a perfect square, write its prime factorisation and take the product of the primes that occur an odd number of times.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-NN-37", "t": "KI", "g": 8, "fg": 8, "s": "To find the smallest number by which a number must be divided to make a perfect cube, write its prime factorisation, group equal primes in triples, and divide by the product of the primes left over; to find the smallest number by which it must be multiplied, multiply by the primes needed to complete each incomplete triple.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-NN-38", "t": "KI", "g": 8, "fg": 8, "s": "If a whole number is greater than n² and less than (n + 1)², its square root is greater than n and less than n + 1.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-39", "t": "KI", "g": 7, "fg": 7, "s": "For a number a and a whole number n greater than 1, a^n is a multiplied by itself n times, where a is the base and n is the exponent, and a^1 = a.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-NN-40", "t": "KI", "g": 8, "fg": 8, "s": "For a non-zero number a and integers m and n, a^m × a^n = a^(m + n).", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-41", "t": "KI", "g": 8, "fg": 8, "s": "For a non-zero number a and integers m and n, a^m ÷ a^n = a^(m − n).", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-42", "t": "KI", "g": 8, "fg": 8, "s": "For a non-zero number a and integers m and n, (a^m)^n = a^(m × n).", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-43", "t": "KI", "g": 8, "fg": 8, "s": "For non-zero numbers a and b and an integer m, a^m × b^m = (a × b)^m.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-44", "t": "KI", "g": 8, "fg": 8, "s": "For non-zero numbers a and b and an integer m, a^m ÷ b^m = (a ÷ b)^m.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-45", "t": "KI", "g": 8, "fg": 8, "s": "For a non-zero number a, a^0 = 1.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-NN-46", "t": "KI", "g": 8, "fg": 8, "s": "For a non-zero number a and a positive integer n, a^(−n) = 1 ÷ a^n, so a^(−n) is the reciprocal of a^n.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-NN-47", "t": "KI", "g": 8, "fg": 8, "s": "For non-zero numbers a and b and a positive integer n, (a/b)^(−n) = (b/a)^n.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-48", "t": "KI", "g": 8, "fg": 8, "s": "A power of a negative number is positive when the exponent is an even integer and negative when the exponent is an odd integer.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-49", "t": "KI", "g": 8, "fg": 8, "s": "For a non-zero number a other than 1 and −1, if a^m = a^n for integers m and n, then m = n.", "kind": "Principle", "rat": "without", "fail": false}, {"id": "KI-NN-50", "t": "KI", "g": 8, "fg": 8, "s": "A number is in standard form when it is written as a × 10^n, where 1 ≤ a < 10 and n is an integer.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-NN-51", "t": "KI", "g": 8, "fg": 8, "s": "To write a number in standard form, move the decimal point so that exactly one non-zero digit is before it; the exponent of 10 is the number of places moved, positive when the point moved to the left and negative when it moved to the right.", "kind": "Procedure", "rat": "without", "fail": false}, {"id": "KI-NN-52", "t": "KI", "g": 8, "fg": 8, "s": "Multiplying a number by 10^n moves its decimal point n places to the right when n is positive, and |n| places to the left when n is negative.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-53", "t": "KI", "g": 8, "fg": 8, "s": "Of two numbers a × 10^n and b × 10^m in standard form, the first is greater when n > m, and when n = m it is greater when a > b.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-NN-54", "t": "KI", "g": 8, "fg": 8, "s": "The quotient of a × 10^n by b × 10^m is (a ÷ b) × 10^(n − m).", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-AG-01", "t": "KI", "g": 7, "fg": 6, "s": "A variable is a letter that stands for a number that can take different values.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-AG-02", "t": "KI", "g": 7, "fg": 6, "s": "A number written directly before a letter is multiplied by it, so 3x means 3 × x, x means 1 × x, -x means -1 × x and xy means x × y.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-AG-03", "t": "KI", "g": 7, "fg": 6, "s": "An algebraic expression is a combination of numbers and variables joined by operation signs, and it contains no equals sign.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-AG-04", "t": "KI", "g": 7, "fg": 7, "s": "A term of an algebraic expression is a number, a variable, or a product of numbers and variables, and the terms of an expression are joined by + or − signs.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-AG-06", "t": "KI", "g": 7, "fg": 7, "s": "In a term, the number that multiplies the variables is the coefficient, and a term with no variable is a constant term.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-AG-10", "t": "KI", "g": 7, "fg": 7, "s": "Like terms have the same variables raised to the same powers, so 3x²y and −5x²y are like terms but 3x² and 3x are not.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-AG-11", "t": "KI", "g": 7, "fg": 7, "s": "Like terms are added or subtracted by adding or subtracting their coefficients and keeping the variable part unchanged.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-AG-12", "t": "KI", "g": 7, "fg": 7, "s": "Unlike terms cannot be combined into a single term, so a sum of unlike terms such as 3x + 2y stays as two terms.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-AG-13", "t": "KI", "g": 8, "fg": 8, "s": "To expand a bracket multiplied by a number or a term, multiply every term inside the bracket by that number or term, keeping track of each sign.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-AG-18", "t": "KI", "g": 7, "fg": 6, "s": "An equation states that two expressions have the same value, and a solution of an equation is a value of the variable that makes the two sides equal.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-AG-19", "t": "KI", "g": 7, "fg": 7, "s": "Adding or subtracting the same number or term on both sides of an equation, or multiplying or dividing both sides by the same non-zero number, gives an equation with the same solutions.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-AG-21", "t": "KI", "g": 7, "fg": 6, "s": "A chain of operations is undone by applying the inverse of each operation in the reverse order.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-AG-22", "t": "KI", "g": 7, "fg": 3, "s": "Subtracting a number undoes adding that number, and adding a number undoes subtracting it.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-AG-23", "t": "KI", "g": 7, "fg": 3, "s": "Multiplying by a non-zero number undoes dividing by that number.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-AG-24", "t": "KI", "g": 8, "fg": 8, "s": "To solve a linear equation with the variable on both sides, add or subtract a variable term on both sides so that the variable appears on one side only.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-AG-47", "t": "KI", "g": 7, "fg": 7, "s": "To write an equation for a situation, let a variable stand for one unknown quantity, write the other quantities in terms of it, and set equal two expressions for the same quantity.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-AG-48", "t": "KI", "g": 7, "fg": 7, "s": "The solution of an equation written for a situation answers the question only when it is read as the quantity the variable stands for and fits the conditions of the situation.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-01", "t": "KI", "g": 7, "fg": 6, "s": "The perimeter of a closed shape is the total length of its boundary, measured in units of length.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-RN-20", "t": "KI", "g": 7, "fg": 6, "s": "In a decimal, each place has one-tenth the value of the place to its left.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RN-21", "t": "KI", "g": 7, "fg": 6, "s": "A decimal with n digits after the decimal point is a fraction with denominator 10 to the power n, written in place-value notation.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-RN-24", "t": "KI", "g": 7, "fg": 6, "s": "To add or subtract decimals, line up digits of the same place value, including the decimal points.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-RN-27", "t": "KI", "g": 7, "fg": 3, "s": "Dividing by a non-zero number undoes multiplying by that number.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RN-29", "t": "KI", "g": 7, "fg": 7, "s": "Division by zero is not defined.", "kind": "Fact or term", "rat": "with", "fail": false}, {"id": "KI-RN-32", "t": "KI", "g": 7, "fg": 7, "s": "A fraction of a quantity is that fraction multiplied by the quantity.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-RN-37", "t": "KI", "g": 7, "fg": 7, "s": "To multiply two decimals, multiply them as whole numbers and give the product as many decimal places as the two factors have together.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-RN-74", "t": "KI", "g": 7, "fg": 7, "s": "The product or quotient of two rational numbers with the same sign is positive, and with different signs is negative.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RP-01", "t": "KI", "g": 7, "fg": 6, "s": "The ratio a : b of two quantities of the same kind compares them by division and has no unit.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-RP-03", "t": "KI", "g": 7, "fg": 6, "s": "Multiplying or dividing both terms of a ratio by the same non-zero number gives an equivalent ratio.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RP-04", "t": "KI", "g": 7, "fg": 6, "s": "The ratio a : b is equal to the fraction a/b, so two ratios are compared by comparing their fractions.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-RP-07", "t": "KI", "g": 7, "fg": 7, "s": "The ratios a : b and c : d are equal exactly when a × d = b × c.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-AG-51", "t": "KI", "g": 8, "fg": 8, "s": "To multiply monomials, multiply their numerical coefficients, multiply the powers of each variable by adding the exponents of that variable, and write the results together as one monomial.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-AG-52", "t": "KI", "g": 8, "fg": 8, "s": "To multiply two polynomials, multiply every term of the first by every term of the second, keeping each sign, and add the products.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-AG-53", "t": "KI", "g": 8, "fg": 8, "s": "An identity is an equation that is true for every value of the variables in it, whereas an equation that is not an identity is true only for some values.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-AG-54", "t": "KI", "g": 8, "fg": 8, "s": "For all numbers a and b, (a + b)² = a² + 2ab + b².", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-AG-55", "t": "KI", "g": 8, "fg": 8, "s": "For all numbers a and b, (a − b)² = a² − 2ab + b².", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-AG-56", "t": "KI", "g": 8, "fg": 8, "s": "For all numbers a and b, (a + b)(a − b) = a² − b².", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-AG-57", "t": "KI", "g": 8, "fg": 8, "s": "For all numbers x, a and b, (x + a)(x + b) = x² + (a + b)x + ab.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-AG-59", "t": "KI", "g": 8, "fg": 8, "s": "After k years a person's age is the present age plus k, and k years ago it was the present age minus k, so the ages of two people change by the same number of years.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-AG-60", "t": "KI", "g": 8, "fg": 8, "s": "If two quantities are in the ratio a : b, then they can be written as ax and bx for one number x.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-AG-62", "t": "KI", "g": 8, "fg": 8, "s": "Consecutive numbers follow one another with the same difference: 1 for consecutive whole numbers, 2 for consecutive even numbers or consecutive odd numbers, and k for consecutive multiples of k.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-AG-61", "t": "KI", "g": 8, "fg": 8, "s": "To solve a linear equation with fractions whose denominators are numbers, multiply every term on both sides by a common multiple of the denominators, so that the equation has no fractions.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-GE-21", "t": "KI", "g": 7, "fg": 6, "s": "A quadrilateral is a closed figure in a plane bounded by four line segments, and it has four sides, four vertices and four angles.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-GE-22", "t": "KI", "g": 7, "fg": 7, "s": "The three angles of a triangle add up to 180°.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-GE-23", "t": "KI", "g": 8, "fg": 8, "s": "The four angles of a quadrilateral add up to 360°.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-GE-24", "t": "KI", "g": 8, "fg": 8, "s": "An exterior angle of a quadrilateral at a vertex is the angle between one side at that vertex and the extension of the adjacent side, so it and the interior angle at that vertex together make a straight line.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-GE-26", "t": "KI", "g": 8, "fg": 8, "s": "A parallelogram is a quadrilateral in which both pairs of opposite sides are parallel.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-GE-27", "t": "KI", "g": 8, "fg": 8, "s": "Opposite angles of a parallelogram are equal.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-GE-28", "t": "KI", "g": 8, "fg": 8, "s": "Adjacent angles of a parallelogram add up to 180°.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-GE-29", "t": "KI", "g": 8, "fg": 8, "s": "Two line segments bisect each other when they cross at a point that is the midpoint of each.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-GE-30", "t": "KI", "g": 8, "fg": 8, "s": "The diagonals of a parallelogram bisect each other.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-GE-31", "t": "KI", "g": 8, "fg": 8, "s": "A rhombus is a parallelogram whose four sides are equal in length.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-GE-32", "t": "KI", "g": 8, "fg": 8, "s": "A rectangle is a parallelogram whose four angles are right angles.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-GE-33", "t": "KI", "g": 8, "fg": 8, "s": "A square is a rectangle whose four sides are equal in length.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-GE-34", "t": "KI", "g": 8, "fg": 8, "s": "The diagonals of a rhombus bisect each other at right angles.", "kind": "Principle", "rat": "without", "fail": false}, {"id": "KI-GE-35", "t": "KI", "g": 8, "fg": 8, "s": "The diagonals of a rectangle are equal in length.", "kind": "Principle", "rat": "without", "fail": false}, {"id": "KI-GE-36", "t": "KI", "g": 8, "fg": 8, "s": "Every rhombus, every rectangle and every square is a parallelogram, so each has every property of a parallelogram.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-GE-37", "t": "KI", "g": 8, "fg": 8, "s": "Every square is both a rectangle and a rhombus.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-GE-38", "t": "KI", "g": 8, "fg": 8, "s": "A parallelogram is a rhombus exactly when two adjacent sides are equal in length, and it is a rectangle exactly when one angle is a right angle.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-GE-39", "t": "KI", "g": 8, "fg": 8, "s": "A rectangle is a square exactly when two adjacent sides are equal in length, and a rhombus is a square exactly when one angle is a right angle.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-GE-40", "t": "KI", "g": 7, "fg": 6, "s": "A ruler or a protractor gives a measure only to the nearest division, so two equal lengths or two equal angles can measure slightly differently.", "kind": "Principle", "rat": "without", "fail": false}, {"id": "KI-GE-41", "t": "KI", "g": 7, "fg": 7, "s": "Two triangles are congruent when one fits exactly on the other, and then every pair of matching sides and every pair of matching angles are equal.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-GE-42", "t": "KI", "g": 7, "fg": 7, "s": "If two angles and the side between them in one triangle are equal to two angles and the side between them in another triangle, the two triangles are congruent.", "kind": "Principle", "rat": "without", "fail": false}, {"id": "KI-GE-43", "t": "KI", "g": 8, "fg": 8, "s": "The front view, the side view and the top view of a solid are the plane figures seen when the solid is looked at from the front, from a side and from above.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-GE-44", "t": "KI", "g": 8, "fg": 8, "s": "In the top view of a solid made of cubes, there is one square for each stack of cubes, whatever the height of the stack.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-GE-45", "t": "KI", "g": 8, "fg": 8, "s": "In the front view or a side view of a solid made of cubes, each position across the view has a column with as many squares as there are cubes in the tallest stack in line with the viewer at that position.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-GE-46", "t": "KI", "g": 8, "fg": 8, "s": "A cuboid standing on one of its faces looks like a rectangle from the front, from the side and from above, and a cube looks like a square from each of these directions.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-GE-47", "t": "KI", "g": 8, "fg": 8, "s": "A cylinder standing on its base looks like a rectangle from the front and from the side, and like a circle from above.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-GE-48", "t": "KI", "g": 8, "fg": 8, "s": "A cone standing on its base looks like a triangle from the front and from the side, and like a circle with a point at its centre for the tip from above.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-GE-49", "t": "KI", "g": 8, "fg": 8, "s": "A sphere looks like a circle from every direction.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-GE-50", "t": "KI", "g": 8, "fg": 8, "s": "In the front view and the side view of an object made of one solid standing on the top face of another, the view of the upper solid is drawn above the view of the lower solid, and in the top view the upper solid is drawn over the lower one.", "kind": "Principle", "rat": "without", "fail": false}, {"id": "KI-GE-51", "t": "KI", "g": 7, "fg": 6, "s": "A cuboid is a solid with six rectangular faces.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-GE-52", "t": "KI", "g": 7, "fg": 7, "s": "To draw an oblique sketch of a cuboid, draw its front face with its true length and height, draw an equal rectangle for the back face shifted up and to the right, and join the matching corners.", "kind": "Procedure", "rat": "without", "fail": false}, {"id": "KI-GE-53", "t": "KI", "g": 7, "fg": 7, "s": "To draw an isometric sketch of a cuboid on isometric dot paper, draw its edges along the vertical dot lines and the two sets of slanting dot lines, each edge as many dot spaces long as the number of units in its length.", "kind": "Procedure", "rat": "without", "fail": false}, {"id": "KI-GE-54", "t": "KI", "g": 8, "fg": 8, "s": "A polyhedron is a solid whose surface is made only of flat polygons.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-GE-55", "t": "KI", "g": 7, "fg": 6, "s": "A face of a polyhedron is one of the flat polygons that make up its surface.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-GE-56", "t": "KI", "g": 7, "fg": 6, "s": "An edge of a polyhedron is a line segment where two of its faces meet.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-GE-57", "t": "KI", "g": 7, "fg": 6, "s": "A vertex of a polyhedron is a point where three or more of its edges meet.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-GE-58", "t": "KI", "g": 7, "fg": 7, "s": "A prism is a polyhedron that has two identical polygons in parallel planes as its bases and rectangles as its other faces.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-GE-59", "t": "KI", "g": 7, "fg": 7, "s": "A pyramid is a polyhedron that has a polygon as its base and triangles as its other faces, all meeting at one vertex.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-GE-60", "t": "KI", "g": 7, "fg": 6, "s": "A polygon with five sides is a pentagon and a polygon with six sides is a hexagon.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-GE-61", "t": "KI", "g": 8, "fg": 8, "s": "For every polyhedron, the number of faces F, the number of vertices V and the number of edges E satisfy F + V − E = 2.", "kind": "Principle", "rat": "without", "fail": false}, {"id": "KI-GE-62", "t": "KI", "g": 7, "fg": 6, "s": "A pair of compasses set to a length r draws a circle o
