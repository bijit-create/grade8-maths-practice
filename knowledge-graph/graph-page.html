r an arc whose radius is r.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-GE-63", "t": "KI", "g": 7, "fg": 7, "s": "A point at distance r from a point P and at distance s from a point Q lies on the circle with centre P and radius r and on the circle with centre Q and radius s, so it is a point where the two circles meet.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-GE-64", "t": "KI", "g": 7, "fg": 7, "s": "To construct a triangle from its three sides, draw one side as the base, draw arcs from its two end points with radii equal to the other two sides, and join the point where the arcs meet to the two end points.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-GE-65", "t": "KI", "g": 8, "fg": 8, "s": "Four sides do not fix a quadrilateral, because the same four sides can be joined to give quadrilaterals of different shapes, so a fifth measurement such as a diagonal or an angle is needed.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-GE-66", "t": "KI", "g": 8, "fg": 8, "s": "A diagonal of a quadrilateral divides it into two triangles.", "kind": "Principle", "rat": "without", "fail": false}, {"id": "KI-GE-67", "t": "KI", "g": 7, "fg": 6, "s": "To draw an angle of a given measure at a point on a line with a protractor, place the centre of the protractor on the point and its base line along the line, mark the given measure on the scale, and draw the ray from the point through the mark.", "kind": "Procedure", "rat": "without", "fail": false}, {"id": "KI-GE-68", "t": "KI", "g": 7, "fg": 6, "s": "To construct the perpendicular bisector of a line segment, draw from each end point an arc of the same radius, longer than half the segment, so that the arcs cross on both sides of the segment, and join the two crossing points.", "kind": "Procedure", "rat": "without", "fail": false}, {"id": "KI-GE-69", "t": "KI", "g": 7, "fg": 6, "s": "To construct a perpendicular to a line at a point on it, mark two points on the line at equal distances from that point, draw from each an arc of the same larger radius so that the arcs cross, and join the crossing point to the given point.", "kind": "Procedure", "rat": "without", "fail": false}, {"id": "KI-GE-70", "t": "KI", "g": 8, "fg": 8, "s": "To construct a quadrilateral ABCD from sides AB, BC, CD and DA and diagonal AC, construct triangle ABC from AB, BC and AC, then construct triangle ACD from AC, CD and DA on the other side of AC.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-GE-71", "t": "KI", "g": 8, "fg": 8, "s": "To construct a quadrilateral ABCD from sides AB, BC and CD and diagonals AC and BD, construct triangle ABC from AB, BC and AC, then mark D as the point at distance CD from C and at distance BD from B.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-GE-72", "t": "KI", "g": 8, "fg": 8, "s": "To construct a quadrilateral ABCD from sides AB and BC and angles A, B and C, draw AB, draw angle B at B and mark C on its arm at distance BC, draw angle A at A and angle C at C, and mark D where the other arms of these two angles meet.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-GE-73", "t": "KI", "g": 8, "fg": 8, "s": "To construct a quadrilateral ABCD from sides AB, BC and CD and angles B and C, draw BC, draw angle B at B and mark A on its arm at distance AB, draw angle C at C and mark D on its arm at distance CD, then join A and D.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-GE-74", "t": "KI", "g": 8, "fg": 8, "s": "To construct a parallelogram ABCD from sides AB and AD and angle A, draw AB, draw angle A at A and mark D on its arm at distance AD, then mark C as the point at distance AD from B and at distance AB from D.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-GE-75", "t": "KI", "g": 8, "fg": 8, "s": "To construct a rhombus ABCD from diagonals AC and BD, draw AC, construct its perpendicular bisector, mark B and D on the bisector on the two sides of AC at distance half of BD from the midpoint of AC, and join A, B, C and D.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-GE-76", "t": "KI", "g": 8, "fg": 8, "s": "To construct a rectangle ABCD from sides AB and BC, draw AB, construct perpendiculars to AB at A and at B, mark D on the perpendicular at A and C on the perpendicular at B, each at distance BC from AB on the same side of AB, and join C and D; when AB equals BC the rectangle is a square.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-GE-01", "t": "KI", "g": 7, "fg": 7, "s": "A transversal is a line that crosses two or more lines at different points.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-GE-02", "t": "KI", "g": 7, "fg": 6, "s": "Parallel lines are lines in the same plane that never meet, however far they are extended.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-GE-05", "t": "KI", "g": 7, "fg": 7, "s": "Alternate interior angles are a pair of angles, one at each point where a transversal crosses two lines, that lie between the two lines and on opposite sides of the transversal.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-GE-06", "t": "KI", "g": 7, "fg": 7, "s": "Co-interior angles are a pair of angles, one at each point where a transversal crosses two lines, that lie between the two lines and on the same side of the transversal.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-GE-08", "t": "KI", "g": 7, "fg": 7, "s": "When a transversal crosses two parallel lines, each pair of alternate interior angles is equal.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-GE-09", "t": "KI", "g": 7, "fg": 7, "s": "When a transversal crosses two parallel lines, each pair of co-interior angles adds up to 180°.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-GE-11", "t": "KI", "g": 7, "fg": 7, "s": "Adjacent angles that together make a straight line add up to 180°.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-GE-13", "t": "KI", "g": 8, "fg": 8, "s": "Opposite sides of a parallelogram are equal in length.", "kind": "Principle", "rat": "without", "fail": false}, {"id": "KI-GE-20", "t": "KI", "g": 7, "fg": 6, "s": "A cube is a cuboid whose length, width and height are equal.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-ME-08", "t": "KI", "g": 7, "fg": 6, "s": "The radius of a circle is the distance from its centre to any point on the circle, and its diameter, a chord through the centre, is twice the radius.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-RP-26", "t": "KI", "g": 7, "fg": 7, "s": "When a quantity is divided in a given ratio, each share is the quantity multiplied by that share's term divided by the sum of the terms.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-02", "t": "KI", "g": 7, "fg": 6, "s": "The area of a shape is the amount of surface it covers, measured in square units, where 1 cm² is the area of a square with sides of 1 cm and 1 m² is the area of a square with sides of 1 m.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-ME-03", "t": "KI", "g": 7, "fg": 6, "s": "The area of a rectangle is its length multiplied by its width.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-04", "t": "KI", "g": 7, "fg": 7, "s": "The perpendicular height of a triangle, parallelogram or trapezium is the length of the segment that meets the base, or the line containing the base, at a right angle and reaches the opposite vertex or side.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-ME-05", "t": "KI", "g": 7, "fg": 7, "s": "The area of a parallelogram is its base multiplied by its perpendicular height.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-06", "t": "KI", "g": 7, "fg": 7, "s": "The area of a triangle is half of its base multiplied by its perpendicular height.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-07", "t": "KI", "g": 8, "fg": 8, "s": "The area of a trapezium is half the sum of its two parallel sides multiplied by the perpendicular distance between them.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-09", "t": "KI", "g": 7, "fg": 7, "s": "The circumference of every circle is π times its diameter, or 2π times its radius, where π is a fixed number approximately equal to 3.14 or 22/7.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-10", "t": "KI", "g": 7, "fg": 7, "s": "The area of a circle with radius r is π × r².", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-13", "t": "KI", "g": 7, "fg": 6, "s": "The area of a shape made of parts that do not overlap is the sum of the areas of the parts.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-18", "t": "KI", "g": 8, "fg": 8, "s": "The volume of a solid is the amount of space it occupies, measured in cubic units, where 1 cm³ is the volume of a cube with edges of 1 cm and 1 m³ is the volume of a cube with edges of 1 m.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-ME-19", "t": "KI", "g": 8, "fg": 8, "s": "The volume of a cuboid is its length multiplied by its width multiplied by its height.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-20", "t": "KI", "g": 8, "fg": 8, "s": "The surface area of a solid is the total area of all its faces.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-ME-21", "t": "KI", "g": 8, "fg": 8, "s": "A cuboid with length l, width w and height h has six rectangular faces in three pairs of equal opposite faces, so its total surface area is 2(lw + wh + lh).", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-23", "t": "KI", "g": 8, "fg": 8, "s": "A situation about filling the inside of a solid, such as filling a tank or packing a box, calls for its volume, and a situation about covering its outside, such as painting or wrapping, calls for its surface area.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-ME-24", "t": "KI", "g": 7, "fg": 6, "s": "An area or a volume is found from lengths only after all the lengths are written in the same unit.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-ME-25", "t": "KI", "g": 7, "fg": 6, "s": "To estimate the area of a shape drawn on a square grid, count each full square and each square covered by more than half as 1, count each square covered by half as one half, leave out each square covered by less than half, and add; the total is the area in square units.", "kind": "Procedure", "rat": "without", "fail": false}, {"id": "KI-ME-26", "t": "KI", "g": 8, "fg": 8, "s": "An area found by counting squares on a grid is an estimate, close to but usually not equal to the area found by a formula, because the part squares are judged by eye.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-27", "t": "KI", "g": 8, "fg": 8, "s": "The area of a quadrilateral with a diagonal of length d, and perpendiculars of lengths h1 and h2 drawn to the diagonal from the other two vertices, is 1/2 × d × (h1 + h2).", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-28", "t": "KI", "g": 8, "fg": 8, "s": "The area of a rhombus with diagonals of lengths d1 and d2 is 1/2 × d1 × d2.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-29", "t": "KI", "g": 8, "fg": 8, "s": "To find the area of a polygon, split it into triangles and trapeziums by drawing diagonals and perpendiculars, find the area of each piece, and add the areas of the pieces.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-ME-30", "t": "KI", "g": 8, "fg": 8, "s": "The lateral surface area of a cuboid, a cube or a cylinder is the area of its surface other than its top and bottom, which is the curved surface for a cylinder, and its total surface area is its lateral surface area plus the areas of its top and bottom.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-ME-31", "t": "KI", "g": 8, "fg": 8, "s": "The lateral surface area of a cuboid with length l, width w and height h is 2h(l + w), the perimeter of its base multiplied by its height.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-32", "t": "KI", "g": 7, "fg": 6, "s": "A cylinder is a solid whose two ends are equal circles in parallel planes, joined by a curved surface; its radius is the radius of an end and its height is the distance between the ends.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-ME-33", "t": "KI", "g": 8, "fg": 8, "s": "The curved surface area of a cylinder with base radius r and height h is 2πrh, because the curved surface opens out into a rectangle as long as the circumference of the base and as wide as the height.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-34", "t": "KI", "g": 8, "fg": 8, "s": "The total surface area of a cylinder with base radius r and height h is 2πrh + 2πr², which is 2πr(r + h): its curved surface area plus the areas of its two circular ends.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-35", "t": "KI", "g": 8, "fg": 8, "s": "The volume of a cylinder with base radius r and height h is πr²h, the area of its base multiplied by its height.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-ME-36", "t": "KI", "g": 7, "fg": 4, "s": "The capacity of a container is the volume of liquid it holds when full, measured in litres or millilitres.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-ME-37", "t": "KI", "g": 8, "fg": 8, "s": "One litre is 1000 cubic centimetres.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-ME-38", "t": "KI", "g": 8, "fg": 8, "s": "One cubic metre is 1 000 000 cubic centimetres.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-ME-39", "t": "KI", "g": 8, "fg": 8, "s": "One cubic metre is 1000 litres.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-ME-40", "t": "KI", "g": 7, "fg": 6, "s": "A diagonal of a polygon is a line segment that joins two vertices that are not next to each other.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-RN-67", "t": "KI", "g": 7, "fg": 3, "s": "One metre is 100 centimetres.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-RN-70", "t": "KI", "g": 7, "fg": 6, "s": "An amount in a smaller unit is written as a decimal of the larger unit by dividing it by the number of smaller units in one larger unit.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-RN-76", "t": "KI", "g": 7, "fg": 3, "s": "A situation of equal groups or scaling is represented by multiplication, and a situation of sharing or measuring is represented by division.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-RP-05", "t": "KI", "g": 7, "fg": 6, "s": "In the unitary method, the value of one unit is the value of a given number of units divided by that number, and the value of any number of units is that number times the value of one unit.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-RP-22", "t": "KI", "g": 7, "fg": 7, "s": "R percent of a quantity Q is Q multiplied by R/100.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-DA-05", "t": "KI", "g": 7, "fg": 6, "s": "On a scale along a graph axis, equal distances stand for equal differences in value.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-PR-01", "t": "KI", "g": 7, "fg": 7, "s": "The probability of an event is a number from 0 to 1, and the greater the probability, the more likely the event is to happen.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-PR-05", "t": "KI", "g": 7, "fg": 7, "s": "An experiment is an action whose result is uncertain, each possible result is an outcome, and the sample space is the set of all possible outcomes.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-PR-06", "t": "KI", "g": 7, "fg": 7, "s": "An event is a set of outcomes from the sample space, and it happens when the result of the experiment is one of those outcomes.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-PR-11", "t": "KI", "g": 7, "fg": 7, "s": "Outcomes are equally likely when each has the same chance of happening, as for a fair coin, a fair die or a counter taken at random from a bag.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-PR-12", "t": "KI", "g": 7, "fg": 7, "s": "When all the outcomes of an experiment are equally likely, the theoretical probability of an event is the number of outcomes in the event divided by the total number of outcomes.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-PR-13", "t": "KI", "g": 7, "fg": 7, "s": "The probability that an event does not happen is 1 minus the probability that it happens.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-PR-17", "t": "KI", "g": 7, "fg": 7, "s": "The experimental probability of an event is the number of trials in which the event happens divided by the total number of trials.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-PR-18", "t": "KI", "g": 7, "fg": 7, "s": "As the number of trials increases, the experimental probability of an event tends to come closer to its theoretical probability.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-DA-31", "t": "KI", "g": 7, "fg": 6, "s": "A bar graph shows each category of a data set as a bar of the same width, with equal gaps between bars, and the length of a bar on a scale stands for the frequency or amount of that category.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-DA-32", "t": "KI", "g": 7, "fg": 7, "s": "A double bar graph shows two data sets for the same categories by drawing, for each category, two bars side by side in different shades, with a key that tells which shade stands for which data set.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-DA-33", "t": "KI", "g": 7, "fg": 6, "s": "To choose a scale for the axis of a bar graph, divide the length of the axis into equal divisions that each stand for a convenient number of units, such as 1, 2, 5, 10 or 100, so that the greatest value fits on the axis.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-DA-34", "t": "KI", "g": 8, "fg": 8, "s": "A pie chart is a circle divided into sectors by radii, in which the whole circle stands for the total of the data and each sector shows the share of one category, with a central angle proportional to that share.", "kind": "Concept", "rat": "with", "fail": false}, {"id": "KI-DA-35", "t": "KI", "g": 8, "fg": 8, "s": "To find the central angle of a sector of a pie chart, write the value of its category as a fraction of the total of the data, or its percentage as a fraction of 100, and multiply that fraction by 360°.", "kind": "Procedure", "rat": "with", "fail": false}, {"id": "KI-DA-36", "t": "KI", "g": 7, "fg": 6, "s": "A full turn about a point, such as the centre of a circle, is 360°, so the angles between radii that together fill a circle add up to 360°.", "kind": "Fact or term", "rat": "without", "fail": false}, {"id": "KI-DA-38", "t": "KI", "g": 8, "fg": 8, "s": "To draw a pie chart, draw a circle and one radius, then draw each sector's central angle in turn from the radius that ends the sector before it, so that the sectors fill the circle without overlapping.", "kind": "Procedure", "rat": "without", "fail": false}, {"id": "KI-DA-39", "t": "KI", "g": 8, "fg": 8, "s": "A sector of a pie chart with a central angle of x degrees shows x/360 of the total of the data, which is x/360 × 100 percent of it.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-DA-40", "t": "KI", "g": 7, "fg": 6, "s": "To read the value of a bar, follow from the top of the bar across to the scale and read the value there; when the top lies between two marked divisions, use the equal parts between them to find the value.", "kind": "Procedure", "rat": "without", "fail": false}, {"id": "KI-PR-19", "t": "KI", "g": 8, "fg": 8, "s": "A trial is one performance of an experiment, such as one toss of a coin or one throw of a die, and an event happens in a trial when the result is one of the outcomes of the event.", "kind": "Concept", "rat": "without", "fail": false}, {"id": "KI-PR-20", "t": "KI", "g": 8, "fg": 8, "s": "When an experiment is repeated in the same way, the experimental probability of an event from earlier trials is an estimate of the probability that the event happens in a further trial, and the estimate is better the more earlier trials there are.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-PR-21", "t": "KI", "g": 8, "fg": 8, "s": "In n trials of an experiment, an event with probability p is expected to happen about n × p times.", "kind": "Principle", "rat": "with", "fail": false}, {"id": "KI-PR-22", "t": "KI", "g": 8, "fg": 8, "s": "In repeated trials of an experiment with equally likely outcomes, the number of times an event happens is usually close to, but seldom exactly equal to, the number of trials times the theoretical probability of the event.", "kind": "Principle", "rat": "with", "fail": false}], "edges": [{"a": "SK-RN-38", "b": "LO-M801", "ty": "belongs to"}, {"a": "SK-RN-39", "b": "LO-M801", "ty": "belongs to"}, {"a": "SK-RN-40", "b": "LO-M801", "ty": "belongs to"}, {"a": "SK-RN-41", "b": "LO-M802", "ty": "belongs to"}, {"a": "SK-RN-42", "b": "LO-M802", "ty": "belongs to"}, {"a": "SK-RP-14", "b": "LO-M809", "ty": "belongs to"}, {"a": "SK-RP-15", "b": "LO-M809", "ty": "belongs to"}, {"a": "SK-RP-16", "b": "LO-M809", "ty": "belongs to"}, {"a": "SK-RP-17", "b": "LO-M809", "ty": "belongs to"}, {"a": "SK-RP-18", "b": "LO-M809", "ty": "belongs to"}, {"a": "SK-RP-19", "b": "L , "b": "SK-PR-10", "ty": "is part of", "r": "always"}, {"a": "SK-NN-01", "b": "SK-NN-13", "ty": "extends", "r": "From squares of integers up to 15 to squares of two-digit and three-digit whole numbers."}, {"a": "SK-NN-03", "b": "SK-NN-14", "ty": "extends", "r": "From sorting whole numbers up to 1000 by recall of squares to deciding about numbers up to 9999 from the prime factorisation."}, {"a": "SK-NN-03", "b": "SK-NN-15", "ty": "extends", "r": "From sorting whole numbers up to 1000 by recall of cubes to deciding about numbers up to 999 999 from the prime factorisation."}, {"a": "SK-NN-04", "b": "SK-NN-18", "ty": "extends", "r": "From square roots of square numbers up to 225 to square roots of perfect squares up to 9999 by prime factorisation."}, {"a": "SK-NN-05", "b": "SK-NN-23", "ty": "extends", "r": "From cube roots of cube numbers up to 1000 to cube roots of perfect cubes up to 999 999 by prime factorisation."}, {"a": "SK-NN-20", "b": "SK-NN-21", "ty": "extends", "r": "From the division method on whole numbers to the division method on decimals, which adds pairing on both sides of the decimal point."}, {"a": "SK-NN-20", "b": "SK-NN-22", "ty": "extends", "r": "From perfect squares to whole numbers that are not perfect squares, which adds bringing down pairs of zeros and rounding."}, {"a": "SK-NN-25", "b": "SK-NN-26", "ty": "extends", "r": "From powers of one base to powers of different bases with the same exponent."}, {"a": "SK-NN-06", "b": "SK-NN-07", "ty": "contrasts with", "r": "The units digit decides divisibility by 2 and 5, but the last two digits decide divisibility by 4; they are set side by side so the learner sees which multiple of 10 or 100 drops out."}, {"a": "SK-NN-08", "b": "SK-NN-09", "ty": "contrasts with", "r": "The sum of the digits decides divisibility by 9, but the alternating sum decides divisibility by 11; 29 has digit sum 11 and is not divisible by 11."}, {"a": "SK-NN-14", "b": "SK-NN-15", "ty": "contrasts with", "r": "1728 = 2⁶ × 3³ is a perfect cube but not a perfect square; they are set side by side so the learner groups primes in the right size of group."}, {"a": "SK-NN-16", "b": "SK-NN-17", "ty": "contrasts with", "r": "252 needs the multiplier 7 for a perfect square and 392 needs the multiplier 7 for a perfect cube by different groupings; they are set side by side so pairs and triples are not mixed."}, {"a": "SK-NN-18", "b": "SK-NN-23", "ty": "contrasts with", "r": "√324 = 18 takes one prime from each pair and ∛1728 = 12 takes one prime from each triple; they are set side by side so the group size follows the root asked."}, {"a": "SK-NN-25", "b": "SK-NN-27", "ty": "contrasts with", "r": "The product law adds exponents of powers of one base, but 2^(−1) + 3^(−1) is a sum of two numbers and is not 5^(−1); they are set side by side so the laws are used only for products and quotients."}, {"a": "SK-NN-29", "b": "SK-NN-30", "ty": "is format of", "r": "Writing 5.64 × 10^(−7) and 0.000000564 expresses the same number in standard form and in usual form."}, {"a": "SK-NN-19", "b": "SK-NN-18", "ty": "revisits", "r": "The square root of a perfect square is found again by a second method, repeated subtraction, without widening the range."}, {"a": "SK-NN-20", "b": "SK-NN-18", "ty": "revisits", "r": "The square root of a perfect square is found again by a third method, the division method, over the same range of perfect squares."}, {"a": "SK-NN-01", "b": "SK-NN-02", "ty": "contrasts with", "r": "4² = 16 and 4³ = 64 differ only in the index; they are set side by side so the learner reads the index as a count of factors, not as a multiplier."}, {"a": "SK-NN-04", "b": "SK-NN-05", "ty": "contrasts with", "r": "√64 = 8 and ∛64 = 4 start from the same number; they are set side by side so the learner reads which root is asked."}, {"a": "SK-AG-25", "b": "SK-AG-26", "ty": "extends", "r": "From puzzles about numbers to puzzles about the digits of a number, which need place value."}, {"a": "SK-AG-25", "b": "SK-AG-27", "ty": "extends", "r": "From equations with the variable on one side to equations with the variable on both sides."}, {"a": "SK-AG-27", "b": "SK-AG-28", "ty": "extends", "r": "From equations with whole-number coefficients to equations with fractions or the variable in a denominator."}, {"a": "SK-AG-30", "b": "SK-AG-31", "ty": "extends", "r": "From integer coefficients to fractions with whole-number denominators, cleared by a common multiple."}, {"a": "SK-AG-30", "b": "SK-AG-32", "ty": "extends", "r": "From the variable in the numerator only to the variable in the numerator and denominator of a fraction."}, {"a": "SK-AG-33", "b": "SK-AG-34", "ty": "extends", "r": "From the product of two monomials to the product of a monomial and every term of a polynomial."}, {"a": "SK-AG-34", "b": "SK-AG-35", "ty": "extends", "r": "From one multiplying term to a binomial, whose every term multiplies every term of the second binomial."}, {"a": "SK-AG-35", "b": "SK-AG-36", "ty": "extends", "r": "From a binomial second factor to a trinomial second factor, which gives six products instead of four."}, {"a": "SK-AG-39", "b": "SK-AG-40", "ty": "extends", "r": "From two numbers equally far from the base on opposite sides to two numbers at any small distances from the base."}, {"a": "SK-AG-38", "b": "SK-AG-39", "ty": "contrasts with", "r": "Squaring a number near a hundred keeps the middle term 2ab, while the product of numbers on either side of it has none, and learners give 98 × 102 as 100² + 2²."}, {"a": "SK-AG-39", "b": "SK-AG-41", "ty": "is format of", "r": "Both use a² − b² = (a + b)(a − b); one reads it from a product of numbers to a difference of squares and the other from a difference of squares to a product."}, {"a": "KI-AG-54", "b": "KI-AG-55", "ty": "contrasts with", "r": "The two squares differ in the sign of the middle term, +2ab for a sum and −2ab for a difference."}, {"a": "KI-AG-54", "b": "KI-AG-56", "ty": "contrasts with", "r": "Squaring a sum has the middle term 2ab, while a   {k:"revisits", lab:"revisits", dash:"8 3", w:1.4, col:"--ki"},
  {k:"contrasts with", lab:"contrasts with", dash:"2 2", w:1.8, col:"--warn"},
  {k:"precedes in sequence", lab:"precedes in sequence (route)", dash:null, w:2.6, col:"--hl"},
  {k:"belongs to", lab:"outcome field", dash:null, w:.8, col:"--line"},
];
const ETYPES=[{k:"wrong answer on", lab:"wrong answer on", dash:null, w:1.4, col:"--warn"},{k:"points to", lab:"cause points to", dash:"3 3", w:1.2, col:"--warn"}];
ETYPES.forEach(t=>TYPES.push(t));
const TY = Object.fromEntries(TYPES.map(t=>[t.k,t]));
let layerOn=false;
const on = Object.fromEntries(TYPES.map(t=>[t.k, t.k!=="helpful"]));
(DATA.errors||[]).forEach(e=>{ DATA.nodes.push({id:e.id,t:"EP",g:null,s:e.wrong,err:e}); DATA.edges.push({a:e.id,b:e.skill,ty:"wrong answer on"});
  e.causes.forEach(c=>{ if(c.to && DATA.nodes.some(n=>n.id===c.to) && !DATA.edges.some(x=>x.a===e.id&&x.b===c.to)) DATA.edges.push({a:e.id,b:c.to,ty:"points to"}); }); });
const byId = Object.fromEntries(DATA.nodes.map(n=>[n.id,n]));
const nodes = DATA.nodes.map(n=>({...n}));
const links = DATA.edges.map(e=>({...e, source:e.a, target:e.b}));
const NCOL = {LO:"--lo", SK:"--sk", KI:"--ki", EP:"--warn"};
const BAND = {LO:0, SK:1, KI:2, EP:1};

const svg = d3.select("#g");
const root = svg.append("g");
const gEdges = root.append("g"), gNodes = root.append("g"), gLabels = root.append("g"), gHeads = root.insert("g",":first-child");
let W=900,H=700;
const GR=DATA.grades, G0=GR[0]-1, COLS=[G0,...GR];
nodes.forEach(n=>{ if(n.t==="EP"){ const sk=nodes.find(x=>x.id===n.err.skill); n.g=sk?sk.g:GR[0]; } });
function cols(){ const o={}; COLS.forEach((g,i)=>o[g]=W*(0.08+0.82*i/(COLS.length-1))); return o; }
const gcol=g=>Math.max(G0,Math.min(GR[GR.length-1],g));
function bands(){ return [H*0.14, H*0.44, H*0.8]; }

// arrowheads per type
const defs = svg.append("defs");
TYPES.forEach((t,i)=>{
  defs.append("marker").attr("id","m"+i).attr("viewBox","0 -4 8 8").attr("refX",13).attr("refY",0)
    .attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto")
    .append("path").attr("d","M0,-4L8,0L0,4").attr("class","mk").attr("data-c",t.col);
});

const edgeSel = gEdges.selectAll("line").data(links).join("line")
  .attr("stroke-width",d=>TY[d.ty].w).attr("stroke-dasharray",d=>d.ty==="is part of"&&d.r==="sometimes"?"6 3":TY[d.ty].dash)
  .attr("marker-end",d=>d.ty==="belongs to"||d.ty==="contrasts with"||d.ty==="is format of"?null:`url(#m${TYPES.findIndex(t=>t.k===d.ty)})`);
const r = d=> d.t==="LO"?9:d.t==="SK"?6:d.t==="EP"?4.5:5;
const nodeSel = gNodes.selectAll("g").data(nodes).join("g").attr("tabindex",0).attr("role","button")
  .attr("aria-label",d=>d.id).style("cursor","pointer")
  .on("click",(e,d)=>select(d.id)).on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(d.id)}});
nodeSel.filter(d=>d.t!=="EP").append("circle").attr("r",r).attr("stroke-width",1.5);
nodeSel.filter(d=>d.t==="EP").append("rect").attr("x",-5).attr("y",-5).attr("width",10).attr("height",10).attr("transform","rotate(45)").attr("stroke-width",1.5);
nodeSel.filter(d=>d.t==="KI"&&d.fail).append("circle").attr("r",9).attr("fill","none").attr("stroke-dasharray","2 2").attr("class","failring");
const labelSel = gLabels.selectAll("text").data(nodes).join("text").attr("class","nlabel")
  .text(d=>d.id==="NONE"?"no outcome":d.t==="EP"?"✗":d.id.replace("LO-","").replace(/^(SK|KI)-/,"")).attr("dy",-10).attr("text-anchor","middle");

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d=>d.id).strength(0.02))
  .force("x", d3.forceX(d=>cols()[gcol(d.g)]).strength(0.35))
  .force("y", d3.forceY(d=>bands()[BAND[d.t]]+(d.t==="EP"?H*0.13:0)).strength(d=>d.t==="EP"?0.3:0.5))
  .force("collide", d3.forceCollide(d=>r(d)+9))
  .force("charge", d3.forceManyBody().strength(-25))
  .on("tick", draw);

function draw(){
  edgeSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
  labelSel.attr("x",d=>d.x).attr("y",d=>d.y);
}
function heads(){
  gHeads.selectAll("*").remove();
  const c=cols(), b=bands();
  COLS.map((g,i)=>[g,i===0?`Before Grade ${GR[0]}`:`Grade ${g}`]).forEach(([g,t])=>gHeads.append("text").attr("class","colhead").attr("x",c[g]).attr("y",16).attr("text-anchor","middle").text(t));
  [["Learning outcomes",0],["Skills",1],["Knowledge items",2]].forEach(([t,i])=>gHeads.append("text").attr("class","bandhead").attr("x",8).attr("y",b[i]-H*0.07).text(t));
}
function resize(){
  const box=svg.node().getBoundingClientRect(); W=Math.max(700,box.width); H=Math.max(560,box.height);
  heads(); sim.force("x").x(d=>cols()[gcol(d.g)]); sim.force("y").y(d=>bands()[BAND[d.t]]+(d.t==="EP"?H*0.13:0)); sim.alpha(.6).restart();
}
const zoom=d3.zoom().scaleExtent([.4,4]).on("zoom",e=>root.attr("transform",e.transform));
svg.call(zoom);

let selected=null, query="";
function colorize(){
  nodeSel.select("circle").attr("fill",d=>css(NCOL[d.t])).attr("stroke",css("--paper"));
  nodeSel.select("rect").attr("fill",css("--paper")).attr("stroke",css("--warn"));
  nodeSel.select(".failring").attr("stroke",css("--warn"));
  edgeSel.attr("stroke",d=>css(TY[d.ty].col));
  defs.selectAll(".mk").attr("fill",function(){return css(this.dataset.c)});
}
const isErrEdge=l=>l.ty==="wrong answer on"||l.ty==="points to";
function neighbours(id){
  const s=new Set([id]);
  links.forEach(l=>{ if(!on[l.ty])return; if(isErrEdge(l)&&!layerOn)return; if(l.source.id===id)s.add(l.target.id); if(l.target.id===id)s.add(l.source.id); });
  return s;
}
function refresh(){
  const nb = selected?neighbours(selected):null;
  const q=query.toLowerCase();
  const match = n=> !q || n.id.toLowerCase().includes(q) || (n.s||"").toLowerCase().includes(q) || (n.lab||"").toLowerCase().includes(q);
  edgeSel.attr("display",d=>(on[d.ty]&&(layerOn||!isErrEdge(d)))?null:"none")
    .attr("opacity",d=> !selected?.55 : (d.source.id===selected||d.target.id===selected)?1:.06);
  nodeSel.attr("display",d=>d.t==="EP"&&!layerOn?"none":null).attr("opacity",d=> (nb?nb.has(d.id):match(d))?1:.15);
  labelSel.attr("display",d=>d.t==="EP"&&!layerOn?"none":null).attr("opacity",d=> (nb?nb.has(d.id):(q?match(d):d.t!=="KI"&&d.t!=="EP"))?1:0);
}
function linkList(id){
  const out=[],inc=[];
  links.forEach(l=>{ if(l.source.id===id)out.push([l.ty,l.target.id,l.basis||l.r]); else if(l.target.id===id)inc.push([l.ty,l.source.id,l.basis||l.r]); });
  const KINDN={LO:"Outcome",SK:"Skill",KI:"Knowledge item"};
  const li=([ty,o,why],dir)=>{const n=byId[o]; const txt=n.s; return `<li><span class="ty">${dir} ${TY[ty].lab}${why?` · ${why}`:""}</span><button data-id="${o}"><span class="id">${KINDN[n.t]}${o==="NONE"?"":" "+o}</span> ${txt}</button></li>`};
  return {out:out.map(x=>li(x,"→")).join(""), inc:inc.map(x=>li(x,"←")).join("")};
}
function select(id){
  selected=id; const n=byId[id]; const L=linkList(id);
  if(n.t==="EP"){ renderError(n.err); refresh(); return; }
  const typeName={LO:"Learning outcome",SK:"Skill",KI:"Knowledge item"}[n.t];
  let chips=[];
  if(n.t==="LO"){ chips.push(n.code&&n.code!=="none"?`NCERT ${n.code}`:"No NCERT code", `Grade ${n.g}`); (n.cg||[]).forEach(c=>chips.push(c)); (n.nas||[]).forEach(c=>chips.push(`NAS ${c}`)); }
  if(n.t==="SK"){ chips.push(`Grade ${n.g}`, "Authored by ConveGenius"); }
  if(n.t==="KI"){ chips.push(n.kind, n.kind==="Procedure"||n.kind==="Principle"?"required before attainment":"required before teaching", `${n.rat} rationale`, n.fg<6?`first met before Grade 6`:`first met Grade ${n.fg}`); }
  let extra="";
  if(n.t==="SK"){ chips.push(n.role);
    extra+=`<table class="ftab"><tr><th>Action</th><td>${n.action}</td></tr><tr><th>Content</th><td>${n.content}</td></tr><tr><th>Conditions</th><td>${n.cond}</td></tr><tr><th>Example task</th><td>${n.ex}</td></tr><tr><th>Separation</th><td>vs ${n.sep}: ${n.sepl}</td></tr><tr><th>Stopping rule</th><td>${n.stop}</td></tr><tr><th>Review</th><td>pending</td></tr></table>`;
  }
  if(n.fail) extra+=`<p class="note"><span class="chip bad">Sentence test fails</span> A set of facts, not one statement.</p>`;
  if(n.t==="SK"&&layerOn){ const errs=(DATA.errors||[]).filter(e=>e.skill===id);
    extra+=`<h2>Known wrong answers</h2>`+(errs.length?`<ul class="links">${errs.map(e=>`<li><span class="ty">${e.status} · ${e.origin}</span><button data-id="${e.id}"><span class="id">${e.id}</span> ${e.wrong}</button></li>`).join("")}</ul>`:`<p class="note">None recorded.</p>`); }
  document.getElementById("panel").innerHTML=`
    <button class="tg" id="back">← Overview</button>
    <p class="eyebrow" style="margin-top:12px">${typeName} · <span>${id==="NONE"?"gap":id}</span></p>
    <p class="stmt">${n.s}</p>
    <div class="chips">${chips.map(c=>`<span class="chip">${c}</span>`).join("")}</div>${extra}
    ${L.out?`<h2>This ${typeName.toLowerCase()} links to</h2><ul class="links">${L.out}</ul>`:""}
    ${L.inc?`<h2>Linked from</h2><ul class="links">${L.inc}</ul>`:""}`;
  document.getElementById("back").onclick=()=>{selected=null;overview();refresh()};
  document.querySelectorAll("#panel .links button").forEach(b=>b.onclick=()=>select(b.dataset.id));
  refresh();
}
function renderError(e){
  const sk=byId[e.skill]; const KINDN={LO:"Outcome",SK:"Skill",KI:"Knowledge item"};
  const tgt=c=>c.to&&byId[c.to]?`<button data-id="${c.to}"><span class="id">${KINDN[byId[c.to].t]} ${c.to}</span></button>`:(c.to||"—");
  const authored=["authored","research","learner data"].includes(e.origin);
  document.getElementById("panel").innerHTML=`
    <button class="tg" id="back">← Overview</button>
    <p class="eyebrow" style="margin-top:12px">Error pattern · ${e.id} · ${authored?"authored":"seeded, not yet authored"}</p>
    <div class="flow">
      <span class="k">Skill</span><span><button data-id="${e.skill}" style="all:unset;cursor:pointer;color:var(--sk)">${e.skill}</button> ${sk?sk.s:""}</span>
      <span class="k">Task type</span><span>${e.ttype}, ${e.rep}</span>
      <span class="k">Task</span><span class="mono">${e.task}</span>
      <span class="k">Wrong answer</span><span><b>${e.wrong}</b></span>
      ${e.op?`<span class="k">Operation</span><span>${e.op}</span>`:""}
      ${e.ver?`<span class="k">Verified</span><span>${e.ver}</span>`:""}
      <span class="k">Status</span><span class="stat-exp"><b>${e.status}</b>; observed in learner data ${e.n} times</span>
      <span class="k">Source</span><span>${e.origin}; ${e.source}</span>
    </div>
    <h2>Causes supported by the response</h2>
    <table class="ctab"><tr><th>Cause</th><th>Points to</th><th>Evidence</th></tr>
    ${e.causes.map(c=>`<tr><td>${c.type}</td><td>${tgt(c)}</td><td>${c.ev}</td></tr>`).join("")}</table>
    ${e.ruled.length?`<h2>Ruled out</h2><table class="ctab"><tr><th>Cause</th><th>Reason</th></tr>${e.ruled.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join("")}</table>`:""}
    ${e.probes.length?`<h2>Probes</h2>`+e.probes.map(p=>`<p class="eyebrow">${p.id} · runs on ${p.runs_on||"—"}</p><div class="flow"><span class="k">Claim</span><span>${p.claim}</span><span class="k">Evidence</span><span>${p.evidence}</span><span class="k">Task</span><span>${p.task}</span></div>
      <table class="ctab"><tr><th>Cause</th><th>Predicted response</th></tr>${Object.entries(p.predictions||{}).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</table>`).join(""):`<p class="note">No probes written yet.</p>`}
    ${e.unsep.length?`<h2>Not separated by any probe</h2><ul class="links">${e.unsep.map(([a,b])=>`<li><span>${a} / ${b}</span></li>`).join("")}</ul>`:""}`;
  document.getElementById("back").onclick=()=>{selected=null;overview();refresh()};
  document.querySelectorAll("#panel button[data-id]").forEach(b=>b.onclick=()=>select(b.dataset.id));
  selected=e.id;
}
function overview(){
  const c=t=>DATA.nodes.filter(n=>n.t===t&&n.id!=="NONE").length;
  const req=DATA.edges.filter(e=>e.ty.startsWith("required"));
  document.getElementById("panel").innerHTML=`
    <p class="eyebrow">${DATA.title}</p>
    <h2>How to read it</h2>
    <p class="note">Columns are grades: knowledge items first expected before Grade 8 sit on the left, everything of Grade 8 on the right. Bands are the three curriculum objects. Click any point to see its statement and every typed link. Toggle link types on the graph.</p>
    <div class="stat"><div><b>${c("LO")}</b><span>outcomes</span></div><div><b>${c("SK")}</b><span>skills</span></div><div><b>${c("KI")}</b><span>knowledge items</span></div></div>
    <div class="key">
      <span class="dot" style="background:var(--lo)"></span><span>Learning outcome (NCERT 2017)</span>
      <span class="dot" style="background:var(--sk)"></span><span>Skill</span>
      <span class="dot" style="background:var(--ki)"></span><span>Knowledge item</span>
      <span class="dot" style="border:1.5px solid var(--warn)"></span><span>Knowledge item that fails a test</span>
    </div>
    ${layerOn?`<h2>Error layer (on)</h2><p class="note">Red diamonds are known wrong answers, one per skill so far. ${(DATA.errors||[]).length} patterns: ${(DATA.errors||[]).filter(e=>e.origin==="separation test").length} taken from the separation tests already in the skill records, ${(DATA.errors||[]).filter(e=>e.origin==="authored").length} authored under the error-layer procedure (SK-RN-16, 28, 31), 0 from research, 0 observed in learner data. Seeded causes are read off the graph's links with no probes; authored patterns carry evidence, ruled-out causes and probes with predictions.</p>`:""}
    <h2>Route</h2>
    <p class="note">One route, in NCERT Class 8 textbook chapter order, joins the outcome-task skills (toggle it on the graph); it states teaching order only. Blue solid lines are steps carried out in every task of the target skill; blue dashed lines, in some tasks.</p>`;
}
// toggles
const tgBox=document.getElementById("toggles");
TYPES.forEach(t=>{
  const b=document.createElement("button"); b.className="tg"; b.setAttribute("aria-pressed",on[t.k]);
  b.innerHTML=`<span class="sw" style="border-top:${t.w+0.5}px ${t.dash?"dashed":"solid"} var(${t.col})"></span>${t.lab}`;
  b.onclick=()=>{on[t.k]=!on[t.k]; b.setAttribute("aria-pressed",on[t.k]); refresh();};
  tgBox.appendChild(b);
});
const lb=document.createElement("button"); lb.className="tg layer"; lb.id="layerBtn"; lb.setAttribute("aria-pressed","false"); lb.textContent="Error layer: off";
lb.onclick=()=>{ layerOn=!layerOn; lb.setAttribute("aria-pressed",layerOn); lb.textContent="Error layer: "+(layerOn?"on":"off"); if(selected&&byId[selected]&&byId[selected].t==="EP"&&!layerOn){selected=null;overview();} else if(selected){select(selected);} else overview(); refresh(); };
if((DATA.errors||[]).length) tgBox.prepend(lb);
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim(); if(query)selected=null; refresh();});
new ResizeObserver(resize).observe(svg.node());
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",colorize);
new MutationObserver(colorize).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
colorize(); overview(); resize(); refresh();
for(let i=0;i<200;i++) sim.tick(); draw();
</script>
