<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: graph-paper canvas with grade columns and three object bands; detail panel to the right, below on phones */
:root{
  --paper:#F2F5F8; --grid:#DCE4EC; --ink:#1B2631; --muted:#5A6A7A; --panel:#FFFFFF; --line:#C9D3DD;
  --lo:#C25E1A; --sk:#2D5FB5; --ki:#2A8452; --warn:#B3261E; --edge:#7A8896; --hl:#E0A100;
  --f-display:"Newsreader",Georgia,serif; --f-body:"Atkinson Hyperlegible",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111821; --grid:#1D2733; --ink:#E2E8EE; --muted:#93A3B3; --panel:#17202B; --line:#2C3A48;
  --lo:#F08A44; --sk:#6E9CF0; --ki:#5BC28A; --warn:#F2756B; --edge:#7D8C9B; --hl:#F5C542; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111821; --grid:#1D2733; --ink:#E2E8EE; --muted:#93A3B3; --panel:#17202B; --line:#2C3A48;
  --lo:#F08A44; --sk:#6E9CF0; --ki:#5BC28A; --warn:#F2756B; --edge:#7D8C9B; --hl:#F5C542; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);height:100%;padding-inline:16px;gap:0 16px;box-sizing:border-box}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 20px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
h1{font-family:var(--f-display);font-weight:600;font-size:1.6rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem}
.stage{display:flex;flex-direction:column;min-width:0;min-height:420px;border-right:1px solid var(--line)}
svg{display:block;width:100%;flex:1;min-height:0;cursor:grab;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.controls input[type=search]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:220px;max-width:100%}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{font:600 .75rem var(--f-body);letter-spacing:.02em;padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tg[aria-pressed=false]{opacity:.45}
.tg.layer{border-color:var(--warn);color:var(--warn);font-weight:700}
.tg.layer[aria-pressed=true]{background:var(--warn);color:var(--paper)}
.flow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:.88rem;margin:.4rem 0 .8rem}
.flow .k{font:600 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.ctab{width:100%;border-collapse:collapse;font-size:.84rem;margin:0 0 .8rem}.ctab th{text-align:left;font:600 .66rem var(--f-mono);color:var(--muted);padding:4px 6px 4px 0;letter-spacing:.05em;text-transform:uppercase}.ctab td{padding:5px 6px 5px 0;border-top:1px solid var(--line);vertical-align:top}
.ctab button{all:unset;cursor:pointer;color:var(--sk);border-bottom:1px dotted var(--line)}
.stat-exp{color:var(--warn)}
.tg:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.sw{width:18px;height:0;border-top:2px solid var(--edge)}
aside{overflow:auto;padding-block:14px 24px;min-width:0}
aside h2{font-family:var(--f-display);font-weight:600;font-size:1.2rem;margin:.2rem 0 .4rem}
.eyebrow{font:600 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stmt{font-size:1rem;margin:.3rem 0 .8rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.8rem}
.chip{font:600 .72rem var(--f-body);padding:3px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.chip.bad{color:var(--warn);border-color:var(--warn)}
.chip.good{color:var(--ki);border-color:var(--ki)}
.links{list-style:none;padding:0;margin:0 0 1rem;display:flex;flex-direction:column;gap:6px}
.links li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;font-size:.88rem}
.links .ty{font:600 .7rem var(--f-mono);color:var(--muted);grid-column:1/-1}
.links button{all:unset;cursor:pointer;color:var(--ink);grid-column:1/-1;border-bottom:1px dotted var(--line)}
.links button:hover{color:var(--sk)}
.ftab{width:100%;border-collapse:collapse;font-size:.85rem;margin:0 0 1rem}.ftab th{text-align:left;vertical-align:top;color:var(--muted);font:600 .7rem var(--f-mono);padding:5px 8px 5px 0;white-space:nowrap}.ftab td{padding:5px 0;border-bottom:1px solid var(--line)}
.id{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.key{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:.85rem;margin:.6rem 0 1rem}
.dot{width:12px;height:12px;border-radius:50%}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:.6rem 0 1rem}
.stat div{border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--panel)}
.stat b{display:block;font:600 1.3rem var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
p.note{font-size:.88rem;color:var(--muted);margin:.4rem 0}
.colhead{font:600 11px var(--f-mono);letter-spacing:.08em;fill:var(--muted);text-transform:uppercase}
.bandhead{font:600 11px var(--f-mono);letter-spacing:.08em;fill:var(--muted);text-transform:uppercase}
.nlabel{font:600 9px var(--f-mono);fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:3px}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 62vh auto;height:auto}
  .stage{border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DATA = {"nodes": [{"id": "LO-M801", "t": "LO", "g": 8, "s": "Generalises properties of addition, subtraction, multiplication and division of rational numbers through patterns", "code": "M801", "cg": ["CG-1"], "nas": []}, {"id": "LO-M802", "t": "LO", "g": 8, "s": "Finds out as many rational numbers as possible between two given rational numbers.", "code": "M802", "cg": ["CG-1"], "nas": ["M802"]}, {"id": "LO-M803", "t": "LO", "g": 8, "s": "Proves divisibility rules of 2, 3,4, 5, 6, 9 and 11", "code": "M803", "cg": ["CG-1"], "nas": ["M803"]}, {"id": "LO-M804", "t": "LO", "g": 8, "s": "Finds squares, cubes and square roots and cube roots of numbers using different methods.", "code": "M804", "cg": ["CG-1"], "nas": ["M804"]}, {"id": "LO-M805", "t": "LO", "g": 8, "s": "Solves problems with integral exponents", "code": "M805", "cg": ["CG-1"], "nas": ["M706"]}, {"id": "LO-M806", "t": "LO", "g": 8, "s": "Solves puzzles and daily life problems using variables.", "code": "M806", "cg": ["CG-7"], "nas": []}, {"id": "LO-M807", "t": "LO", "g": 8, "s": "Multiplies algebraic expressions. E.g. Expands (2x-5) (3x+7).", "code": "M807", "cg": ["CG-2"], "nas": []}, {"id": "LO-M808", "t": "LO", "g": 8, "s": "Uses various algebraic identities in solving problems of daily life", "code": "M808", "cg": ["CG-2"], "nas": ["M808"]}, {"id": "LO-M809", "t": "LO", "g": 8, "s": "Applies the concept of percent in profit and loss situation in finding discount, vat and compound interest. E.g., calculates discount per cent when marked price and actual discount are given or finds profit per cent when cost price and profit in a transaction are given.", "code": "M809", "cg": ["CG-1"], "nas": []}, {"id": "LO-M810", "t": "LO", "g": 8, "s": "Solves problems based on direct and inverse proportions", "code": "M810", "cg": ["CG-1"], "nas": []}, {"id": "LO-M811", "t": "LO", "g": 8, "s": "Solves problems related to angles of a quadrilateral using angle sum property", "code": "M811", "cg": ["CG-3"], "nas": []}, {"id": "LO-M812", "t": "LO", "g": 8, "s": "Verifies properties of parallelograms and establishes the relationship between them through reasoning.", "code": "M812", "cg": ["CG-3"], "nas": ["M812"]}, {"id": "LO-M813", "t": "LO", "g": 8, "s": "Represents 3D shapes on a plane surface such as sheet of paper, black board etc.", "code": "M813", "cg": ["CG-3"], "nas": []}, {"id": "LO-M814", "t": "LO", "g": 8, "s": "Verifies Euler’s relation through pattern", "code": "M814", "cg": ["CG-6"], "nas": []}, {"id": "LO-M815", "t": "LO", "g": 8, "s": "Constructs different quadrilaterals using compasses and straight edge.", "code": "M815", "cg": ["CG-3"], "nas": []}, {"id": "LO-M816", "t": "LO", "g": 8, "s": "Estimates the area of shapes like trapezium and other polygons by using square grid / graph sheet and verifies using formulas.", "code": "M816", "cg": ["CG-4"], "nas": ["M717"]}, {"id": "LO-M817", "t": "LO", "g": 8, "s": "Finds the area of a polygon.", "code": "M817", "cg": ["CG-4"], "nas": []}, {"id": "LO-M818", "t": "LO", "g": 8, "s": "Finds surface area and volume of cuboidal and cylindrical object.", "code": "M818", "cg": ["#VALUE!"], "nas": ["M818"]}, {"id": "LO-M819", "t": "LO", "g": 8, "s": "Draws and interprets bar charts and pie charts", "code": "M819", "cg": ["CG-5"], "nas": ["M819"]}, {"id": "LO-M820", "t": "LO", "g": 8, "s": "Makes hypotheses on chances of future events on the basis of its earlier occurrences or available data like, after repeated throws of dice and coins", "code": "M820", "cg": ["CG-8"], "nas": []}, {"id": "SK-RN-38", "t": "SK", "g": 8, "s": "States in words or with letters the general property shown by a set of worked examples with rational numbers.", "action": "states", "content": "a general property from examples", "cond": "three to five worked examples given; properties: closure, commutativity, associativity, identity, inverse, distributivity", "ex": "(-2/3) + 1/5 = 1/5 + (-2/3); 3/4 + (-1/2) = (-1/2) + 3/4; ... What is true in general?", "sep": "SK-RN-40", "sepl": "A learner states a + b = b + a from examples but cannot show that a - b = b - a fails.", "stop": "One act of generalising; properties differ only in content.", "role": "outcome task"}, {"id": "SK-RN-39", "t": "SK", "g": 8, "s": "Decides whether a stated property holds for a stated operation on rational numbers.", "action": "decides", "content": "whether a property holds for an operation", "cond": "operations: addition, subtraction, multiplication, division; properties: closure, commutativity, associativity; response yes or no with a reason", "ex": "Is division of rational numbers commutative?", "sep": "SK-RN-40", "sepl": "A learner answers 'no' correctly from memory but cannot give a case that shows it.", "stop": "One judgement per task.", "role": "outcome task"}, {"id": "SK-RN-40", "t": "SK", "g": 8, "s": "Gives a counterexample that shows a stated property does not hold for a stated operation on rational numbers.", "action": "gives", "content": "a counterexample", "cond": "subtraction or division; commutativity, associativity, or closure under division by zero", "ex": "Show with one example that subtraction of rational numbers is not associative.", "sep": "SK-RN-39", "sepl": "A learner who is told that subtraction is not associative can show it with 5 - (3 - 1) and (5 - 3) - 1, but answers 'yes' when asked unprompted whether subtraction is associative.", "stop": "One act.", "role": "outcome task"}, {"id": "SK-RN-41", "t": "SK", "g": 8, "s": "Finds one rational number between two given rational numbers.", "action": "finds", "content": "one rational number between two", "cond": "fractions with denominators up to 12, possibly negative, including neighbours such as 1/3 and 1/2", "ex": "Find a rational number between -1/3 and -1/4.", "sep": "SK-RN-42", "sepl": "A learner finds the mean of 1/3 and 1/2 but cannot list five numbers between them.", "stop": "One act.", "role": "outcome task"}, {"id": "SK-RN-42", "t": "SK", "g": 8, "s": "Finds a stated number of rational numbers between two given rational numbers.", "action": "finds", "content": "several rational numbers between two", "cond": "up to ten numbers; fractions with denominators up to 12, possibly negative", "ex": "Write five rational numbers between 1/3 and 1/2.", "sep": "SK-RN-41", "sepl": "A learner finds the mean of 1/3 and 1/2 but cannot list five numbers between them, because they do not rewrite both with a larger common denominator.", "stop": "One procedure (KI-RN-62).", "role": "outcome task"}, {"id": "SK-RP-14", "t": "SK", "g": 8, "s": "Calculates the discount percent from a marked price and the discount.", "action": "calculates", "content": "discount percent", "cond": "marked price up to ₹50,000; discount in rupees; answer up to one decimal place", "ex": "A shirt marked ₹1,250 is sold at a discount of ₹200. Find the discount percent.", "sep": "SK-RP-15", "sepl": "A learner finds the price after a 16% discount but gives the discount percent as 200 ÷ 1050 × 100.", "stop": "One calculation.", "role": "outcome task"}, {"id": "SK-RP-15", "t": "SK", "g": 8, "s": "Calculates the selling price after a given discount percent on a marked price.", "action": "calculates", "content": "the price after a discount", "cond": "marked price up to ₹50,000; discount a whole-number percent", "ex": "A fan marked ₹2,400 is sold at 15% discount. Find the selling price.", "sep": "SK-RP-14", "sepl": "A learner finds the 15% discount of ₹360 and gives it as the selling price.", "stop": "One subtraction after one percentage.", "role": "outcome task"}, {"id": "SK-RP-16", "t": "SK", "g": 8, "s": "Calculates the price a buyer pays when a stated percentage of sales tax is added to a price.", "action": "calculates", "content": "price including sales tax", "cond": "price up to ₹50,000; tax rate a whole-number percent, called VAT in the outcome and GST in current use", "ex": "A bag costs ₹1,800 and VAT is 12%. How much does the buyer pay?", "sep": "SK-RP-15", "sepl": "A learner subtracts a 15% discount correctly but also subtracts 12% VAT instead of adding it.", "stop": "One addition after one percentage.", "role": "outcome task"}, {"id": "SK-RP-17", "t": "SK", "g": 8, "s": "Finds the selling price from a cost price and a profit or loss percent.", "action": "finds", "content": "the selling price", "cond": "whole-rupee cost price up to ₹50,000; whole-number percent", "ex": "A shopkeeper buys a watch for ₹1,200 and sells it at 15% profit. Find the selling price.", "sep": "SK-RP-18", "sepl": "A learner finds the selling price as ₹1,380 but, told that ₹1,380 includes 15% profit, gives the cost price as ₹1,380 − 15% of ₹1,380.", "stop": "One calculation.", "role": "outcome task"}, {"id": "SK-RP-18", "t": "SK", "g": 8, "s": "Finds the cost price from a selling price and a profit or loss percent.", "action": "finds", "content": "the cost price", "cond": "whole-rupee selling price up to ₹50,000; whole-number percent", "ex": "A watch is sold for ₹1,380 at a profit of 15%. Find the cost price.", "sep": "SK-RP-17", "sepl": "A learner finds a selling price from a cost price correctly but gives the cost price of a watch sold for ₹1,380 at 15% profit as ₹1,173, taking 15% of the selling price.", "stop": "One rearrangement (KI-RP-25).", "role": "outcome task"}, {"id": "SK-RP-19", "t": "SK", "g": 8, "s": "Calculates the compound interest for a principal at an annual rate compounded annually for up to three years.", "action": "calculates", "content": "compound interest compounded annually", "cond": "principal up to ₹1,00,000; rate a whole-number percent; one to three years; by formula or year by year", "ex": "Find the compound interest on ₹10,000 at 8% per year for 2 years, compounded annually.", "sep": "SK-RP-20", "sepl": "A learner finds the compound interest on ₹10,000 at 8% per year for 2 years as ₹1,664 but, for ₹10,000 at 10% per year for 1 year compounded half-yearly, gives ₹2,100, using 10% for each half-year.", "stop": "Annual compounding is one procedure; half-yearly is a separate skill.", "role": "outcome task"}, {"id": "SK-RP-20", "t": "SK", "g": 8, "s": "Calculates the compound interest for a principal at an annual rate compounded half-yearly.", "action": "calculates", "content": "compound interest compounded half-yearly", "cond": "principal up to ₹1,00,000; rate a whole-number percent per year; time up to 2 years", "ex": "Find the compound interest on ₹10,000 at 10% per year for 1 year, compounded half-yearly.", "sep": "SK-RP-19", "sepl": "A learner compounds annually correctly but uses 10% for each half-year.", "stop": "One adjustment of rate and periods.", "role": "outcome task"}, {"id": "SK-RP-21", "t": "SK", "g": 8, "s": "Decides whether two quantities in a situation are in direct proportion, in inverse proportion, or neither.", "action": "decides", "content": "the kind of variation between two quantities", "cond": "situation in words or a table of three to five pairs; response with a reason", "ex": "The number of workers and the days to build a wall: direct, inverse, or neither?", "sep": "SK-RP-22", "sepl": "A learner solves 'if 6 workers take 10 days' correctly once told it is inverse, but calls it direct when not told.", "stop": "One judgement per situation.", "role": "step"}, {"id": "SK-RP-22", "t": "SK", "g": 8, "s": "Solves a word problem in which two quantities are in direct proportion, finding a missing value.", "action": "solves", "content": "a direct proportion problem", "cond": "situation in words or a table; whole numbers or decimals up to two places; one missing value", "ex": "A car uses 8 litres of petrol for 120 km. How far does it go on 30 litres?", "sep": "SK-RP-23", "sepl": "A learner finds 450 km correctly but, for '6 workers take 10 days, how long for 4 workers', gives 10 × 4 ÷ 6.", "stop": "One missing value per task.", "role": "outcome task"}, {"id": "SK-RP-23", "t": "SK", "g": 8, "s": "Solves a word problem in which two quantities are in inverse proportion, finding a missing value.", "action": "solves", "content": "an inverse proportion problem", "cond": "situation in words or a table; whole numbers; one missing value", "ex": "6 workers take 10 days to build a wall. How long will 4 workers take?", "sep": "SK-RP-22", "sepl": "A learner solves the petrol problem correctly but gives 6 2/3 days for 4 workers, treating the situation as direct.", "stop": "One missing value per task.", "role": "outcome task"}, {"id": "SK-NN-01", "t": "SK", "g": 8, "s": "Finds the square of an integer.", "action": "finds", "content": "the square of an integer", "cond": "integers from -15 to 15; a negative base written in brackets; given in index form, as in 13², or in words; written symbols", "ex": "13² = ?   (-6)² = ?", "sep": "SK-NN-02", "sepl": "A learner gives 2³ = 8 and (-3)³ = -27 but (-6)² = -36, carrying the negative sign into the square.", "stop": "One multiplication of the base by itself; a negative base adds only the sign rule, which is practised in the same task.", "role": "outcome task"}, {"id": "SK-NN-02", "t": "SK", "g": 8, "s": "Finds the cube of an integer.", "action": "finds", "content": "the cube of an integer", "cond": "integers from -10 to 10; a negative base written in brackets; given in index form, as in 4³, or in words; written symbols", "ex": "4³ = ?   (-2)³ = ?", "sep": "SK-NN-01", "sepl": "A learner gives 5² = 25 and (-6)² = 36 but 5³ = 15, multiplying the base by the index.", "stop": "Two multiplications by the base in one task; a negative base adds only the sign rule, which is practised in the same task.", "role": "outcome task"}, {"id": "SK-NN-03", "t": "SK", "g": 8, "s": "Identifies whether a given whole number is a square number, a cube number, both or neither.", "action": "identifies", "content": "square numbers and cube numbers", "cond": "whole numbers from 1 to 1000; square numbers up to 15² = 225 and cube numbers up to 10³ = 1000; response by sorting, circling or writing the class", "ex": "Which of 27, 36, 50, 64 and 125 are square numbers, which are cube numbers, and which are both?", "sep": "SK-NN-02", "sepl": "A learner gives 3³ = 27 but sorts 27 as a square number, because 27 = 3 × 9.", "stop": "Each number is tested against the same two definitions; splitting into a square task and a cube task gives the same task type with a different list.", "role": "outcome task"}, {"id": "SK-NN-04", "t": "SK", "g": 8, "s": "Finds the square root of a square number.", "action": "finds", "content": "the square root of a square number", "cond": "square numbers from 1 to 225; the √ symbol or the words 'square root'; the non-negative root only; written symbols", "ex": "√81 = ?   √169 = ?", "sep": "SK-NN-01", "sepl": "A learner gives 9² = 81 but √81 = 40.5, halving the number.", "stop": "One act of finding the number whose square is given; the size of the square number changes only the recall needed.", "role": "outcome task"}, {"id": "SK-NN-05", "t": "SK", "g": 8, "s": "Finds the cube root of a cube number.", "action": "finds", "content": "the cube root of a cube number", "cond": "cube numbers from 1 to 1000; the ∛ symbol or the words 'cube root'; written symbols", "ex": "∛64 = ?   ∛1000 = ?", "sep": "SK-NN-04", "sepl": "A learner gives √64 = 8 but also gives ∛64 = 8, finding the square root again.", "stop": "As SK-NN-04.", "role": "outcome task"}, {"id": "SK-NN-06", "t": "SK", "g": 8, "s": "Justifies the divisibility rule of 2 or 5 for a two-digit or three-digit number from its generalised form.", "action": "justifies", "content": "why a number is divisible by 2 or by 5 exactly when its units digit is", "cond": "two-digit number ab or three-digit number abc given by its digits, not in generalised form; rule stated in the task (the units digit decides); response in words or in letters", "ex": "Using the digits a, b and c of a three-digit number abc, show why abc is divisible by 5 only when c is 0 or 5.", "sep": "SK-NN-07", "sepl": "A learner shows that abc is divisible by 5 only when c is 0 or 5, but for 4 says abc is divisible by 4 when c is 0, 4 or 8, and gives 214 as divisible by 4.", "stop": "One justification: the parts 10a and 100a are multiples of 10, so the units digit decides; the divisors 2 and 5 differ only in which digits are multiples of the divisor.", "role": "outcome task"}, {"id": "SK-NN-07", "t": "SK", "g": 8, "s": "Justifies the divisibility rule of 4 for a three-digit number from its generalised form.", "action": "justifies", "content": "why a three-digit number is divisible by 4 exactly when the number formed by its last two digits is", "cond": "three-digit number abc given by its digits, not in generalised form; rule stated in the task (the last two digits decide); response in words or in letters", "ex": "Show why a three-digit number abc is divisible by 4 exactly when the number 10b + c formed by its last two digits is divisible by 4 (for example 316, because 16 is divisible by 4).", "sep": "SK-NN-08", "sepl": "A learner shows that 4 divides 316 because 100a is a multiple of 4 and 16 is, but for 9 says abc is divisible by 9 when its last two digits are, and gives 118 as divisible by 9 because 18 is.", "stop": "One justification: 100a is a multiple of 4, so the last two digits decide; it cannot be split without losing the step that 100 is a multiple of 4.", "role": "outcome task"}, {"id": "SK-NN-08", "t": "SK", "g": 8, "s": "Justifies the divisibility rule of 3 or 9 for a two-digit or three-digit number from its generalised form.", "action": "justifies", "content": "why a number is divisible by 3 or by 9 exactly when the sum of its digits is", "cond": "two-digit number ab or three-digit number abc given by its digits, not in generalised form; rule stated in the task (the sum of the digits decides); response in words or in letters", "ex": "Show why a three-digit number abc is divisible by 9 exactly when a + b + c is divisible by 9.", "sep": "SK-NN-09", "sepl": "A learner shows that 9 divides abc exactly when a + b + c does, but for 11 says abc is divisible by 11 when a + b + c is, and gives 29 as divisible by 11 because 2 + 9 = 11.", "stop": "One justification: abc = 99a + 9b + (a + b + c), and the divisors 3 and 9 differ only in that 99a + 9b is a multiple of both.", "role": "outcome task"}, {"id": "SK-NN-09", "t": "SK", "g": 8, "s": "Justifies the divisibility rule of 11 for a two-digit or three-digit number from its generalised form.", "action": "justifies", "content": "why a number is divisible by 11 exactly when the difference of the sums of its digits in odd and even places is 0 or divisible by 11", "cond": "two-digit number ab or three-digit number abc given by its digits, not in generalised form; rule stated in the task; response in words or in letters; a remainder expression such as a + c − b may be negative", "ex": "Show why a three-digit number abc is divisible by 11 exactly when (a + c) − b is 0 or divisible by 11, and why a two-digit number ab is divisible by 11 exactly when a = b.", "sep": "SK-NN-08", "sepl": "A learner shows that abc = 99a + 11b + (a − b + c) but, for 9, applies the same rule and says 515 is divisible by 9 because 5 − 1 + 5 = 9.", "stop": "One justification: abc = 99a + 11b + (a − b + c); it differs from the digit-sum rule in the form of the remainder expression and cannot be split further.", "role": "outcome task"}, {"id": "SK-NN-10", "t": "SK", "g": 8, "s": "Justifies the divisibility rule of 6 from the divisibility of a number by 2 and by 3.", "action": "justifies", "content": "why a number is divisible by 6 exactly when it is divisible by both 2 and 3", "cond": "whole numbers of two or three digits used to show the reason, as in 156; rule stated in the task; response in words or in letters", "ex": "Explain why a number divisible by 6, such as 156, is divisible by both 2 and 3, and why a number divisible by both 2 and 3 is divisible by 6.", "sep": "SK-NN-08", "sepl": "A learner justifies the rule of 9 from 99a + 9b + (a + b + c), but justifies the rule of 6 by saying the same holds for 4 and 6, and gives 12 as divisible by 24.", "stop": "One justification, which uses the product 6 = 2 × 3 of co-prime numbers; the generalised form is not needed.", "role": "outcome task"}, {"id": "SK-NN-11", "t": "SK", "g": 8, "s": "Writes a two-digit or three-digit number given by its digits in generalised form.", "action": "writes", "content": "a number given by its digits as 10a + b or 100a + 10b + c", "cond": "two-digit number with digits a and b, or three-digit number with digits a, b and c, given as ab or abc or as a numeral such as 47 or 358; response in letters or in expanded form", "ex": "Write 47 as 10 × 4 + 7, and write the number ab and the number abc in generalised form.", "sep": "SK-NN-06", "sepl": "A learner writes 47 = 10 × 4 + 7 but writes the number ab as a × b.", "stop": "One act of writing the place values of the digits; the justification that uses the form is practised in the skills it serves.", "role": "step"}, {"id": "SK-NN-12", "t": "SK", "g": 8, "s": "Writes the prime factorisation of a whole number.", "action": "writes", "content": "a whole number as a product of primes", "cond": "whole numbers from 2 to 999 999 whose prime factors are all less than 20; by repeated division or a factor tree; answer a product of primes, with repeated primes written out or in index form", "ex": "Write 1764 as a product of prime factors.", "sep": "SK-NN-18", "sepl": "A learner writes 324 = 2 × 2 × 3 × 3 × 3 × 3 but gives √324 = 2 × 3 = 6, taking one of each prime and ignoring the repeated pairs of 3.", "stop": "One act of repeated division by primes; what is done with the primes afterwards is practised in the skills it serves.", "role": "step"}, {"id": "SK-NN-13", "t": "SK", "g": 8, "s": "Finds the square of a whole number of two or three digits.", "action": "finds", "content": "the square of a whole number", "cond": "whole numbers from 10 to 999; by multiplying the number by itself in written form; answer a whole number", "ex": "23² = ?   125² = ?", "sep": "SK-NN-01", "sepl": "A learner gives 15² = 225 but 123² = 738, adding the partial products 369, 246 and 123 without shifting them.", "stop": "One multiplication of the number by itself; the range differs from SK-NN-01 only in the number of partial products.", "role": "outcome task"}, {"id": "SK-NN-14", "t": "SK", "g": 8, "s": "Decides whether a whole number is a perfect square from its prime factorisation.", "action": "decides", "content": "whether a whole number is a perfect square", "cond": "whole numbers from 100 to 9999 whose prime factors are all less than 20; decided from the prime factorisation, with the grouping of equal primes in pairs shown; response yes or no", "ex": "Is 1156 a perfect square? Is 2400 a perfect square?", "sep": "SK-NN-15", "sepl": "A learner says 1728 = 2⁶ × 3³ is a perfect square because 2 and 3 each occur in a pair, ignoring the leftover 3.", "stop": "One decision from one grouping of the primes; splitting by size of number gives the same decision.", "role": "outcome task"}, {"id": "SK-NN-15", "t": "SK", "g": 8, "s": "Decides whether a whole number is a perfect cube from its prime factorisation.", "action": "decides", "content": "whether a whole number is a perfect cube", "cond": "whole numbers from 100 to 999 999 whose prime factors are all less than 20; decided from the prime factorisation, with the grouping of equal primes in triples shown; response yes or no", "ex": "Is 1728 a perfect cube? Is 1600 a perfect cube?", "sep": "SK-NN-14", "sepl": "A learner decides 576 = 2⁶ × 3² is a perfect square but also decides it is a perfect cube, grouping the primes in pairs.", "stop": "One decision from one grouping of the primes in triples; splitting by size of number gives the same decision.", "role": "outcome task"}, {"id": "SK-NN-16", "t": "SK", "g": 8, "s": "Finds the smallest number by which a whole number must be multiplied, or divided, to make a perfect square.", "action": "finds", "content": "the smallest multiplier or divisor that makes a perfect square", "cond": "whole numbers from 12 to 9999 that are not perfect squares, with prime factors all less than 20; by prime factorisation; the direction (multiply or divide) stated in the task; answer one whole number", "ex": "Find the smallest number by which 252 must be multiplied to make a perfect square. Find the smallest number by which 9408 must be divided to make a perfect square.", "sep": "SK-NN-14", "sepl": "A learner decides 252 = 2² × 3² × 7 is not a perfect square but gives 42 as the smallest multiplier, multiplying by one of each prime and not only by the prime with no partner.", "stop": "Both directions use the same primes that have no partner, so they are one procedure; splitting them gives parts that cannot be evidenced apart.", "role": "outcome task"}, {"id": "SK-NN-17", "t": "SK", "g": 8, "s": "Finds the smallest number by which a whole number must be multiplied, or divided, to make a perfect cube.", "action": "finds", "content": "the smallest multiplier or divisor that makes a perfect cube", "cond": "whole numbers from 20 to 99 999 that are not perfect cubes, with prime factors all less than 20; by prime factorisation; the direction (multiply or divide) stated in the task; answer one whole number", "ex": "Find the smallest number by which 392 must be multiplied to make a perfect cube. Find the smallest number by which 53240 must be divided to make a perfect cube.", "sep": "SK-NN-16", "sepl": "A learner gives 7 as the smallest multiplier that makes 252 = 2² × 3² × 7 a perfect square but gives 2 for 392 = 2³ × 7², treating 7 × 7 as a complete group and 2 × 2 × 2 as a pair with one left over.", "stop": "Both directions use the incomplete triples, so they are one procedure; splitting them gives parts that cannot be evidenced apart.", "role": "outcome task"}, {"id": "SK-NN-18", "t": "SK", "g": 8, "s": "Finds the square root of a perfect square by prime factorisation.", "action": "finds", "content": "the square root of a perfect square", "cond": "perfect squares from 100 to 9999 whose prime factors are all less than 20; by prime factorisation with the primes grouped in pairs; answer a whole number", "ex": "Find the square root of 1764 by prime factorisation.", "sep": "SK-NN-23", "sepl": "A learner finds √324 = 18 from 2 × 2 × 3 × 3 × 3 × 3 by pairs, but finds ∛1728 = 24 from 2⁶ × 3³, taking one prime from each pair instead of each triple.", "stop": "One procedure: factorise, group in pairs, take one prime from each pair; the factorisation is a step and the grouping cannot be practised apart from the root.", "role": "outcome task"}, {"id": "SK-NN-19", "t": "SK", "g": 8, "s": "Finds the square root of a perfect square by repeated subtraction of successive odd numbers.", "action": "finds", "content": "the square root of a perfect square", "cond": "perfect squares from 1 to 400; subtracting 1, 3, 5, … in order until 0 is reached; written working; answer the number of subtractions", "ex": "Find the square root of 169 by repeated subtraction of successive odd numbers.", "sep": "SK-NN-18", "sepl": "A learner finds √324 = 18 by prime factorisation but, subtracting from 100, stops at 0 after the odd number 19 and gives √100 = 19 instead of 10, the number of subtractions.", "stop": "One procedure of subtracting and counting; the root is read from the count, so no smaller part has its own task.", "role": "outcome task"}, {"id": "SK-NN-20", "t": "SK", "g": 8, "s": "Finds the square root of a perfect square by the division method.", "action": "finds", "content": "the square root of a perfect square", "cond": "perfect squares from 100 to 9999; whole numbers with an even or odd number of digits; by the division method with the digits grouped in pairs from the right; answer a whole number", "ex": "Find the square root of 4489 by the division method.", "sep": "SK-NN-18", "sepl": "A learner finds √1764 = 42 by prime factorisation but finds √4489 = 69 by the division method, using 6 and not 12 as the divisor at the second step.", "stop": "One procedure of pairing, trial digit, subtract and bring down; steps cannot be practised apart from the next step.", "role": "outcome task"}, {"id": "SK-NN-21", "t": "SK", "g": 8, "s": "Finds the square root of a decimal number that is a perfect square by the division method.", "action": "finds", "content": "the square root of a decimal number", "cond": "decimal numbers with two decimal places that are the squares of numbers with one decimal place, such as 2.56, 51.84 and 42.25, with up to two digits before the decimal point; by the division method with pairs on both sides of the decimal point; answer a decimal with one decimal place", "ex": "Find the square root of 51.84 by the division method.", "sep": "SK-NN-20", "sepl": "A learner finds √4489 = 67 but finds √51.84 = 72, leaving the decimal point out of the root.", "stop": "One procedure, which adds only the pairing on both sides of the decimal point and the placing of the point in the root to SK-NN-20.", "role": "outcome task"}, {"id": "SK-NN-22", "t": "SK", "g": 8, "s": "Finds the square root of a whole number that is not a perfect square, to one decimal place, by the division method.", "action": "finds", "content": "the square root of a whole number that is not a perfect square", "cond": "whole numbers from 2 to 999 that are not perfect squares; by the division method continued to two decimal places by bringing down pairs of zeros, then rounded to one decimal place; answer a decimal with one decimal place", "ex": "Find the square root of 7 to one decimal place by the division method.", "sep": "SK-NN-20", "sepl": "A learner finds √4489 = 67 but gives √7 = 2, stopping at the whole-number part because the remainder 3 is not zero.", "stop": "One procedure of continuing the division and rounding; the rounding is practised in this task and not apart from it.", "role": "outcome task"}, {"id": "SK-NN-23", "t": "SK", "g": 8, "s": "Finds the cube root of a perfect cube by prime factorisation.", "action": "finds", "content": "the cube root of a perfect cube", "cond": "perfect cubes from 125 to 999 999 whose prime factors are all less than 20; by prime factorisation with the primes grouped in triples; answer a whole number", "ex": "Find the cube root of 13824 by prime factorisation.", "sep": "SK-NN-05", "sepl": "A learner gives ∛512 = 8 and ∛1000 = 10 from memory but gives ∛13824 = 6 from 2⁹ × 3³, taking one 2 and one 3 and stopping after one triple of each prime.", "stop": "One procedure: factorise, group in triples, take one prime from each triple; the grouping cannot be practised apart from the root.", "role": "outcome task"}, {"id": "SK-NN-24", "t": "SK", "g": 8, "s": "Evaluates a power with a negative integer exponent as a number.", "action": "evaluates", "content": "a power a^(−n) with n a positive integer", "cond": "integer base from -10 to 10 other than 0 with exponent from -1 to -5, a negative base written in brackets; base 10 with exponent from -1 to -10; fraction base with numerator and denominator from 1 to 10 and exponent from -1 to -3; answer an integer, a fraction, or a decimal for a power of 10; written symbols", "ex": "3^(−2) = ?   (−4)^(−2) = ?   (2/3)^(−2) = ?   10^(−4) = ?", "sep": "SK-NN-25", "sepl": "A learner simplifies 3^7 ÷ 3^10 = 3^(−3) but evaluates 3^(−2) as −9.", "stop": "One act of rewriting a negative exponent as a reciprocal and evaluating it; the laws that produce the exponent are practised in the skills it serves.", "role": "step"}, {"id": "SK-NN-25", "t": "SK", "g": 8, "s": "Simplifies a numerical expression of powers of one base with integer exponents, using the laws of exponents.", "action": "simplifies", "content": "an expression of powers of one base multiplied, divided or raised to a power", "cond": "one base, a non-zero integer from -10 to 10 or a fraction; integer exponents from -10 to 10 including 0; up to four powers combined by × and ÷, with at most one power of a power; a negative base written in brackets; answer as a single power with a positive exponent, or as a number when the task says so; written symbols", "ex": "Simplify (3^(−7) ÷ 3^(−10)) × 3^(−5) and write the answer as a power with a positive exponent.   Simplify (−4)^5 ÷ (−4)^8.", "sep": "SK-NN-27", "sepl": "A learner gives (3^(−7) ÷ 3^(−10)) × 3^(−5) = 3^(−2) but gives 2^(−1) + 3^(−1) = 5^(−1) = 1/5, adding the bases.", "stop": "One simplification by the product, quotient and power laws on one base; a task needing a value as a number adds SK-NN-24 as a step.", "role": "outcome task"}, {"id": "SK-NN-26", "t": "SK", "g": 8, "s": "Simplifies a numerical expression of powers with different bases and the same integer exponent, using the laws of exponents.", "action": "simplifies", "content": "an expression of powers with different bases and the same exponent", "cond": "two or three powers with different bases, integers from -10 to 10 or fractions, each with the same integer exponent from -6 to 6; combined by × and ÷; a negative base written in brackets; answer as a single power with a positive exponent, or as a number when the task says so; written symbols", "ex": "(−3)^4 × (5/3)^4 = ?   2^(−3) × (−7)^(−3) = ?", "sep": "SK-NN-25", "sepl": "A learner gives 3^5 × 3^2 = 3^7 but gives 2^3 × 5^3 = 10^6, adding the exponents although the bases differ.", "stop": "One simplification by the laws for a product and a quotient of powers with equal exponents; it adds one law to SK-NN-25 and has no smaller part with its own task.", "role": "outcome task"}, {"id": "SK-NN-27", "t": "SK", "g": 8, "s": "Evaluates a numerical expression in which powers with negative integer exponents are combined by addition, subtraction, multiplication or division.", "action": "evaluates", "content": "an expression of powers with negative exponents combined by operations", "cond": "bases whole numbers from 2 to 10 or unit fractions 1/2 to 1/5; exponents from -3 to 3 including 0; up to three powers in one expression, with at most one bracket; answer an integer or a fraction with denominator up to 100; written symbols", "ex": "Find the value of (3^0 + 4^(−1)) × 2^2.   Find the value of (1/2)^(−1) + (1/3)^(−1) + (1/4)^(−1).   Find the value of ((1/3)^(−1) − (1/4)^(−1))^(−1).", "sep": "SK-NN-25", "sepl": "A learner gives (3^(−7) ÷ 3^(−10)) × 3^(−5) = 3^(−2) but gives 2^(−1) + 3^(−1) = 5^(−1) = 1/5, adding the bases.", "stop": "One evaluation in which each power is evaluated and the results are combined; the evaluation of one power is the step SK-NN-24.", "role": "outcome task"}, {"id": "SK-NN-28", "t": "SK", "g": 8, "s": "Finds the unknown exponent in an equation between powers of the same base, using the laws of exponents.", "action": "finds", "content": "the unknown exponent m", "cond": "one base, an integer other than 0, 1 and -1 or a fraction; the unknown appears in one exponent only, as m, m + 1 or 2m − 1; powers combined by × or ÷; integer solution from -10 to 10; written working", "ex": "Find m so that (−3)^(m + 1) × (−3)^5 = (−3)^7.   Find m so that 5^m ÷ 5^(−3) = 5^5.   Find m so that (2/9)^3 × (2/9)^(−6) = (2/9)^(2m − 1).", "sep": "SK-NN-25", "sepl": "A learner simplifies (−3)^2 × (−3)^5 = (−3)^7 but for (−3)^(m + 1) × (−3)^5 = (−3)^7 writes (m + 1) × 5 = 7 and gives m = 2/5.", "stop": "One problem of using a law to reduce both sides to one power and then solving for the exponent; the solving of a linear equation is a prior skill.", "role": "outcome task"}, {"id": "SK-NN-29", "t": "SK", "g": 8, "s": "Writes a number in standard form.", "action": "writes", "content": "a positive number as a × 10^n with 1 ≤ a < 10", "cond": "whole numbers with 4 to 15 digits; decimals less than 1 with up to 20 decimal places; exponent an integer; answer a × 10^n with a a decimal and n an integer; written symbols", "ex": "Write 0.000000564 and 5 967 000 000 in standard form.", "sep": "SK-NN-30", "sepl": "A learner writes 3.5 × 10^(−3) = 0.0035 but writes 0.000564 = 56.4 × 10^(−5), leaving two digits before the decimal point.", "stop": "One act of placing the decimal point and counting the places moved; large and small numbers differ only in the sign of the exponent.", "role": "outcome task"}, {"id": "SK-NN-30", "t": "SK", "g": 8, "s": "Writes a number given in standard form in usual form.", "action": "writes", "content": "a × 10^n as a decimal or whole number", "cond": "a × 10^n with a a decimal from 1 to 9.999 with up to four digits and n an integer from -20 to 15; answer a decimal or whole number written out; written symbols", "ex": "Write 3.5 × 10^(−3) and 1.496 × 10^11 in usual form.", "sep": "SK-NN-29", "sepl": "A learner writes 0.000564 = 5.64 × 10^(−4) but writes 3.5 × 10^(−3) as 0.00035, moving the point four places.", "stop": "One act of moving the decimal point by the exponent; positive and negative exponents differ only in direction.", "role": "outcome task"}, {"id": "SK-NN-31", "t": "SK", "g": 8, "s": "Compares two numbers given in standard form, saying which is greater.", "action": "compares", "content": "two positive numbers in standard form", "cond": "two numbers a × 10^n and b × 10^m with a and b from 1 to 9.999 and n and m integers from -20 to 15; pairs with equal exponents, and pairs with different exponents where the number with the greater coefficient has the smaller exponent; response the greater number", "ex": "Which is greater, 4.5 × 10^6 or 3.2 × 10^7?   Which is greater, 2.4 × 10^(−5) or 8 × 10^(−6)?", "sep": "SK-NN-29", "sepl": "A learner writes 56 400 000 = 5.64 × 10^7 but says 4.5 × 10^6 is greater than 3.2 × 10^7 because 4.5 is greater than 3.2.", "stop": "One comparison by exponent first and coefficient second; no smaller part has its own task.", "role": "outcome task"}, {"id": "SK-NN-32", "t": "SK", "g": 8, "s": "Finds how many times one quantity is as large as another from their standard forms.", "action": "finds", "content": "the quotient of two quantities given in standard form", "cond": "two positive quantities in the same unit, each given as a × 10^n with a from 1 to 9.999 and n an integer from -20 to 15; the quotient of the numbers a rounded to one decimal place; answer to the nearest whole number or as a × 10^n; contexts of length, mass and distance", "ex": "The diameter of the Sun is 1.4 × 10^9 m and the diameter of the Earth is 1.2756 × 10^7 m. How many times as large as the Earth's diameter is the Sun's diameter?", "sep": "SK-NN-31", "sepl": "A learner says 1.4 × 10^9 is the greater diameter but gives the Sun as 1.1 times as large, dividing 1.4 by 1.2756 and leaving out the factor 10².", "stop": "One problem of dividing the numbers and subtracting the exponents; the division of the coefficients is not practised apart from the problem.", "role": "outcome task"}, {"id": "SK-AG-25", "t": "SK", "g": 8, "s": "Solves a word problem about numbers, ages, money or perimeter by writing and solving a linear equation in one variable.", "action": "solves", "content": "a word problem whose equation has the variable on one side only", "cond": "one unknown; situations of consecutive numbers or consecutive multiples, a number compared with a multiple or a fraction of itself, present ages and ages after some years, quantities in a ratio, the perimeter of a rectangle or triangle, and money in coins or notes; numbers in the situation are whole numbers, or fractions or decimals with denominator up to 10; the equation, after any bracket is expanded, has the variable terms on one side only and needs up to four steps; the equation is not given; answer stated as the quantity asked for, with its unit", "ex": "The perimeter of a rectangle is 13 cm and its width is 2¾ cm. Find its length.   The sum of three consecutive multiples of 8 is 888. Find the multiples.", "sep": "SK-AG-30", "sepl": "A learner solves the given equation 3(x − 4) = x + 6 correctly as x = 9, but for 'the sum of three consecutive multiples of 8 is 888' writes the multiples as 8x, 8x + 1 and 8x + 2.", "stop": "The equation is written and solved in one task; splitting by situation (numbers, ages, money, perimeter) gives parts that practise the same writing and solving, and the two moves are also recorded as steps (SK-AG-29, SK-AG-30).", "role": "outcome task"}, {"id": "SK-AG-26", "t": "SK", "g": 8, "s": "Solves a puzzle about the digits of a two-digit number by writing and solving a linear equation in one variable.", "action": "solves", "content": "a puzzle about the digits of a two-digit number and the number made by interchanging them", "cond": "two-digit numbers; the puzzle gives the sum or the difference of the digits, or one digit as a multiple of the other, and the sum or the difference of the number and the number made by interchanging the digits; one unknown digit, the other digit written from it; the equation is not given and may have the variable on one or both sides; answer is the number, checked against the puzzle", "ex": "The sum of the digits of a two-digit number is 9. When the digits are interchanged, the new number is 27 greater than the original number. Find the number.", "sep": "SK-AG-25", "sepl": "A learner solves 'the sum of three consecutive multiples of 8 is 888' correctly as 288, 296 and 304, but for 'the digits of a two-digit number add up to 9' writes the number as x + (9 − x) and the number with its digits interchanged as (9 − x) + x, adding the digits instead of using their place values.", "stop": "Writing the number from its digits and solving the equation are done together; the textbook gives digit puzzles one set of worked examples, and the stated range keeps them to two-digit numbers.", "role": "outcome task"}, {"id": "SK-AG-27", "t": "SK", "g": 8, "s": "Solves a word problem by writing and solving a linear equation in one variable that has the variable on both sides.", "action": "solves", "content": "a word problem whose equation has the variable on both sides", "cond": "one unknown; two expressions in the unknown for the same quantity, as in ages at two different times (years ago, years later), quantities in a ratio with a stated difference, or a number compared with an expression in itself; whole numbers or fractions with denominator up to 10; the equation is not given and, after any bracket is expanded, has variable terms on both sides, in the forms ax + b = cx + d or a(x + b) = c(x + d) with integer coefficients from −20 to 20; answer stated as the quantity asked for, with its unit", "ex": "Arjun is twice as old as Shriya. Five years ago his age was three times Shriya's age. Find their present ages.   The number of boys and girls in a class are in the ratio 7 : 5. The number of boys is 8 more than the number of girls. What is the total class strength?", "sep": "SK-AG-25", "sepl": "A learner solves 'the sum of three consecutive multiples of 8 is 888' correctly, but for Arjun and Shriya writes 2x − 5 = 3x, taking the five years away from Arjun's age only.", "stop": "The unknown appears in two expressions that are set equal; splitting by situation gives parts that practise the same two-sided equation.", "role": "outcome task"}, {"id": "SK-AG-28", "t": "SK", "g": 8, "s": "Solves a word problem by writing and solving a linear equation in one variable that has fractions or has the variable in a denominator.", "action": "solves", "content": "a word problem whose equation has fractions and reduces to a linear equation", "cond": "one unknown; situations of a fraction of a quantity and of what remains, a ratio of two quantities after the same change, and a rational number whose numerator and denominator are changed; denominators up to 12; the equation has the variable in numerators over number denominators, or in the numerator and denominator of a fraction equal to another fraction; the equation is not given; answer stated as the quantity asked for, with its unit, or as a rational number", "ex": "Half of a herd of deer are grazing in the field and three-fourths of the remaining are playing nearby. The rest 9 are drinking water from the pond. Find the number of deer in the herd.   The denominator of a rational number is greater than its numerator by 8. If the numerator is increased by 17 and the denominator is decreased by 1, the number obtained is 3/2. Find the rational number.", "sep": "SK-AG-27", "sepl": "A learner solves Arjun and Shriya's ages correctly as 20 and 10, but writes the herd of deer as x/2 + 3x/4 + 9 = x, taking three-fourths of the whole herd instead of three-fourths of the remaining half.", "stop": "Reading the fractions in the situation and clearing them from the equation are done in one task; splitting by situation gives parts that practise the same two moves.", "role": "outcome task"}, {"id": "SK-AG-29", "t": "SK", "g": 8, "s": "Writes a linear equation in one variable for a word problem about numbers, ages, digits, money, perimeter or fractions of a quantity.", "action": "writes", "content": "a linear equation in one variable for a word problem", "cond": "one unknown, the letter given or chosen by the learner; situations of consecutive numbers, ages now and after or before some years, digits of a two-digit number, quantities in a ratio, perimeter, money in coins or notes and fractions of a quantity; the equation may have the variable on both sides, a bracket or fractions; the equation is not solved; response as an equation", "ex": "The present age of Sahil's mother is three times the present age of Sahil. After 5 years their ages will add to 66 years. Write an equation for Sahil's present age x.", "sep": "SK-AG-30", "sepl": "A learner solves 3(x − 4) = x + 6 correctly as x = 9, but for Sahil and his mother writes 3x + x + 5 = 66, adding the five years once instead of to each age.", "stop": "Setting up the equation is practised with nothing to solve; the solving is the neighbouring step.", "role": "step"}, {"id": "SK-AG-30", "t": "SK", "g": 8, "s": "Solves a linear equation in one variable that has the variable on both sides or inside a bracket.", "action": "solves", "content": "a linear equation with variable terms on both sides", "cond": "forms ax + b = cx + d, a(x + b) = cx + d and a(x + b) = c(x + d); integer coefficients from −20 to 20; solution an integer or a fraction with denominator up to 10, possibly negative; written working; solution stated as x = …", "ex": "Solve 5x − 7 = 2x + 8.   Solve 3(x − 4) = x + 6.", "sep": "SK-AG-25", "sepl": "A learner solves 'the perimeter of a rectangle is 13 cm and its width is 2¾ cm' with 2(l + 2¾) = 13 as l = 3¾ cm, but turns 5x − 7 = 2x + 8 into 7x − 7 = 8, moving 2x to the left side without changing its sign.", "stop": "Moving the variable terms to one side and then solving is one procedure; splitting it gives parts that cannot be evidenced apart.", "role": "step"}, {"id": "SK-AG-31", "t": "SK", "g": 8, "s": "Solves a linear equation in one variable that has fractions with whole-number denominators.", "action": "solves", "content": "a linear equation whose terms are fractions with whole-number denominators", "cond": "forms such as x/2 − 1/5 = x/3 + 1/4, (3t − 2)/4 − (2t + 3)/3 = 2/3 − t and m − (m − 1)/2 = 1 − (m − 2)/3; denominators from 2 to 12 with a common multiple up to 60; a numerator may be a linear expression, the fraction line acting as a bracket; solution an integer or a fraction with denominator up to 12, possibly negative; written working", "ex": "Solve x/2 − 1/5 = x/3 + 1/4.   Solve m − (m − 1)/2 = 1 − (m − 2)/3.", "sep": "SK-AG-30", "sepl": "A learner solves 5x − 7 = 2x + 8 correctly as x = 5, but multiplies x/2 − 1/5 = x/3 + 1/4 by 60 on the terms with x only, writing 30x − 1/5 = 20x + 1/4.", "stop": "Clearing the fractions and solving the cleared equation are one procedure; the cleared equation is the neighbouring step.", "role": "step"}, {"id": "SK-AG-32", "t": "SK", "g": 8, "s": "Solves an equation in which a fraction with the variable in its numerator and denominator equals a number or another fraction, reducing it to a linear equation.", "action": "solves", "content": "an equation with the variable in the numerator and denominator of a fraction", "cond": "forms (ax + b)/(cx + d) = p/q and (ax + b)/(cx) = p, with a, b, c, d, p and q integers from −20 to 20; solution an integer or a fraction with denominator up to 10, possibly negative, that does not make a denominator zero; written working; solution stated as x = …", "ex": "Solve (x + 1)/(2x + 3) = 3/8.   Solve (7y + 4)/(y + 2) = −4/3.", "sep": "SK-AG-30", "sepl": "A learner solves 3(x − 4) = x + 6 correctly as x = 9, but for (x + 1)/(2x + 3) = 3/8 equates the numerators and the denominators separately, writing x + 1 = 3 and 2x + 3 = 8.", "stop": "Cross-multiplying and solving the linear equation that results are one procedure; the linear equation is the neighbouring step.", "role": "step"}, {"id": "SK-AG-33", "t": "SK", "g": 8, "s": "Multiplies two or more monomials.", "action": "multiplies", "content": "monomials in one to three variables", "cond": "two to four monomials; each a number multiplied by powers of one to three variables, with powers up to 4, as in 5x, 4x², x²y and pq³; numerical coefficients integers from −20 to 20 or fractions with denominator up to 10, positive or negative; written symbols; answer a single monomial", "ex": "Find the product of 5x and 4x².   (2/3 xy) × (−9/10 x²y²) = ?   x × x² × x³ × x⁴ = ?", "sep": "SK-AG-34", "sepl": "A learner expands 3x(2x − 5) correctly as 6x² − 15x, but finds x² × x³ as x⁶, multiplying the exponents instead of adding them.", "stop": "The coefficients and the powers of each variable are multiplied in one pass; splitting them gives parts that cannot be evidenced apart.", "role": "outcome task"}, {"id": "SK-AG-34", "t": "SK", "g": 8, "s": "Expands the product of a monomial and a polynomial.", "action": "expands", "content": "a monomial times a polynomial of two to four terms", "cond": "monomial with a coefficient and up to two variables, such as 3x, −4ab and 2x²y; polynomial of two to four terms in one to three variables with powers up to 3; coefficients integers from −20 to 20 or fractions with denominator up to 10; a single product, not a sum of products; written symbols; answer written as a sum of terms", "ex": "Expand 2x(3x + 5xy).   Expand −4ab(a² − 3b + 5).", "sep": "SK-AG-33", "sepl": "A learner finds 5x × 4x² = 20x³, but expands 3x(2x − 5) as 6x² − 5, multiplying the first term only.", "stop": "Multiplying the monomial by each term and writing the sum is one procedure; the products of single terms are the neighbouring skill.", "role": "outcome task"}, {"id": "SK-AG-35", "t": "SK", "g": 8, "s": "Expands the product of two binomials.", "action": "expands", "content": "the product of two binomials", "cond": "each binomial has two terms in one or two variables, each term a number, a variable or a product with powers up to 2, as in (2x − 5)(3x + 7), (a + 3b)(x + 5) and (p² − q²)(2p + q); coefficients integers from −20 to 20 or fractions with denominator up to 10; written symbols; answer with like terms collected", "ex": "Expand (2x − 5)(3x + 7).   Expand (a + 3b)(x + 5).", "sep": "SK-AG-34", "sepl": "A learner expands 3x(2x − 5) correctly as 6x² − 15x, but expands (2x − 5)(3x + 7) as 6x² − 35, multiplying the first terms and the last terms only.", "stop": "All four products are formed and written together; splitting by product gives parts that cannot be evidenced apart, and the collecting of like terms is recorded as a step.", "role": "outcome task"}, {"id": "SK-AG-36", "t": "SK", "g": 8, "s": "Expands the product of a binomial and a trinomial.", "action": "expands", "content": "the product of a binomial and a trinomial", "cond": "a binomial and a trinomial in one or two variables with powers up to 2 in the trinomial, as in (a + 7)(a² + 3a + 5) and (x + y)(x² − xy + y²); coefficients integers from −20 to 20 or fractions with denominator up to 10; written symbols; answer with like terms collected", "ex": "Expand (a + 7)(a² + 3a + 5).   Expand (x + y)(x² − xy + y²).", "sep": "SK-AG-35", "sepl": "A learner expands (a + 7)(b − 5) correctly as ab − 5a + 7b − 35, but expands (a + 7)(a² + 3a + 5) as a³ + 7a² + 5a + 35, using the first, outer, inner and last terms only.", "stop": "All six products are formed and written together; splitting by product gives parts that cannot be evidenced apart.", "role": "outcome task"}, {"id": "SK-AG-37", "t": "SK", "g": 8, "s": "Collects the like terms in the terms obtained by expanding a product of two polynomials.", "action": "collects", "content": "the like terms of an expanded product", "cond": "four to nine terms in one or two variables with powers up to 3, as in 6x² + 14x − 15x − 35 and a³ + 3a² + 5a + 7a² + 21a + 35; coefficients integers from −45 to 45 or fractions with denominator up to 10; includes like terms written in a different order, as xy and yx, and pairs that cancel to zero; written symbols; answer with no like terms left", "ex": "Collect the like terms in 6x² + 14x − 15x − 35.   Collect the like terms in x³ − x²y + xy² + x²y − xy² + y³.", "sep": "SK-AG-34", "sepl": "A learner expands 3x(2x − 5) correctly as 6x² − 15x, but collects 6x² + 14x − 15x − 35 as 6x² + 29x − 35, adding the sizes of 14x and 15x and dropping the minus sign.", "stop": "Grouping the like terms and adding their coefficients are done in one pass; the grouping alone gives a part that cannot be evidenced apart from the adding.", "role": "step"}, {"id": "SK-AG-38", "t": "SK", "g": 8, "s": "Finds the square of a number near a multiple of ten or a hundred using the identity for (a + b)² or (a − b)².", "action": "finds", "content": "the square of a whole number or a decimal near a multiple of 10 or 100", "cond": "whole numbers from 20 to 1000 that are 1, 2 or 3 more or less than a multiple of 10 or of 100, as 71, 99, 102 and 998; decimals with one decimal place that are 0.1 to 0.3 more or less than a whole number, as 5.2 and 8.9; the number written as a sum or a difference and squared by the identity; written working; numerical answer", "ex": "Find 103² using an identity.   Find 98².   Find 8.9².", "sep": "SK-AG-39", "sepl": "A learner finds 98 × 102 = 9996 correctly by (100 − 2)(100 + 2), but finds 98² as 100² − 2² = 9996, using the identity for a sum times a difference.", "stop": "Choosing the split and squaring with the identity are done in one pass; splitting them gives parts that cannot be evidenced apart.", "role": "outcome task"}, {"id": "SK-AG-39", "t": "SK", "g": 8, "s": "Finds the product of two numbers equally far from a multiple of ten on either side using the identity for (a + b)(a − b).", "action": "finds", "content": "the product of two whole numbers a − b and a + b", "cond": "two whole numbers a − b and a + b, where a is a multiple of 10 from 50 to 300 and b is 1, 2 or 3, as 98 × 102, 51 × 49, 78 × 82 and 297 × 303; written working; numerical answer", "ex": "Find 98 × 102 using an identity.   Find 51 × 49.   Find 297 × 303.", "sep": "SK-AG-38", "sepl": "A learner finds 103² = 10609 and 98² = 9604 correctly by the identities for (a + b)² and (a − b)², but finds 98 × 102 as 100² + 2² = 10004.", "stop": "Seeing the pair as a − b and a + b and writing the difference of squares are done in one pass; splitting them gives parts that cannot be evidenced apart.", "role": "outcome task"}, {"id": "SK-AG-40", "t": "SK", "g": 8, "s": "Finds the product of two numbers near the same base using the identity for (x + a)(x + b).", "action": "finds", "content": "the product of two numbers that differ from a common base by small amounts", "cond": "whole numbers or decimals with one decimal place; the base x is a multiple of 5 from 5 to 100 and each number differs from x by a whole number from 1 to 5, or by 0.1 to 0.3 for decimals; a and b may be positive or negative and are not equal in size, as in 103 × 104, 103 × 98, 5.1 × 5.2 and 9.7 × 9.8; written working; numerical answer", "ex": "Find 103 × 104 using an identity.   Find 9.7 × 9.8.", "sep": "SK-AG-39", "sepl": "A learner finds 98 × 102 = 9996 correctly by (a + b)(a − b), but finds 103 × 104 as 100² + 3 × 4 = 10012, leaving out the middle term (3 + 4) × 100.", "stop": "Choosing the base and applying the identity are done in one pass; splitting them gives parts that cannot be evidenced apart.", "role": "outcome task"}, {"id": "SK-AG-41", "t": "SK", "g": 8, "s": "Finds the difference of the squares of two numbers using the identity for a² − b².", "action": "finds", "content": "the difference of two squares of numbers whose sum or difference is easy to use", "cond": "two whole numbers from 40 to 200, or two decimals with up to two decimal places, whose sum is 2 or a multiple of 10, as in 51² − 49², 153² − 147², (1.02)² − (0.98)² and 12.1² − 7.9²; written working; numerical answer", "ex": "Find 51² − 49² using an identity.   Find 153² − 147².   Find (1.02)² − (0.98)².", "sep": "SK-AG-39", "sepl": "A learner finds 98 × 102 = 9996 correctly by writing (100 − 2)(100 + 2), but finds 51² − 49² as (51 − 49)² = 4.", "stop": "Writing the difference of squares as a product and multiplying are done in one pass; splitting them gives parts that cannot be evidenced apart.", "role": "outcome task"}, {"id": "SK-GE-08", "t": "SK", "g": 8, "s": "Finds the fourth angle of a quadrilateral from its other three angles, each given in degrees.", "action": "finds", "content": "the fourth angle of a quadrilateral, using the angle sum property", "cond": "convex quadrilateral given as a figure or in words; three given angles whole numbers of degrees, each less than 180°, with a sum more than 180° and less than 360°; response: the fourth angle in degrees with the property stated as the reason", "ex": "Three angles of a quadrilateral are 75°, 90° and 105°. Find the fourth angle.", "sep": "SK-GE-09", "sepl": "A learner finds the fourth angle of a quadrilateral with angles 80°, 95° and 110° correctly as 75°, but given angles x, 2x, 3x and 4x writes x + 2x + 3x + 4x = 9x and gives x = 40°.", "stop": "Adding the three given angles and subtracting from 360° is one act; no smaller task can be set that shows the angle sum property used.", "role": "outcome task"}, {"id": "SK-GE-09", "t": "SK", "g": 8, "s": "Finds the angles of a quadrilateral from angles given as expressions in x.", "action": "finds", "content": "the angles of a quadrilateral whose angles are given as expressions in one variable", "cond": "four angles each a whole number of degrees or an expression ax + b with a from 1 to 4 and b from -20 to 40, at least two containing x; the equation has a whole-number solution; response: the value of x and each angle in degrees", "ex": "The angles of a quadrilateral are x°, (x + 20)°, (2x - 10)° and 90°. Find x and each angle.", "sep": "SK-GE-10", "sepl": "A learner solves 2x + (3x + 5) + (4x - 15) + (x + 10) = 360 correctly to get x = 36, but for angles in the ratio 3 : 5 : 9 : 13 writes the angles as 3°, 5°, 9° and 13°.", "stop": "Writing the equation from the angle sum and solving it are carried out together in every task; a task that shows one without the other is a different skill (solving an equation).", "role": "outcome task"}, {"id": "SK-GE-10", "t": "SK", "g": 8, "s": "Finds the angles of a quadrilateral from angles given in a ratio.", "action": "finds", "content": "the angles of a quadrilateral whose angles are in a given ratio", "cond": "ratio of four whole numbers from 1 to 15 whose sum divides 360 exactly, each angle less than 180°; response: each angle in degrees", "ex": "The angles of a quadrilateral are in the ratio 3 : 5 : 9 : 13. Find all the angles.", "sep": "SK-GE-09", "sepl": "A learner finds 36°, 60°, 108° and 156° for the ratio 3 : 5 : 9 : 13, but for angles x°, (x + 20)°, (2x - 10)° and 90° forgets the 20, -10 and 90, writes x + x + 2x = 360 and gives x = 90.", "stop": "Sharing 360° in a ratio is one act; the sum of the ratio terms and the share of each angle are found in every task.", "role": "outcome task"}, {"id": "SK-GE-11", "t": "SK", "g": 8, "s": "Finds an interior angle of a quadrilateral from the angle that makes a straight line with it at the same vertex.", "action": "finds", "content": "an interior angle of a quadrilateral from the exterior angle at the same vertex", "cond": "figure of a convex quadrilateral with one side extended beyond a vertex and the angle between the extension and the next side marked in whole degrees from 30° to 150°; response: the interior angle in degrees with the reason", "ex": "One side of a quadrilateral is extended beyond vertex C. The angle between the extension and side CD is 70°. Find the interior angle at C.", "sep": "SK-GE-08", "sepl": "A learner finds the fourth angle as 75° from interior angles 80°, 95° and 110°, but when the third angle is given as an exterior angle of 70° uses 70° as the interior angle and gives 115° for the fourth angle.", "stop": "The interior angle comes from one fact about angles on a straight line; no smaller task can be set.", "role": "step"}, {"id": "SK-GE-12", "t": "SK", "g": 8, "s": "Verifies by measuring that a stated property holds for a drawn parallelogram, rhombus, rectangle or square.", "action": "verifies", "content": "a property of a parallelogram or of a special parallelogram, by measuring one drawn figure", "cond": "figure drawn on paper with sides from 3 cm to 8 cm; ruler read to the nearest millimetre and protractor to the nearest degree; properties: opposite sides equal, opposite angles equal, adjacent angles add up to 180°, diagonals bisect each other, diagonals of a rhombus meet at right angles, diagonals of a rectangle are equal; response: the measures recorded and a statement of whether the property holds within measuring error", "ex": "Measure the sides and angles of the drawn parallelogram ABCD. Does it have opposite angles equal?", "sep": "SK-GE-13", "sepl": "A learner measures ∠A = 62° and ∠C = 62° in a drawn parallelogram and writes that opposite angles are equal, but asked why this must be so in every parallelogram writes 'because I measured them'.", "stop": "Measuring the figure and comparing the measures with the stated property are done together in every task; no smaller task shows a verification.", "role": "outcome task"}, {"id": "SK-GE-13", "t": "SK", "g": 8, "s": "Verifies by reasoning that a stated angle property holds for every parallelogram, using parallel lines and a transversal.", "action": "verifies", "content": "that opposite angles of a parallelogram are equal or that adjacent angles add up to 180°, by reasoning", "cond": "parallelogram ABCD with AB parallel to DC and AD parallel to BC drawn and not to scale; properties: adjacent angles add up to 180°, opposite angles are equal; reason from co-interior angles between parallel lines; response: a chain of statements, each with its reason", "ex": "ABCD is a parallelogram. Show that ∠A = ∠C, giving a reason for each step.", "sep": "SK-GE-14", "sepl": "A learner shows ∠A + ∠B = 180° and ∠B + ∠C = 180°, so ∠A = ∠C, but asked why opposite sides of a parallelogram are equal writes 'AB and DC are parallel, so they are equal'.", "stop": "The reason for the adjacent angles and the step to the opposite angles use the same parallel-line fact; no smaller task shows the reasoning.", "role": "outcome task"}, {"id": "SK-GE-14", "t": "SK", "g": 8, "s": "Verifies by reasoning that a stated property of the sides or the diagonals holds for every parallelogram, using congruent triangles.", "action": "verifies", "content": "that opposite sides of a parallelogram are equal or that its diagonals bisect each other, by reasoning", "cond": "parallelogram ABCD with AB parallel to DC and AD parallel to BC drawn and not to scale; properties: opposite sides are equal, diagonals bisect each other; reasons: alternate angles between parallel lines, ASA congruence of two triangles formed by a diagonal, equal matching sides of congruent triangles; response: a chain of statements, each with its reason", "ex": "ABCD is a parallelogram. Draw the diagonal AC and show that AB = DC, giving a reason for each step.", "sep": "SK-GE-13", "sepl": "A learner shows that the diagonal AC splits ABCD into two triangles that are congruent by ASA, so AB = DC, but asked why ∠A + ∠B = 180° writes ∠A = ∠B.", "stop": "Choosing the two triangles, matching their angles and sides and reading off the equal sides or the equal halves of the diagonals use one congruence argument; no smaller task shows the reasoning.", "role": "outcome task"}, {"id": "SK-GE-15", "t": "SK", "g": 8, "s": "Finds an unknown angle of a parallelogram, rhombus or rectangle from given measures, using its properties.", "action": "finds", "content": "an unknown angle of a parallelogram, rhombus or rectangle", "cond": "one or two angles given in whole degrees, or the angle between the diagonals of a rhombus; unknown angles at the vertices or where the diagonals meet; response: the angle in degrees with the property used stated", "ex": "In parallelogram ABCD, ∠A = 65°. Find ∠B, ∠C and ∠D, giving the property used for each.", "sep": "SK-GE-16", "sepl": "A learner gives ∠B = 115°, ∠C = 65° and ∠D = 115° for a parallelogram with ∠A = 65°, but with diagonal AC = 10 cm gives AO = 10 cm for the segment from A to the point O where the diagonals meet.", "stop": "One angle property is applied to one given angle in every task; no smaller task can be set.", "role": "outcome task"}, {"id": "SK-GE-16", "t": "SK", "g": 8, "s": "Finds an unknown side or diagonal segment of a parallelogram, rhombus or rectangle from given lengths, using its properties.", "action": "finds", "content": "an unknown side or a segment of a diagonal of a parallelogram, rhombus or rectangle", "cond": "lengths given in whole or half centimetres from 2 cm to 12 cm; unknown sides, or the segments into which the diagonals cut each other; response: the length in centimetres with the property used stated", "ex": "The diagonals of rectangle ABCD meet at O. AC = 12 cm. Find BD and OB, giving the property used for each.", "sep": "SK-GE-15", "sepl": "A learner gives AO = 5 cm for AC = 10 cm in a parallelogram, but with ∠A = 65° gives ∠B = 65°, treating adjacent angles as equal.", "stop": "One length property is applied to one given length in every task; no smaller task can be set.", "role": "outcome task"}, {"id": "SK-GE-17", "t": "SK", "g": 8, "s": "Decides whether every figure of one of the kinds parallelogram, rhombus, rectangle and square is also a figure of another of these kinds, giving the reason.", "action": "decides", "content": "whether one kind of quadrilateral is a special case of another, from their definitions", "cond": "pairs taken from parallelogram, rhombus, rectangle and square; statement of the form 'Every X is a Y'; response: true or false with a reason from the definitions, and for a false statement a figure of kind X that is not of kind Y described", "ex": "Is every rectangle a square? Is every square a rectangle? Give a reason for each.", "sep": "SK-GE-18", "sepl": "A learner decides correctly that 'every rectangle is a square' is false and 'every square is a rectangle' is true, but asked which of the four kinds have four equal sides lists only the rhombus.", "stop": "Comparing the definitions of two kinds and stating whether the first is included in the second is one act; no smaller task shows the relationship.", "role": "outcome task"}, {"id": "SK-GE-18", "t": "SK", "g": 8, "s": "Identifies which of the parallelogram, rhombus, rectangle and square have a stated property.", "action": "identifies", "content": "the kinds of quadrilateral, among parallelogram, rhombus, rectangle and square, that have a given property", "cond": "properties: opposite sides parallel, four equal sides, four right angles, equal diagonals, diagonals that meet at right angles, diagonals that bisect each other; response: the list of all the kinds that have the property", "ex": "Which of the parallelogram, rhombus, rectangle and square have diagonals that are equal in length?", "sep": "SK-GE-17", "sepl": "A learner lists the rhombus and the square for four equal sides and the rectangle and the square for four right angles, but decides that 'every parallelogram is a rectangle' is true because every rectangle is a parallelogram.", "stop": "Checking each of the four kinds against the property is one act; the list is the evidence and no smaller task can be set.", "role": "outcome task"}, {"id": "SK-GE-19", "t": "SK", "g": 8, "s": "Draws the front view, the side view and the top view of a solid made of cubes.", "action": "draws", "content": "the three views of a solid made of unit cubes", "cond": "solid of 4 to 10 unit cubes, at most 3 cubes high, 3 wide and 3 deep, shown in a picture or as a model with the front marked; views drawn on a square grid with one square for each cube face seen; response: three drawings", "ex": "A solid is made of 5 cubes: in the front row three stacks of 2, 1 and 1 cubes from left to right, and one cube behind the left stack on the ground. Draw its front view, side view and top view.", "sep": "SK-GE-20", "sepl": "A learner draws correct views for a solid of 5 cubes but draws the top view of a cone standing on its base as a triangle.", "stop": "The three views come from the same solid read in three directions; each view is drawn from the same two facts about stacks, and no smaller task shows the representation.", "role": "outcome task"}, {"id": "SK-GE-20", "t": "SK", "g": 8, "s": "Draws the front view, the side view and the top view of a cuboid, a cylinder, a cone, a sphere or an object made of two of these solids.", "action": "draws", "content": "the three views of a simple solid or of an object made of two simple solids", "cond": "cuboid, cube, cylinder, cone, sphere, or an object with one of these standing on the top face of another and within it; each solid standing on a flat face or its base; response: three freehand drawings that show the shapes and the relative positions", "ex": "Draw the front view, side view and top view of a cylinder standing on a cuboid.", "sep": "SK-GE-19", "sepl": "A learner draws a cylinder standing on its base as a rectangle from the front and the side and a circle from above, but draws the front view of the solid of 5 cubes (stacks of 2, 1 and 1 with one cube behind the left stack) as 5 squares, counting every cube.", "stop": "Each view of a simple solid is one known figure or a combination of two; no smaller task shows the representation.", "role": "outcome task"}, {"id": "SK-GE-21", "t": "SK", "g": 8, "s": "Draws an oblique sketch of a cuboid or a cube from its length, breadth and height on squared paper.", "action": "draws", "content": "an oblique sketch of a cuboid or a cube", "cond": "length, breadth and height each a whole number of squares from 1 to 6; squared paper; response: a sketch with the twelve edges drawn", "ex": "Draw an oblique sketch of a cuboid with length 4 squares, breadth 3 squares and height 2 squares on squared paper.", "sep": "SK-GE-22", "sepl": "A learner draws the oblique sketch of a 4 × 3 × 2 cuboid correctly, but on isometric dot paper draws the front face as a rectangle with a right angle at each corner.", "stop": "The front face, the back face and the joining edges are drawn in one sequence; no smaller task shows the representation.", "role": "outcome task"}, {"id": "SK-GE-22", "t": "SK", "g": 8, "s": "Draws an isometric sketch of a cuboid or a cube from its length, breadth and height on isometric dot paper.", "action": "draws", "content": "an isometric sketch of a cuboid or a cube", "cond": "length, breadth and height each a whole number of dot spaces from 1 to 6; isometric dot paper; response: a sketch with the twelve edges drawn", "ex": "Draw an isometric sketch of a cuboid with length 5 units, breadth 3 units and height 2 units on isometric dot paper.", "sep": "SK-GE-21", "sepl": "A learner draws the edges of a 5 × 3 × 2 cuboid along the vertical and slanting dot lines with the right number of dot spaces, but in an oblique sketch draws the front face as a parallelogram
