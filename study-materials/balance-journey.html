<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equations on a balance</title>
<!-- Student 2, equations journey 1 (9 Nov 2026). Design: equations-journey-1.md. Rules: ../CLAUDE.md (copied from Student 1, 9 Nov).
     Success first: a worked example before each knowledge item, one supported item, then fresh items on her own until the item holds
     (stages, not a count); two items in a row not right end that practice for the day with her place kept. The balance is the
     manipulative: she takes bags and counters off with the controls beside each side; nothing is judged until she taps the button.
     Whole tasks without the picture lead, after a wrong answer, to chained short checks (bags, counters, sharing), the first one not
     right is taught, then one return to the whole task, then the worked answer and a saved stop. A gap of 3 days, then a fresh task
     and a paper task. Records stay on this device; ?teacher=1 shows the download. -->
<style>
:root{--bg:#F4F6F8;--card:#FFFFFF;--ink:#1A2430;--muted:#5B6878;--line:#D3DAE2;--accent:#1F6FB2;--soft:#EEF3F8;--key:#E9EEF3;--bag:#B9822F;--bagsoft:#F6E9D3;--ctr:#2E7D4F;--hot:#C4553A;--ok:#2E7D4F;--oksoft:#E5F3EA;--warn:#9A6A00;--warnsoft:#FBF0D6;
  --f:system-ui,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121820;--card:#1A222C;--ink:#E6ECF2;--muted:#9AA8B6;--line:#2E3A47;--accent:#6BAEF0;--soft:#1F2934;--key:#26313D;--bag:#E0AA55;--bagsoft:#3A2C15;--ctr:#7FD3A4;--hot:#E98B72;--ok:#7FD3A4;--oksoft:#173226;--warn:#E8C063;--warnsoft:#3A2E12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121820;--card:#1A222C;--ink:#E6ECF2;--muted:#9AA8B6;--line:#2E3A47;--accent:#6BAEF0;--soft:#1F2934;--key:#26313D;--bag:#E0AA55;--bagsoft:#3A2C15;--ctr:#7FD3A4;--hot:#E98B72;--ok:#7FD3A4;--oksoft:#173226;--warn:#E8C063;--warnsoft:#3A2E12;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:18px/1.45 var(--f)}
.app{max-width:1040px;margin:0 auto;padding:12px 16px;display:grid;gap:10px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0}
.btn{font:600 1rem var(--f);border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:10px 16px;min-height:48px;min-width:48px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.small{font-size:.9rem;padding:8px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
.text{display:flex;flex-direction:column;gap:10px}
.story{font-size:1.12rem;margin:0}
.q{font-size:1.2rem;font-weight:700;color:var(--accent);margin:0}
.hint{font-size:.95rem;color:var(--muted);margin:0}
.fb{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--soft);border-radius:8px}
.fb.ok{border-color:var(--ok);background:var(--oksoft)}.fb.info{border-color:var(--warn);background:var(--warnsoft)}
.eq{font:700 1.5rem var(--f);margin:0;letter-spacing:.02em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ans{display:flex;align-items:center;gap:8px;font-size:1.2rem;flex-wrap:wrap}
.box{width:110px;min-height:50px;border:3px solid var(--accent);border-radius:10px;text-align:center;font:700 1.5rem var(--f);background:var(--card);color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(4,60px);gap:6px}
.keys button{height:52px;border:1px solid var(--line);border-radius:10px;background:var(--key);color:var(--ink);font:700 1.3rem var(--f);cursor:pointer}
.keys .go{grid-column:span 2;background:var(--accent);color:#fff;border-color:var(--accent)}
/* The balance */
.pic{display:flex;flex-direction:column;gap:8px;min-width:0}
.beam{width:100%;height:auto;display:block}
.beam g{transition:transform .5s ease;transform-origin:300px 40px}
.pans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pan{border:2px solid var(--line);border-radius:12px;padding:10px;min-height:150px;display:flex;flex-direction:column;gap:8px;background:var(--soft)}
.side{font-size:.9rem;color:var(--muted);margin:0;text-align:center}
.items{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-height:60px}
.bag{width:40px;height:48px;border-radius:8px 8px 12px 12px;background:var(--bagsoft);border:3px solid var(--bag);display:grid;place-items:center;font:700 1.05rem var(--f);color:var(--bag);position:relative}
.bag.off{opacity:.35;border-style:dashed}
.bag .n{font-size:1rem;color:var(--ink)}
.ctrs{display:grid;grid-template-columns:repeat(6,22px);gap:5px}
.ctr{width:22px;height:22px;border-radius:50%;background:var(--ctr)}
.ctr.off{opacity:.3;background:transparent;border:2px dashed var(--ctr)}
.live{font:700 1.05rem var(--f);color:var(--hot);border:2px dashed var(--hot);border-radius:8px;padding:2px 8px;align-self:center}
.ctl{display:flex;flex-direction:column;align-items:stretch;gap:4px}
.ctl .btn{min-width:44px;padding:8px 10px;font-size:.92rem;width:100%}
.ctl .read{min-width:2.2em;text-align:center;font-weight:700}
.lines{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--soft);border-radius:8px;font:600 1.1rem var(--f);display:flex;flex-direction:column;gap:2px}
.lines:empty{display:none}
.lines span.new{color:var(--accent)}
.teacher{border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:.9rem;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,16,24,.5);display:grid;place-items:center;padding:16px}
.overlay>div{background:var(--card);border-radius:14px;padding:22px;max-width:420px}
.hide{display:none!important}
@media (max-width:760px){.card{grid-template-columns:1fr}}
@media (max-width:420px){.bag{width:34px;height:42px}.ctrs{grid-template-columns:repeat(5,20px)}.ctr{width:20px;height:20px}.pan{padding:6px}}
</style>
</head>
<body>
<div class="app">
  <header><h1>Equations on a balance</h1><div class="row"><button class="btn small" id="readBtn">Read it</button><button class="btn small" id="pauseBtn">Pause</button></div></header>
  <main class="card"><div class="pic" id="pic"></div><div class="text" id="text"></div></main>
  <div class="teacher hide" id="teacher"></div>
</div>
<div class="overlay hide" id="overlay"><div><p class="story"><b>Paused.</b> Your place is kept.</p><button class="btn primary" id="goOn">Go on</button></div></div>
<script src="assets/sheet-config.js"></script>
<script src="assets/sheetlog.js"></script>
<script>
/* ===================== Numbers and words (no screen code) ===================== */
const M="−";
const JOURNEY={key:"student2-balance-v1",kiKey:"student2-ki-v1",version:"balance-journey 1.0 (9 Nov 2026)",skill:"SK-AG-30",prefix:"s2bal"};
const STAGES=["supported","fresh","contrast","selected","retained"],CAP=8,DELAY_DAYS=3;
const term=(b,c)=>{const p=[];if(b)p.push(b===1?"x":b+"x");if(c||!b)p.push(String(c));return p.join(" + ");};
const eqText=it=>`${term(it.L.b,it.L.c)} = ${term(it.R.b,it.R.c)}`;
const bagsW=n=>n===1?"1 bag":n+" bags", ctrW=n=>n===1?"1 counter":n+" counters";
const sideW=s=>s==="L"?"left":"right", other=s=>s==="L"?"R":"L";
const total=(side,x)=>side.b*x+side.c;
const RI=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
/* What each kind of item checks in the Grade 8 graph (teacher side only). */
const SETS={
 bags:{ki:"KI-AG-24",conds:["left","right"],teacher:"Subtract the same x term from both sides (ax + b = cx + d → (a − c)x + b = d)"},
 counters:{ki:"KI-AG-19",conds:["left","right"],teacher:"Subtract the same number from both sides (ax + b = c → ax = c − b)"},
 share:{ki:"KI-AG-19",conds:["left","right"],teacher:"Divide both sides by the same non-zero number (ax = c → x = c ÷ a)"},
 check:{ki:"KI-AG-18",conds:["same","notsame"],teacher:"A solution makes both sides equal when substituted"},
 whole:{skill:"SK-AG-30",conds:["left","right"],teacher:"Solve ax + b = cx + d on the balance, steps prompted"},
 lines:{skill:"SK-AG-30",conds:["left","right"],teacher:"Solve ax + b = cx + d with no picture; the balance on request"}};
const PRACTICE_ORDER=["bags","counters","share","check","whole","lines"];
/* A whole equation ax + b = cx + d with a whole-number x. "left" = more bags on the left. The side with more bags has fewer counters.
   x is kept different from the printed numbers where possible, so a number copied from the screen is not the answer. */
function genWhole(where){for(let t=0;t<2000;t++){const x=RI(1,5),big=RI(2,6),small=RI(1,big-1),cs=RI(1,8),cb=(big-small)*x+cs;
  if(cb>24||big*x+cs>36)continue;if(t<1500&&[big,small,cs,cb,big-small].includes(x))continue;
  const L=where==="left"?{b:big,c:cs}:{b:small,c:cb},R=where==="left"?{b:small,c:cb}:{b:big,c:cs};return {L,R,x,conds:[where]};}
  return {L:{b:2,c:9},R:{b:5,c:3},x:2,conds:["right"]};}
/* bx + p = q, the bags on one side. */
function genCounters(where){for(let t=0;t<2000;t++){const b=RI(2,5),x=RI(1,5),p=RI(1,8),q=b*x+p;if(q>24)continue;if(t<1500&&[b,p,q].includes(x))continue;
  const bs={b,c:p},os={b:0,c:q};return {L:where==="left"?bs:os,R:where==="left"?os:bs,x,conds:[where]};}}
/* bx = q. */
function genShare(where){for(let t=0;t<2000;t++){const b=RI(2,5),x=RI(2,6),q=b*x;if(q>24||x===b)continue;
  const bs={b,c:0},os={b:0,c:q};return {L:where==="left"?bs:os,R:where==="left"?os:bs,x,conds:[where]};}}
function unmet(res,conds){const seen=new Set(res.filter(r=>r.first).flatMap(r=>r.conds));return conds.filter(c=>!seen.has(c));}
/* A set holds for now when its last item was right on her own and every case that defeats its shortcut has been right on her own. */
function passedNow(res,conds){return !!res.length&&res[res.length-1].first&&unmet(res,conds).length===0;}
function makeItem(id,res){const conds=SETS[id].conds,need=unmet(res,conds),want=need.length?need[res.length%need.length]:conds[RI(0,conds.length-1)];
  if(id==="counters")return {...genCounters(want),kind:id};
  if(id==="share")return {...genShare(want),kind:id};
  if(id==="check"){const it=genWhole(Math.random()<.5?"left":"right"),cand=want==="same"?it.x:(it.x>1&&Math.random()<.5?it.x-1:it.x+1);return {...it,kind:id,cand,conds:[want]};}
  return {...genWhole(want),kind:id};}

/* ===================== Storage and records ===================== */
const $=id=>document.getElementById(id),text=$("text"),pic=$("pic");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayKey=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const mk=k=>({get(){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}});
const store=mk(JOURNEY.key),kiStore=mk(JOURNEY.kiKey);
const fresh=()=>({v:1,task:0,events:[],pr:{},today:{}});
let S=store.get();if(!S||S.v!==1)S=fresh();
let K=kiStore.get()||{};
/* Knowledge items are stored once for her (student2-ki-v1), keyed by set, so an item that holds here counts in later journeys. */
function prOf(id){if(SETS[id].ki)return K[id]||(K[id]={ki:SETS[id].ki,res:[],passed:false});return S.pr[id]||(S.pr[id]={res:[],passed:false});}
function saveAll(){store.set(S);kiStore.set(K);}
let role="practice",curSet=null;
const HAS_SHEET=typeof SheetLog!=="undefined";
/* Every record also goes to her Google Sheet (Activity tab) when the page is served with assets/sheetlog.js. */
function recordEvent(name,detail){const e={t:new Date().toISOString(),event:name,set:curSet,...detail};S.events.push(e);store.set(S);
 if(HAS_SHEET)SheetLog.activity({event:name,set:e.set||"",role:e.role||"",eq:e.item?e.item.eq:"",x:e.item?e.item.x:"",answer:e.answer||"",
  right:e.right===undefined?"":e.right?1:0,own:e.own===undefined?"":e.own?1:0,support:e.support||"",checks:(e.checks||[]).join(" "),detail:JSON.stringify(e)});}
/* A practice set's latest state goes to the Now tab. */
function sendState(id,status){if(!HAS_SHEET)return;const p=prOf(id),set=SETS[id];
 SheetLog.state({set:id,ki:set.ki||set.skill,teacher:set.teacher,status,stage:p.stage||"",own_right:p.res.filter(r=>r.first).length,items:p.res.length});}
function decision(action,reason){recordEvent("teaching decision",{action,reason});}
/* One row per answer: the item, the support given, her answer, right or not, and whether it was her own first answer. */
function log(it,answer,right,extra={}){const set=SETS[it.kind]||{};
  recordEvent("answer",{role,item:{kind:it.kind,eq:eqText(it),x:it.x,cand:it.cand,conds:it.conds},answer:String(answer),right,
   checks:role==="explanation"?[]:[set.ki||set.skill],own:!["guided_practice","correction","return_whole","explanation"].includes(role)&&!extra.helped,support:extra.support||"none",...extra});}

/* ===================== The balance (the manipulative) ===================== */
/* P is what the picture shows. Each side: b bags, c counters, ob/oc taken off so far, dealt = counters put in every bag. */
let P=null;
function setPicture(it,mode){P={L:{...it.L,ob:0,oc:0,dealt:0},R:{...it.R,ob:0,oc:0,dealt:0},mode:mode||"none",tilt:0,lines:P&&P.keepLines?P.lines:[],showX:null,newLine:-1};draw();}
function noPicture(note){P=null;pic.innerHTML=note?`<p class="hint" style="padding:16px 8px">${esc(note)}</p>`:"";}
function draw(){if(!P)return;
 const side=s=>{const d=P[s];let bags="",ctrs="";
  for(let i=0;i<d.b;i++){const off=i>=d.b-d.ob,inside=P.showX!==null?P.showX:(d.dealt||null);
   bags+=`<div class="bag${off?" off":""}" aria-label="${off?"a bag taken off":"a bag"}">${inside!==null&&!off?`<span class="n">${inside}</span>`:"x"}</div>`;}
  const left=d.c-d.oc;for(let i=0;i<d.c;i++)ctrs+=`<div class="ctr${i>=left?" off":""}"></div>`;
  let live="";if(d.ob)live+=`<span class="live">${M} ${d.ob===1?"x":d.ob+"x"}</span>`;if(d.oc)live+=`<span class="live">${M} ${d.oc}</span>`;
  let ctl="";
  if(P.mode==="bags"&&d.b)ctl=`<div class="ctl"><button class="btn" data-s="${s}" data-a="ob+1" ${d.ob>=d.b?"disabled":""}>Take a bag off</button><span class="read">${d.ob}</span><button class="btn" data-s="${s}" data-a="ob-1" ${d.ob<=0?"disabled":""}>Put a bag back</button></div>`;
  if(P.mode==="counters"&&d.c)ctl=`<div class="ctl"><button class="btn" data-s="${s}" data-a="oc+1" ${d.oc>=d.c?"disabled":""}>Take a counter off</button><span class="read">${d.oc}</span><button class="btn" data-s="${s}" data-a="oc-1" ${d.oc<=0?"disabled":""}>Put a counter back</button></div>`;
  if(P.mode==="share"&&d.b){const o=P[other(s)];ctl=`<div class="ctl"><button class="btn" data-s="${s}" data-a="deal+1" ${o.c-o.oc<d.b?"disabled":""}>Put 1 counter in every bag</button><button class="btn" data-s="${s}" data-a="deal-1" ${d.dealt<=0?"disabled":""}>Take 1 counter out of every bag</button></div>`;}
  return `<div class="pan"><p class="side">${s==="L"?"Left side":"Right side"}</p><div class="items">${bags}</div><div class="ctrs">${ctrs}</div><div class="row" style="justify-content:center">${live}</div>${ctl}</div>`;};
 const a=P.tilt*6;
 pic.innerHTML=`<svg class="beam" viewBox="0 0 600 90" aria-hidden="true"><path d="M285 86 L300 44 L315 86 Z" fill="var(--muted)"/><g style="transform:rotate(${a}deg)"><rect x="40" y="36" width="520" height="8" rx="4" fill="var(--muted)"/><line x1="70" y1="44" x2="70" y2="70" stroke="var(--muted)" stroke-width="3"/><line x1="530" y1="44" x2="530" y2="70" stroke="var(--muted)" stroke-width="3"/></g><circle cx="300" cy="40" r="7" fill="var(--ink)"/></svg>
  <div class="pans">${side("L")}${side("R")}</div><div class="lines" id="lines">${P.lines.map((l,i)=>`<span class="${i===P.newLine?"new":""}">${esc(l)}</span>`).join("")}</div>`;
 pic.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.s,b.dataset.a));}
function act(s,a){const d=P[s];
 if(a==="ob+1"&&d.ob<d.b)d.ob++;if(a==="ob-1"&&d.ob>0)d.ob--;if(a==="oc+1"&&d.oc<d.c)d.oc++;if(a==="oc-1"&&d.oc>0)d.oc--;
 if(a==="deal+1"){const o=P[other(s)];if(o.c-o.oc>=d.b){d.dealt++;o.oc+=d.b;}}
 if(a==="deal-1"&&d.dealt>0){d.dealt--;P[other(s)].oc-=d.b;}
 draw();}
/* The balance shows whether it is level only when she says she has finished: it tips towards the side that holds more. */
async function showTilt(x){const l=total({b:P.L.b-P.L.ob,c:P.L.c-P.L.oc},x),r=total({b:P.R.b-P.R.ob,c:P.R.c-P.R.oc},x);P.tilt=Math.sign(r-l);draw();return l===r;}
function settle(){P.tilt=0;draw();}
function addLine(s){P.lines.push(s);P.newLine=P.lines.length-1;}
/* Apply what was taken off: the picture now shows the new equation. */
function commit(){for(const s of["L","R"]){const d=P[s];d.b-=d.ob;d.c-=d.oc;d.ob=0;d.oc=0;}draw();}
const cur=()=>({L:{b:P.L.b,c:P.L.c},R:{b:P.R.b,c:P.R.c}});

/* ===================== The text column ===================== */
function task(lines){text.innerHTML=`<div id="story">${lines.map(l=>`<p class="story">${esc(l)}</p>`).join("")}</div><p class="eq hide" id="eq"></p><p class="q hide" id="q"></p><p class="hint hide" id="hint"></p><p class="fb hide" id="fb"></p><div id="act"></div>`;}
function setEq(s){$("eq").textContent=s||"";$("eq").classList.toggle("hide",!s);}
function setQ(s){$("q").textContent=s||"";$("q").classList.toggle("hide",!s);}
function setHint(s){$("hint").textContent=s||"";$("hint").classList.toggle("hide",!s);}
function setFb(s,kind){const f=$("fb");f.textContent=s||"";f.className="fb"+(kind?" "+kind:"")+(s?"":" hide");}
function actArea(){const a=$("act");a.innerHTML="";return a;}
function button(label){return buttons([label]);}
function buttons(list){return new Promise(r=>{const a=actArea(),row=document.createElement("div");row.className="row";list.forEach((l,i)=>{const b=document.createElement("button");b.className="btn"+(i===0?" primary":"");b.textContent=l;b.dataset.choice=i;b.onclick=()=>{a.innerHTML="";r(i);};row.appendChild(b);});a.appendChild(row);});}
/* A typed whole number, with an optional extra button ("I don't know yet", "Show the balance"). Resolves to a number or {extra:i}. */
function ask(pre,extras){return new Promise(r=>{const a=actArea();
 a.innerHTML=`<div class="ans"><span>${esc(pre||"x =")}</span><input class="box" id="box" inputmode="none" autocomplete="off" aria-label="Your answer"></div>
  <div class="keys" style="margin-top:8px">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button data-k="⌫" aria-label="Delete">⌫</button><button class="go" data-k="ok">OK</button></div>
  ${extras&&extras.length?`<div class="row" style="margin-top:8px">${extras.map((e,i)=>`<button class="btn" data-x="${i}">${esc(e)}</button>`).join("")}</div>`:""}`;
 const box=$("box");box.focus();
 const done=()=>{if(box.value==="")return;a.innerHTML="";r(parseInt(box.value,10));};
 a.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==="ok")return done();if(k==="⌫")box.value=box.value.slice(0,-1);else if(box.value.length<3)box.value+=k;});
 a.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{a.innerHTML="";r({extra:+b.dataset.x});});
 box.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();done();}else if(e.key==="Backspace"){}else if(!/^[0-9]$/.test(e.key)&&e.key.length===1)e.preventDefault();};
 box.oninput=()=>{box.value=box.value.replace(/[^0-9]/g,"").slice(0,3);};});}

/* ===================== Her steps on the balance ===================== */
/* Each step: she works the controls; the check comes only when she taps the button. A wrong step gets a reply that describes what
   she did and goes back to the start of that step. After a second reply the right step is shown and the work goes on. Returns true
   when the step was right at the first tap of the button. */
const MOREB=()=>P.L.b>P.R.b?"L":"R";
async function stepBags(){const need=Math.min(P.L.b,P.R.b),from=MOREB();let first=true;P.mode="bags";draw();
 setQ("Take the same number of bags off both sides, so that bags remain on one side only.");setHint("Use the buttons under each side. Then tap the button below.");
 for(let tries=0;;tries++){await button("I have taken bags off both sides");const tl=P.L.ob,tr=P.R.ob;
  if(tl===need&&tr===need)break;
  first=false;
  if(tries>=1){P.mode="none";P.L.ob=need;P.R.ob=need;draw();setFb(`Take ${bagsW(need)} off each side. Then the left side and the right side still hold the same number of counters, and bags remain on the ${sideW(from)} side only.`,"info");await button("Next");break;}
  if(tl===tr&&tl>0){setFb(`You took ${bagsW(tl)} off each side, and the balance is still level. Bags remain on both sides. Take more bags off, the same number from each side.`,"info");continue;}
  if(tl===0&&tr===0){setFb("No bags have been taken off yet. Take the same number of bags off both sides.","info");continue;}
  P.mode="none";await showTilt(P.x);
  setFb(tl===0||tr===0?`You took ${bagsW(tl||tr)} off the ${tl?"left":"right"} side and none off the ${tl?"right":"left"} side. The balance tips, because the two sides no longer hold the same number of counters. The bags are back where they started.`
   :`You took ${bagsW(tl)} off the left side and ${bagsW(tr)} off the right side. The balance tips. Take the same number off both sides. The bags are back where they started.`,"info");
  await new Promise(r=>setTimeout(r,700));P.L.ob=0;P.R.ob=0;P.mode="bags";settle();}
 const before=cur(),t=need,tx=t===1?"x":t+"x";
 addLine(`${term(before.L.b,before.L.c)} ${M} ${tx} = ${term(before.R.b,before.R.c)} ${M} ${tx}`);commit();addLine(eqText(cur()));P.mode="none";settle();
 setFb(`You took ${bagsW(t)} off each side, and the balance is still level. ${eqText(cur())}`,"ok");setHint("");
 return first;}
async function stepCounters(){const bs=P.L.b?"L":"R",need=P[bs].c;let first=true;P.mode="counters";draw();
 setQ("Take the same number of counters off both sides, so that only bags remain on one side.");setHint("Use the buttons under each side. Then tap the button below.");
 for(let tries=0;;tries++){await button("I have taken counters off both sides");const tl=P.L.oc,tr=P.R.oc;
  if(tl===need&&tr===need)break;
  first=false;
  if(tries>=1){P.mode="none";P.L.oc=need;P.R.oc=need;draw();setFb(`Take ${ctrW(need)} off each side. Then only bags remain on the ${sideW(bs)} side, and the two sides still hold the same number of counters.`,"info");await button("Next");break;}
  if(tl===tr&&tl>0){setFb(`You took ${ctrW(tl)} off each side, and the balance is still level. Counters remain beside the bags on the ${sideW(bs)} side. Take more counters off, the same number from each side.`,"info");continue;}
  if(tl===0&&tr===0){setFb("No counters have been taken off yet. Take the same number of counters off both sides.","info");continue;}
  P.mode="none";await showTilt(P.x);
  setFb(tl===0||tr===0?`You took ${ctrW(tl||tr)} off the ${tl?"left":"right"} side and none off the ${tl?"right":"left"} side. The balance tips, because the two sides no longer hold the same number of counters. The counters are back where they started.`
   :`You took ${ctrW(tl)} off the left side and ${ctrW(tr)} off the right side. The balance tips. Take the same number off both sides. The counters are back where they started.`,"info");
  await new Promise(r=>setTimeout(r,700));P.L.oc=0;P.R.oc=0;P.mode="counters";settle();}
 const before=cur();addLine(`${term(before.L.b,before.L.c)} ${M} ${need} = ${term(before.R.b,before.R.c)} ${M} ${need}`);commit();addLine(eqText(cur()));P.mode="none";draw();
 setFb(`You took ${ctrW(need)} off each side, and the balance is still level. ${eqText(cur())}`,"ok");setHint("");
 return first;}
/* Sharing: she puts 1 counter in every bag, round by round, from the other side, until no counters remain there. Then she says x. */
async function stepShare(){const bs=P.L.b?"L":"R",os=other(bs),b=P[bs].b,q=P[os].c,x=q/b;let first=true;P.mode="share";draw();
 setQ(`Share the ${q} counters on the ${sideW(os)} side equally between the ${b} bags.`);setHint("Tap the button under the bags. Each tap puts 1 counter in every bag.");
 for(let tries=0;;tries++){await button("The counters are shared");const left=P[os].c-P[os].oc;
  if(left===0)break;first=false;
  if(tries>=1){P.mode="none";P[bs].dealt=x;P[os].oc=q;draw();setFb(`Each bag gets ${ctrW(x)}, and then no counters remain on the ${sideW(os)} side.`,"info");await button("Next");break;}
  setFb(`${ctrW(left)} remain on the ${sideW(os)} side. Put 1 counter in every bag until no counters remain on that side.`,"info");}
 P.mode="none";draw();setFb("");
 setQ("How many counters are in one bag?");setHint("");
 for(let tries=0;;tries++){const a=await ask("x =");if(a===x)break;first=false;
  if(tries>=1){setFb(`There are ${ctrW(x)} in each bag, so x = ${x}.`,"info");await button("Next");break;}
  setFb(a===b?`${b} is the number of bags. The question asks how many counters are in one bag.`:a===q?`${q} is the number of counters on the ${sideW(os)} side. The question asks how many counters are in one bag.`:"Look inside one bag. How many counters are there?","info");}
 addLine(bs==="L"?`${term(b,0)} ÷ ${b} = ${q} ÷ ${b}`:`${q} ÷ ${b} = ${term(b,0)} ÷ ${b}`);addLine(bs==="L"?`x = ${x}`:`${x} = x`);P.newLine=P.lines.length-1;draw();
 setFb(`Yes. Each bag holds ${ctrW(x)}, so x = ${x}.`,"ok");return first;}

/* ===================== The items ===================== */
function withPicture(it,lines){task(lines);P=null;setPicture(it);P.x=it.x;setEq(eqText(it));}
async function itemBags(it){withPicture(it,["Each bag holds the same number of counters. The balance is level."]);const f=await stepBags();log(it,f?"right first":"after a reply",f);await button("Next");return f;}
async function itemCounters(it){withPicture(it,["Each bag holds the same number of counters. The balance is level."]);const f=await stepCounters();log(it,f?"right first":"after a reply",f);await button("Next");return f;}
async function itemShare(it){withPicture(it,["Each bag holds the same number of counters. The balance is level."]);const f=await stepShare();log(it,f?"right first":"after a reply",f);await button("Next");return f;}
async function itemCheck(it){withPicture(it,["Each bag holds the same number of counters. The balance is level."]);
 P.showX=it.cand;draw();const same=total(it.L,it.cand)===total(it.R,it.cand);
 setQ(`Is x = ${it.cand} the answer? There are ${ctrW(it.cand)} in every bag now. Do both sides hold the same number of counters?`);
 const c=await buttons(["Yes, the same","No, not the same"]),right=(c===0)===same;
 const l=total(it.L,it.cand),r=total(it.R,it.cand),sums=`On the left side, ${it.L.b} × ${it.cand} + ${it.L.c} = ${l}. On the right side, ${it.R.b} × ${it.cand} + ${it.R.c} = ${r}.`;
 P.tilt=Math.sign(r-l);addLine(sums);draw();
 setFb(right?(same?`Yes. ${sums} Both sides hold ${ctrW(l)}, so x = ${it.cand} is the answer.`:`Yes. ${sums} The two sides are not the same, so x = ${it.cand} is not the answer.`)
  :(same?`${sums} Both sides hold ${ctrW(l)}, so the balance is level and x = ${it.cand} is the answer.`:`${sums} The two sides are not the same, so the balance tips and x = ${it.cand} is not the answer.`),right?"ok":"info");
 log(it,c===0?"same":"not the same",right);await button("Next");return right;}
/* The whole task on the balance, every step prompted in turn. */
async function itemWhole(it,keepRole){withPicture(it,["Each bag holds the same number of counters. We call that number x. The balance is level, so both sides hold the same number of counters.","Find x."]);
 const a=await stepBags();await button("Next step");setFb("");const b=await stepCounters();await button("Next step");setFb("");const c=await stepShare();
 const f=a&&b&&c;log(it,f?"all steps right first":"after a reply",f);await button("Next");return f;}
/* The whole task with no picture. She may ask for the balance (recorded as supplied). A wrong answer: say what her number does,
   then short checks of each part in turn (bags, counters, sharing); the first one not right is taught; then back to this task. */
async function itemLines(it,opts={}){
 task(opts.lead||["Solve the equation. You can write your lines on paper."]);noPicture("No picture this time. You can draw your own on paper.");setEq(eqText(it));
 setQ("What is x?");
 const extras=opts.noHelp?["I don't know yet"]:["Show me the balance","I don't know yet"];
 let a=await ask("x =",extras);
 if(typeof a==="object"&&!opts.noHelp&&a.extra===0){recordEvent("balance asked for",{eq:eqText(it)});
  task(["Here is the balance for this equation. Each bag holds the same number of counters."]);setEq(eqText(it));
  setPicture(it);P.x=it.x;const s1=await stepBags();await button("Next step");setFb("");const s2=await stepCounters();await button("Next step");setFb("");const s3=await stepShare();
  const f=s1&&s2&&s3;log(it,f?"all steps right first, with the balance":"after a reply, with the balance",f,{support:"balance"});await button("Next");return f;}
 if(a===it.x){log(it,a,true);setFb(`Yes. x = ${it.x}. On the left side, ${it.L.b} × ${it.x} + ${it.L.c} = ${total(it.L,it.x)}. On the right side, ${it.R.b} × ${it.x} + ${it.R.c} = ${total(it.R,it.x)}.`,"ok");await button("Next");return true;}
 const unsure=typeof a==="object";log(it,unsure?"I don't know yet":a,false);
 if(!unsure){const l=total(it.L,a),r=total(it.R,a);setFb(`If x = ${a}, the left side holds ${l} and the right side holds ${r}. The two sides are not the same, so ${a} is not the answer.`,"info");}
 else setFb("Let us look at the parts one at a time.","info");
 await button("Next");
 if(opts.noProbe)return false;
 return await probeChain(it);}
async function probeChain(it){
 const chain=["bags","counters","share"];let weak=null;
 decision("probe chain",`whole task ${eqText(it)} not right: short checks of each part in turn.`);
 for(const id of chain){const prev=role;role="component_check";curSet=id;const pi=makeItem(id,[]);const ok=await RUN[id](pi);role=prev;
  if(!ok){weak=id;break;}}
 if(weak){decision("teach part",`${weak} not right at the first tap: worked example and one fresh check.`);curSet=weak;await workedExample(weak);
  const prev=role;role="guided_practice";await RUN[weak](makeItem(weak,[]));role=prev;}
 curSet="lines";const prev=role;role="return_whole";
 task(["Here is the first equation again. This time the balance is here to help."]);
 setPicture(it);P.x=it.x;setEq(eqText(it));
 const a=await stepBags();await button("Next step");setFb("");const b=await stepCounters();await button("Next step");setFb("");const c=await stepShare();
 log(it,"return with the balance",a&&b&&c,{helped:true});role=prev;
 if(a&&b&&c){await button("Next");return false;}
 decision("saved stop","the return to the whole task needed replies after the checks: worked answer shown, place saved.");
 await button("Next");return "stop";}
const RUN={bags:itemBags,counters:itemCounters,share:itemShare,check:itemCheck,whole:itemWhole,lines:itemLines};

/* ===================== Worked examples ===================== */
/* Each one plays a step on the balance with its line beside it. She taps to see each part. */
async function playBags(){const t=Math.min(P.L.b,P.R.b);P.L.ob=t;P.R.ob=t;draw();await button("Next");const before=cur(),tx=t===1?"x":t+"x";
 addLine(`${term(before.L.b,before.L.c)} ${M} ${tx} = ${term(before.R.b,before.R.c)} ${M} ${tx}`);commit();addLine(eqText(cur()));draw();}
async function playCounters(){const bs=P.L.b?"L":"R",n=P[bs].c;P.L.oc=n;P.R.oc=n;draw();await button("Next");const before=cur();
 addLine(`${term(before.L.b,before.L.c)} ${M} ${n} = ${term(before.R.b,before.R.c)} ${M} ${n}`);commit();addLine(eqText(cur()));draw();}
async function playShare(){const bs=P.L.b?"L":"R",os=other(bs),b=P[bs].b,q=P[os].c,x=q/b;P[bs].dealt=x;P[os].oc=q;draw();await button("Next");
 addLine(bs==="L"?`${term(b,0)} ÷ ${b} = ${q} ÷ ${b}`:`${q} ÷ ${b} = ${term(b,0)} ÷ ${b}`);addLine(bs==="L"?`x = ${x}`:`${x} = x`);draw();}
const DEMO={
 bags:async it=>{task(["Here is one done for you.","Each bag holds the same number of counters. The balance is level."]);setPicture(it);setEq(eqText(it));
  const t=Math.min(it.L.b,it.R.b);setQ(`${bagsW(t)} are taken off each side. The two sides still hold the same number of counters, so the balance remains level.`);await playBags();
  setQ(`Now bags remain on the ${sideW(it.L.b>it.R.b?"L":"R")} side only.`);},
 counters:async it=>{task(["Here is one done for you.","Each bag holds the same number of counters. The balance is level."]);setPicture(it);setEq(eqText(it));
  const bs=it.L.b?"L":"R";setQ(`${ctrW(it[bs].c)} are taken off each side. The balance remains level.`);await playCounters();setQ(`Now only bags remain on the ${sideW(bs)} side.`);},
 share:async it=>{task(["Here is one done for you.","Each bag holds the same number of counters. The balance is level."]);setPicture(it);setEq(eqText(it));
  const bs=it.L.b?"L":"R",os=other(bs);setQ(`The ${it[os].c} counters on the ${sideW(os)} side are shared equally between the ${it[bs].b} bags.`);await playShare();
  setQ(`Each bag holds ${ctrW(it.x)}, so x = ${it.x}.`);},
 check:async it=>{task(["Here is one done for you.","Each bag holds the same number of counters. The balance is level."]);setPicture(it);setEq(eqText(it));
  P.showX=it.x;draw();setQ(`To check x = ${it.x}, put ${ctrW(it.x)} in every bag and count each side.`);await button("Next");
  addLine(`On the left side, ${it.L.b} × ${it.x} + ${it.L.c} = ${total(it.L,it.x)}. On the right side, ${it.R.b} × ${it.x} + ${it.R.c} = ${total(it.R,it.x)}.`);draw();
  setQ(`Both sides hold ${ctrW(total(it.L,it.x))}, so x = ${it.x} is the answer.`);},
 whole:async it=>{await wholeDemo(it);},
 lines:async it=>{task(["Here is one done for you, without the balance.","Each line does the same to both sides."]);noPicture();setEq(eqText(it));
  const t=Math.min(it.L.b,it.R.b),bs=it.L.b>it.R.b?"L":"R",os=other(bs),b=Math.abs(it.L.b-it.R.b),p=it[bs].c,q=it[os].c-p;
  const s1={L:{b:it.L.b-t,c:it.L.c},R:{b:it.R.b-t,c:it.R.c}},s2={L:{b:s1.L.b,c:s1.L.c-p},R:{b:s1.R.b,c:s1.R.c-p}};
  const L=[eqText(it),eqText(s1),eqText(s2),bs==="L"?`x = ${q} ÷ ${b} = ${it.x}`:`${q} ÷ ${b} = x, so x = ${it.x}`];
  const box=document.createElement("p");box.className="lines";$("story").after(box);
  for(const l of L){box.insertAdjacentHTML("beforeend",`<span>${esc(l)}</span>`);await button("Next");}
  setQ(`x = ${it.x}.`);}};
async function wholeDemo(it){
 task(["Here is one solved for you.","Each bag holds the same number of counters. We call that number x.","The balance is level, so both sides hold the same number of counters."]);
 setPicture(it);setEq(eqText(it));
 setQ("First, the same number of bags is taken off both sides.");await playBags();
 setQ("Next, the same number of counters is taken off both sides.");await playCounters();
 setQ("Last, the counters are shared equally between the bags.");await playShare();
 setQ(`Each bag holds ${ctrW(it.x)}, so x = ${it.x}.`);}
async function workedExample(id){role="explanation";const it=makeItem(id,[]);recordEvent("worked example shown",{set:id});await DEMO[id](it);await button("I will try one");}

/* ===================== Practice, the gap, the session ===================== */
async function practise(id){curSet=id;const p=prOf(id),conds=SETS[id].conds;let shown=false,miss=0;
 while(!p.passed){const day=todayKey(),done=S.today[id]&&S.today[id].day===day?S.today[id].n:0;
  if(done>=CAP){decision("practice cap",`${id}: ${CAP} items today; it comes back first next time.`);return endToday();}
  let guided=false;
  if(!shown&&(p.res.length===0||p.stopped)){await workedExample(id);shown=guided=true;delete p.stopped;saveAll();}
  role=guided?"guided_practice":"practice";const it=makeItem(id,p.res);let right=await RUN[id](it);
  if(right==="stop"){p.stopped=true;saveAll();sendState(id,"saved stop");return "stop";}
  p.res.push(guided?{first:false,supported:right,conds:it.conds}:{first:right,conds:it.conds});S.today[id]={day,n:done+1};miss=right?0:miss+1;
  p.passed=passedNow(p.res,conds);if(p.passed){p.day=day;p.stage="contrast";recordEvent("set holds",{set:id});}saveAll();sendState(id,p.passed?"holds":"working on it");
  if(!p.passed&&miss>=2){p.stopped=true;saveAll();sendState(id,"stopped for today");decision("practice stop",`${id}: two items in a row not right; worked example again next session.`);return endToday();}
 }}
async function endToday(){task(["We stop this practice here for today. Your place is kept. Next time it starts again with new questions."]);noPicture();await button("Finish for now");return "later";}
/* After a gap: one item of every set already passed, before anything new. One that is not right goes back to practice. */
async function retrieval(){const passed=PRACTICE_ORDER.filter(id=>prOf(id).passed);if(!passed.length)return;
 decision("retrieval","new day: one item of each set already passed.");
 for(const id of passed){curSet=id;role="retrieval";const ok=await RUN[id](makeItem(id,[]));
  if(ok===true){prOf(id).stage="retained";sendState(id,"held after a gap");}else{sendState(id,"back to practice after a gap");if(SETS[id].ki)K[id]={ki:SETS[id].ki,res:[],passed:false};else S.pr[id]={res:[],passed:false};const ti=TASKS_IDS.indexOf(id);if(ti>=0&&ti<S.task)S.task=ti;decision("retrieval not right",`${id} goes back to practice.`);}
  saveAll();}}
async function intro(){curSet="intro";role="explanation";const it={L:{b:2,c:9},R:{b:5,c:3},x:2,kind:"whole"};await wholeDemo(it);
 await button("Next");task(["To check, put 2 counters in every bag."]);setPicture(it);P.showX=2;setEq(eqText(it));
 addLine("On the left side, 2 × 2 + 9 = 13. On the right side, 5 × 2 + 3 = 13.");draw();setQ("Both sides hold 13 counters, so x = 2 is the answer.");await button("I will try the parts");}
async function later(){curSet="later";role="delayed";
 const it=genWhole(Math.random()<.5?"left":"right");it.kind="lines";
 const ok=await itemLines(it,{lead:["Here is an equation like the ones from last time. Solve it. You can write your lines on paper."],noHelp:true,noProbe:true});
 recordEvent("delayed whole task",{right:ok});
 curSet="paper";role="paper";const pp=genWhole(Math.random()<.5?"left":"right");pp.kind="lines";
 task(["Now solve one on paper. Write every line, the way the lines appeared beside the balance.","When you have finished, type your answer."]);noPicture("Use your paper for this one.");setEq(eqText(pp));setQ("What is x?");
 const a=await ask("x =",["I don't know yet"]);const right=a===pp.x;log(pp,typeof a==="object"?"I don't know yet":a,right,{paper:"written on paper; the paper itself is not seen by the app"});
 setFb(right?`Yes. x = ${pp.x}.`:`x = ${pp.x}. If you like, check your lines on paper: put ${ctrW(pp.x)} in every bag and count each side.`,right?"ok":"info");await button("Next");}
const TASKS_IDS=["intro",...PRACTICE_ORDER,"delay","later"];
const TASKS=TASKS_IDS.map(id=>id==="intro"?intro:id==="later"?later:id==="delay"?null:()=>practise(id));
const DELAY_INDEX=TASKS_IDS.indexOf("delay");
async function run(){if(HAS_SHEET)SheetLog.setSession(JOURNEY.prefix+"-"+Date.now().toString(36));recordEvent("session start",{task:S.task,version:JOURNEY.version});
 const day=todayKey(),newDay=S.lastDay&&S.lastDay!==day;S.lastDay=day;store.set(S);
 if(newDay&&S.task>0&&S.task!==DELAY_INDEX)await retrieval();
 while(S.task<TASKS.length){
  if(S.task===DELAY_INDEX){if(!S.reviewDue){S.reviewDue=Date.now()+DELAY_DAYS*86400000;store.set(S);}
   if(Date.now()<S.reviewDue){task([`That is the end for today. The next part is ready in ${DELAY_DAYS} days.`]);noPicture();(HAS_SHEET&&setTimeout(()=>SheetLog.flush(),50)),recordEvent("session end",{reason:"gap before the later check",due:new Date(S.reviewDue).toISOString()});return;}
   S.task++;store.set(S);await retrieval();continue;}
  const r=await TASKS[S.task]();
  if(r==="stop"||r==="later"){(HAS_SHEET&&setTimeout(()=>SheetLog.flush(),50)),recordEvent("session end",{reason:r==="stop"?"saved stop":"continues next time"});
   if(r==="stop"){task(["We stop here for today. Your place is kept. Next time there are new examples."]);noPicture();await button("Finish for now");}
   task(["Your place is kept. Next time there are new examples."]);noPicture();return;}
  S.task++;store.set(S);}
 task(["That is the end of this part. Your work is kept."]);noPicture();(HAS_SHEET&&setTimeout(()=>SheetLog.flush(),50)),recordEvent("session end",{reason:"journey complete"});}

/* ===================== Header buttons and the teacher strip (only with ?teacher=1) ===================== */
$("pauseBtn").onclick=()=>{recordEvent("pause",{});if("speechSynthesis" in window)speechSynthesis.cancel();$("overlay").classList.remove("hide");};
$("goOn").onclick=()=>{recordEvent("resume",{});$("overlay").classList.add("hide");};
if(!("speechSynthesis" in window))$("readBtn").classList.add("hide");
$("readBtn").onclick=()=>{if(!("speechSynthesis" in window))return;recordEvent("read aloud",{});speechSynthesis.cancel();
 const parts=[...text.querySelectorAll("#story p, .lines span, #eq, #q, #hint, #fb, #act .row button")].filter(e=>!e.classList.contains("hide")&&e.textContent).map(e=>e.textContent.replace(/−/g," minus ").replace(/÷/g," divided by ").replace(/×/g," times "));
 speechSynthesis.speak(new SpeechSynthesisUtterance(parts.join(". ")));};
if(new URLSearchParams(location.search).get("teacher")==="1"){const t=$("teacher");t.classList.remove("hide");
 const refresh=()=>{const sets=PRACTICE_ORDER.map(id=>{const p=prOf(id);return `${id} (${SETS[id].ki||SETS[id].skill}): ${p.passed?"holds, stage "+(p.stage||""):p.stopped?"stopped for today":p.res.length+" items"}`;}).join(" · ");
  t.innerHTML=`<b>For the teacher.</b> Step ${S.task+1} of ${TASKS.length} (${TASKS_IDS[S.task]||"done"}). ${esc(sets)}. ${S.events.length} records${HAS_SHEET?", "+SheetLog.pending()+" still to send to the Sheet":", not connected to the Sheet"}. <button class="btn small" id="dl">Download the records (CSV)</button> <button class="btn small" id="restart">Start again (clears this journey)</button>`;
  $("dl").onclick=()=>{const cols=["t","event","set","role","eq","x","answer","right","own","support","checks","detail"];
   const rows=S.events.map(e=>[e.t,e.event,e.set||"",e.role||"",e.item?e.item.eq:"",e.item?e.item.x:"",e.answer||"",e.right===undefined?"":e.right?1:0,e.own===undefined?"":e.own?1:0,e.support||"",(e.checks||[]).join(" "),e.reason||e.action||""]);
   const csv=[cols,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
   const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`student2-balance-${todayKey()}.csv`;a.click();};
  $("restart").onclick=()=>{if(confirm("Clear this journey's saved place and records on this device?")){localStorage.removeItem(JOURNEY.key);location.reload();}};};
 refresh();setInterval(refresh,3000);}
run();
