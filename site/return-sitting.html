/* --- quadrilaterals-1: tap points in turn; tapping the first point closes the shape --- */
const Q1=(()=>{const L="ABCDEFG";
  const orient=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);
  function crosses(a,b,c,d){const s=Math.sign;return s(orient(a,b,c))*s(orient(a,b,d))<0&&s(orient(c,d,a))*s(orient(c,d,b))<0;}
  function onLine(p,q,r){const d=Math.hypot(r[0]-p[0],r[1]-p[1]);return Math.abs(orient(p,q,r))/d<6;}
  function build(ctx,P){let path=[],closed=false;
    const svg=ctx.svg("0 0 420 380","Points to join into a shape. The letters follow the order of your taps.");
    const nm=i=>L[path.indexOf(i)];
    const segs=()=>{const s=[];for(let i=1;i<path.length;i++)s.push([path[i-1],path[i]]);if(closed)s.push([path[path.length-1],path[0]]);return s;};
    function crossing(){const s=segs();for(let i=0;i<s.length;i++)for(let j=i+2;j<s.length;j++){if(i===0&&j===s.length-1)continue;
      if(crosses(P[s[i][0]],P[s[i][1]],P[s[j][0]],P[s[j][1]]))return [s[i],s[j]];}return null;}
    function straightCorners(){const n=path.length,out=[];for(let k=0;k<n;k++){const a=P[path[(k+n-1)%n]],b=P[path[k]],c=P[path[(k+1)%n]];if(onLine(a,b,c))out.push(k);}return out;}
    function draw(){svg.innerHTML="";const cx=P.reduce((a,p)=>a+p[0],0)/P.length,cy=P.reduce((a,p)=>a+p[1],0)/P.length,bad=closed?crossing():null;
      for(const [a,b] of segs()){const isX=bad&&bad.some(s=>s[0]===a&&s[1]===b);
        svg.appendChild(ctx.el("line",{class:"side"+(isX?" cross":""),x1:P[a][0],y1:P[a][1],x2:P[b][0],y2:P[b][1]}));
        const f=isX?0.3:0.5,mx=P[a][0]+(P[b][0]-P[a][0])*f,my=P[a][1]+(P[b][1]-P[a][1])*f;let dx=mx-cx,dy=my-cy;if(isX){dx=-(P[b][1]-P[a][1]);dy=P[b][0]-P[a][0];}const d=Math.hypot(dx,dy)||1;
        const t=ctx.el("text",{class:"slbl",x:mx+dx/d*22,y:my+dy/d*22+6,"text-anchor":"middle"});t.textContent=nm(a)+nm(b);svg.appendChild(t);}
      P.forEach((p,i)=>{const used=path.includes(i);const g=ctx.el("g",{class:"pt"+(used?" used":""),tabindex:0,role:"button","aria-label":used?"Point "+nm(i):"A point","data-i":i});
        g.appendChild(ctx.el("circle",{class:"hit",cx:p[0],cy:p[1],r:30}));g.appendChild(ctx.el("circle",{class:"pdot",cx:p[0],cy:p[1],r:11}));
        if(used){const dx=p[0]-cx,dy=p[1]-cy,d=Math.hypot(dx,dy)||1;const t=ctx.el("text",{class:"lbl",x:p[0]+dx/d*30,y:p[1]+dy/d*30+8,"text-anchor":"middle"});t.textContent=nm(i);svg.appendChild(t);}
        g.addEventListener("click",()=>tap(i));g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tap(i);}});
        svg.appendChild(g);});}
    function tap(i){if(closed||!ctx.open)return;
      if(path.length===0)path.push(i);else if(i===path[0]&&path.length>=3)closed=true;else if(!path.includes(i))path.push(i);
      ctx.clearNote();draw();}
    function again(){if(!ctx.open)return;path=[];closed=false;ctx.clearNote();draw();}
    /* what she made, in words (the page's judge, with the rule sentences taken out: the answer sentence follows it) */
    function judge(){const n=segs().length,first=L[0],last=L[path.length-1];
      if(path.length<2)return {none:true,text:"You have not drawn a side yet. Tap a point to start."};
      const answer=path.map(i=>nm(i)).join("")+(closed?" closed":" open");
      if(!closed)return {right:false,answer,tag:"not closed",text:`Your shape is not closed. Its last side ends at ${last}, and the shape started at ${first}.`};
      const x=crossing();if(x){const [s,t]=x;return {right:false,answer,tag:"sides cross",text:`Your shape has ${n} sides, but side ${nm(s[0])}${nm(s[1])} crosses side ${nm(t[0])}${nm(t[1])}.`};}
      const flat=straightCorners(),corners=path.length-flat.length;
      const lineText=flat.map(k=>{const m=path.length,a=nm(path[(k+m-1)%m]),b=nm(path[k]),c=nm(path[(k+1)%m]);return `${b} lies on the straight line from ${a} to ${c}, so ${a}${b} and ${b}${c} make one straight side, ${a}${c}.`;}).join(" ");
      if(corners!==4)return flat.length
        ?{right:false,answer,tag:"three points on a line",text:`${lineText} Your shape has only ${corners} corners and ${corners} straight sides.`}
        :{right:false,answer,tag:n+" sides",text:`Your shape is closed, and it has ${n} straight sides.`};
      const nmPath=path.map(i=>nm(i)).join("");
      if(flat.length)return {right:true,answer,tag:"quadrilateral with a point on a side",text:`${lineText} Your shape is closed, and it has 4 straight sides and 4 corners. It is a quadrilateral.`};
      return {right:true,answer,tag:"quadrilateral",text:`Your shape ${nmPath} is closed, and it has 4 straight sides that meet only at its corners. It is a quadrilateral.`};}
    draw();
    const b=document.createElement("button");b.type="button";b.className="btn";b.textContent="Start again";b.addEventListener("click",again);ctx.picBelow(b);
    return {tap,again,judge};}
  return {build};})();

/* --- quadrilaterals-2: a shape, Yes or No --- */
const Q2=(()=>{const NS="http://www.w3.org/2000/svg";
  const orient=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);
  function crosses(a,b,c,d){const s=Math.sign;return s(orient(a,b,c))*s(orient(a,b,d))<0&&s(orient(c,d,a))*s(orient(c,d,b))<0;}
  function segCross(P,n,open){const m=open?n-1:n;for(let i=0;i<m;i++)for(let j=i+2;j<m;j++){if(!open&&i===0&&j===m-1)continue;
    if(crosses(P[i],P[(i+1)%n],P[j],P[(j+1)%n]))return [i,j];}return null;}
  const area=P=>P.reduce((t,p,i)=>{const q=P[(i+1)%P.length];return t+p[0]*q[1]-q[0]*p[1];},0)/2;
  const list=a=>a.length<3?a.join(" and "):a.slice(0,-1).join(", ")+" and "+a[a.length-1];
  function shapeFrom(base,o){const a=(o.rot||0)*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a),n=base.length;
    let P=base.map(([x,y])=>[x*ca-y*sa,x*sa+y*ca]);
    const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
    const sc=Math.min(310/(x1-x0),270/(y1-y0),1.25),tr=p=>[Math.round(210+(p[0]-(x0+x1)/2)*sc),Math.round(190+(p[1]-(y0+y1)/2)*sc)];
    const s={n,pts:P.map(tr),curve:-1,open:!!o.open,yes:!!o.yes,letters:o.letters};
    s.cross=segCross(s.pts,n,s.open);s.inward=-1;
    if(!s.open&&!s.cross){const A=area(s.pts);for(let k=0;k<n;k++){const a1=s.pts[(k+n-1)%n],b1=s.pts[k],c1=s.pts[(k+1)%n],cr=(b1[0]-a1[0])*(c1[1]-b1[1])-(b1[1]-a1[1])*(c1[0]-b1[0]);if(Math.sign(cr)!==Math.sign(A)&&Math.abs(cr)>400){s.inward=k;break;}}}
    return s;}
  const sideName=(s,i)=>s.letters[i]+s.letters[(i+1)%s.n];
  function labelAt(s,k){const P=s.pts,n=s.n,v=P[k],cx=P.reduce((t,p)=>t+p[0],0)/n,cy=P.reduce((t,p)=>t+p[1],0)/n;let dx=v[0]-cx,dy=v[1]-cy;
    if(!s.open&&!s.cross){const a=P[(k+n-1)%n],c=P[(k+1)%n],u=[v[0]-a[0],v[1]-a[1]],w=[v[0]-c[0],v[1]-c[1]],lu=Math.hypot(...u),lw=Math.hypot(...w);
      let bx=u[0]/lu+w[0]/lw,by=u[1]/lu+w[1]/lw;if(Math.hypot(bx,by)>.2){const cr=(v[0]-a[0])*(c[1]-v[1])-(v[1]-a[1])*(c[0]-v[0]);if(Math.sign(cr)!==Math.sign(area(P))){bx=-bx;by=-by;}dx=bx;dy=by;}}
    const d=Math.hypot(dx,dy)||1;return [v[0]+dx/d*30,v[1]+dy/d*30+8];}
  function draw(svg,s,marks){svg.innerHTML="";const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
    const n=s.n,m=s.open?n-1:n,P=s.pts;let num=0;
    for(let i=0;i<m;i++){const a=P[i],b=P[(i+1)%n];svg.appendChild(el("line",{class:"side",x1:a[0],y1:a[1],x2:b[0],y2:b[1]}));
      if(marks&&!s.cross){num++;const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;svg.appendChild(el("circle",{class:"numbg",cx:mx,cy:my,r:14}));
        const t=el("text",{class:"num",x:mx,y:my+6,"text-anchor":"middle"});t.textContent=num;svg.appendChild(t);}}
    if(marks&&s.open)for(const E of [P[n-1],P[0]])svg.appendChild(el("circle",{class:"gap",cx:E[0],cy:E[1],r:14}));
    P.forEach((p,k)=>{svg.appendChild(el("circle",{class:"dot",cx:p[0],cy:p[1],r:6}));const [lx,ly]=labelAt(s,k);
      const t=el("text",{class:"lbl",x:Math.round(lx),y:Math.round(ly),"text-anchor":"middle"});t.textContent=s.letters[k];svg.appendChild(t);});}
  /* the answer, in the page's approved words, without its opening "Yes" or "Your answer was" */
  function answerText(s){const L=s.letters,N=L.slice(0,s.n),m=s.open?s.n-1:s.n,straight=[];for(let i=0;i<m;i++)straight.push(sideName(s,i));

  return {shapeFrom,draw,answerText};})();

/* --- quadrilaterals-3: tap one vertex, then another; the line and its name appear in tap order --- */
const Q3=(()=>{const same=(a,b)=>(a[0]===b[0]&&a[1]===b[1])||(a[0]===b[1]&&a[1]===b[0]);
  function makeShape(V,dart,fix){const set=fix.set,s=fix.s,d=fix.d,lt=[];
    for(let j=0;j<4;j++)lt[((s+d*j)%4+4)%4]=set[j];
    const S={V,lt,name:set,dart:!!dart,out:dart?[0,2]:null,diags:[[0,2],[1,3]]};
    S.nm=(i,j)=>lt[i]+lt[j];S.adj=(i,j)=>{const x=(i-j+4)%4;return x===1||x===3;};
    const c=[0,1].map(k=>V.reduce((t,p)=>t+p[k],0)/4);
    S.lab=V.map((p,i)=>{let dx=p[0]-c[0],dy=p[1]-c[1];if(dart&&i===3){const a=V[0],b=V[2];dx=(a[0]+b[0])/2-p[0];dy=(a[1]+b[1])/2-p[1];}
      const n=Math.hypot(dx,dy)||1;return [Math.max(16,Math.min(404,p[0]+dx/n*30)),Math.max(24,Math.min(366,p[1]+dy/n*30+8))];});
    return S;}
  function build(ctx,S,o){o=o||{};let kept=[],sel=null,line=null,tried=[];
    const svg=ctx.svg("0 0 420 380","Quadrilateral "+S.name+". Tap one vertex, then another vertex, to draw a line.");
    function seg(a,b,cls){const P=S.V[a],Q=S.V[b];svg.appendChild(ctx.el("line",{class:cls,x1:P[0],y1:P[1],x2:Q[0],y2:Q[1]}));
      const mx=P[0]+(Q[0]-P[0])*.3,my=P[1]+(Q[1]-P[1])*.3,dx=Q[0]-P[0],dy=Q[1]-P[1],d=Math.hypot(dx,dy)||1;
      const t=ctx.el("text",{class:"nm",x:Math.max(20,Math.min(400,mx-dy/d*20)),y:Math.max(20,Math.min(370,my+dx/d*20+6)),"text-anchor":"middle"});t.textContent=S.nm(a,b);svg.appendChild(t);}
    function draw(){svg.innerHTML="";
      svg.appendChild(ctx.el("polygon",{class:"side",points:S.V.map(p=>p.join(",")).join(" ")}));
      kept.forEach(k=>seg(k[0],k[1],"kept"));tried.forEach(k=>seg(k[0],k[1],"kept"));
      if(line)seg(line[0],line[1],"mine");
      S.V.forEach((p,i)=>{const g=ctx.el("g",{class:"pt"+(sel===i?" sel":""),tabindex:0,role:"button","aria-label":"Vertex "+S.lt[i],"data-i":i});
        g.appendChild(ctx.el("circle",{class:"hit",cx:p[0],cy:p[1],r:30}));g.appendChild(ctx.el("circle",{class:"pdot",cx:p[0],cy:p[1],r:11}));
        g.addEventListener("click",()=>tap(i));g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tap(i);}});
        svg.appendChild(g);
        const t=ctx.el("text",{class:"lbl",x:S.lab[i][0],y:S.lab[i][1],"text-anchor":"middle"});t.textContent=S.lt[i];svg.appendChild(t);});}
    function tap(i){if(!ctx.open)return;ctx.clearNote();
      if(o.explore){if(sel===null)sel=i;else if(sel===i)sel=null;else{if(!tried.some(m=>same(m,[sel,i])))tried.push([sel,i]);sel=null;}draw();return;}
      if(line){line=null;sel=null;}
      if(sel===null)sel=i;else if(sel===i)sel=null;else{line=[sel,i];sel=null;}
      draw();}
    function again(){if(!ctx.open)return;line=null;sel=null;tried=[];ctx.clearNote();draw();}
    function reveal(list){list.forEach(p=>{if(!kept.some(k=>same(k,p)))kept.push(p.slice());});tried=[];if(line&&kept.some(k=>same(k,line)))line=null;draw();}
    draw();
    const b=document.createElement("button");b.type="button";b.className="btn";b.textContent=o.explore?"Clear my lines":"Start this line again";b.addEventListener("click",again);ctx.picBelow(b);
    return {tap,again,reveal,get line(){return line},get tried(){return tried}};}
  return {makeShape,build,same};})();

/* --- quadrilaterals-7: a quadrilateral drawn with exactly its angles, each written as an expression in x --- */
const Q7=(()=>{const L="ABCD";
  const ex=(c,e)=>(c===1?"x":c+"x")+(e>0?" + "+e+"°":e<0?" − "+(-e)+"°":"");
  function layout(ctx,ang){
    for(let t=0;t<400;t++){
      const th=ctx.rng()*Math.PI*2,d=[th];for(let i=1;i<4;i++)d.push(d[i-1]+(180-ang[i])*Math.PI/180);
      const u=d.map(a=>[Math.cos(a),Math.sin(a)]),s0=1,s1=.3+ctx.rng()*1.9;
      const rx=-(s0*u[0][0]+s1*u[1][0]),ry=-(s0*u[0][1]+s1*u[1][1]),det=u[2][0]*u[3][1]-u[3][0]*u[2][1];
      if(Math.abs(det)<.15)continue;
      const s2=(rx*u[3][1]-u[3][0]*ry)/det,s3=(u[2][0]*ry-rx*u[2][1])/det;
      if(s2<.35||s3<.35||s2>3||s3>3)continue;
      const s=[s0,s1,s2,s3],P=[[0,0]];for(let i=0;i<3;i++)P.push([P[i][0]+s[i]*u[i][0],P[i][1]+s[i]*u[i][1]]);
      const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
      const sc=Math.min(200/(x1-x0),200/(y1-y0));
      return P.map(p=>[Math.round(210+(p[0]-(x0+x1)/2)*sc),Math.round(190+(p[1]-(y0+y1)/2)*sc)]);}
    return null;}
  const orient=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);
  function picture(ctx,it){const P=it.P,n=4;
    const svg=ctx.svg("0 0 420 380","A quadrilateral ABCD. The angle at each corner is written beside it.");
    const area=P.reduce((t,p,m)=>{const q=P[(m+1)%n];return t+p[0]*q[1]-q[0]*p[1];},0);
    for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n];svg.appendChild(ctx.el("line",{class:"side",x1:a[0],y1:a[1],x2:b[0],y2:b[1]}));}
    P.forEach((p,i)=>{const q=P[(i+1)%n],r=P[(i+3)%n];
      const u=[q[0]-p[0],q[1]-p[1]],w=[r[0]-p[0],r[1]-p[1]],nu=Math.hypot(...u),nw=Math.hypot(...w),R=24;
      const s=[p[0]+u[0]/nu*R,p[1]+u[1]/nu*R],e=[p[0]+w[0]/nw*R,p[1]+w[1]/nw*R];let sweep=(u[0]*w[1]-u[1]*w[0])>0?1:0,large=0;
      const reflex=Math.sign(orient(r,p,q))!==Math.sign(area);if(reflex){large=1;sweep=1-sweep;}
      svg.appendChild(ctx.el("path",{class:"arc",d:`M${s[0]} ${s[1]} A${R} ${R} 0 ${large} ${sweep} ${e[0]} ${e[1]}`}));
      let dx=u[0]/nu+w[0]/nw,dy=u[1]/nu+w[1]/nw;if(Math.hypot(dx,dy)<.08){dx=-u[1];dy=u[0];}
      const dd=Math.hypot(dx,dy),sg=reflex?1:-1;dx=sg*dx/dd;dy=sg*dy/dd;
      const txt="∠"+L[i]+" = "+ex(it.c[i],it.e[i]),wd=txt.length*9.3+10;
      const off=16+Math.abs(dx)*wd/2+Math.abs(dy)*10,cx=Math.min(414-wd/2,Math.max(wd/2+6,p[0]+dx*off)),cy=Math.min(368,Math.max(22,p[1]+dy*off+6));
      const t=ctx.el("text",{class:"ang","text-anchor":"middle",x:cx,y:cy});t.textContent=txt;svg.appendChild(t);
      svg.appendChild(ctx.el("circle",{class:"dot",cx:p[0],cy:p[1],r:6}));});}
  return {layout,picture};})();

/* ===================== one runner per kind of item ===================== */
const YES="Yes, it is a quadrilateral",NO="No, it is not a quadrilateral";
const press=()=>document.querySelector("#acts .decide").click();
const RUN={
 make(ctx,it){const B=Q1.build(ctx,it.points);
   ctx.ask(`Make a quadrilateral from 4 of these ${it.points.length} points. Tap the points in turn, and tap the first point again to close the shape.`);
   ctx.button("My shape is finished",()=>{const j=B.judge();if(j.none)return ctx.note(j.text);
     ctx.done({right:j.right,answer:j.answer,tag:j.tag,eq:"make a quadrilateral",reply:j.text+" "+it.answer});});
   const run=(o,c)=>()=>{B.again();o.forEach(i=>B.tap(i));if(c)B.tap(o[0]);press();};
   ctx.auto({right:run(it.auto.good,true),wrongs:it.auto.wrongs.map(w=>({expect:w.expect,fn:run(w.order,w.close)}))});},
 decide(ctx,it){const s=Q2.shapeFrom(it.shape.base,it.shape);
   const svg=ctx.svg("0 0 420 380","A shape with lettered corners.");Q2.draw(svg,s,false);
   ctx.ask("Is this shape a quadrilateral?");
   const answer=sayYes=>{if(!ctx.open)return;Q2.draw(svg,s,true);const right=sayYes===s.yes;
     ctx.done({right,answer:sayYes?"yes":"no",eq:"is it a quadrilateral",tag:(it.shape.open?"open":"corner points in")+", said "+(sayYes?"yes":"no"),
       reply:`Your answer was ${sayYes?"yes":"no"}${right?". That is right.":". That is not right."} `+Q2.answerText(s)});};
   const w=ctx.choices([{t:YES,fn:()=>answer(true)},{t:NO,fn:()=>answer(false)}]);
   const click=yes=>()=>w.children[yes?0:1].click();
   ctx.auto({right:click(s.yes),wrongs:[{expect:"not right",fn:click(!s.yes)}]});},
 dart(ctx,it){const S=Q3.makeShape(it.V,true,it.fix),B=Q3.build(ctx,S);
   ctx.ask(`Draw the diagonal of ${S.name} that lies outside the shape. Tap one vertex, then tap another vertex.`);
   ctx.button("My line is finished",()=>{const ln=B.line;
     if(!ln)return ctx.note("You have not drawn a line yet. Tap one vertex, then tap another vertex.");
     const [a,b]=ln,ab=S.nm(a,b),la=S.lt[a],lb=S.lt[b];let right=false,tag,lead;
     if(S.adj(a,b)){tag="a side";lead=`You drew ${ab}. ${la} and ${lb} are next to each other, so ${ab} is a side of ${S.name}, not a diagonal.`;}
     else if(!Q3.same(S.out,ln)){tag="diagonal inside the shape";lead=`You drew ${ab}. ${la} and ${lb} are not next to each other, so ${ab} is a diagonal of ${S.name}, but it lies inside the shape.`;}
     else{right=true;tag="diagonal outside the shape";lead=`You drew ${ab}. That is right.`;}
     B.reveal(S.diags);
     ctx.done({right,answer:ab,eq:"a diagonal joins 2 vertices that are not next to each other",tag,reply:lead+" "+it.answer});});
   const draws=p=>()=>{B.again();B.tap(p[0]);B.tap(p[1]);press();};
   ctx.auto({right:draws([2,0]),wrongs:[{expect:"inside the shape",fn:draws([1,3])},{expect:"is a side",fn:draws([1,2])}]});},
 howmany(ctx,it){const S=Q3.makeShape(it.V,false,it.fix),B=Q3.build(ctx,S,{explore:true});
   ctx.say("You can tap two vertices to try a line. Then choose your answer.");
   ctx.ask(`How many diagonals does ${S.name} have?`);
   const lead={1:"You chose 1 diagonal. That is not right.",2:"You chose 2 diagonals. That is right.",
     4:`You chose 4 diagonals. That is not right. ${S.nm(0,2)} and ${S.nm(2,0)} are the same line segment, and ${S.nm(1,3)} and ${S.nm(3,1)} are the same line segment.`};
   const w=ctx.choices([1,2,4].map(n=>({t:n+(n===1?" diagonal":" diagonals"),fn(){cur.tried=B.tried.length;B.reveal(S.diags);
     ctx.done({right:n===2,answer:String(n),eq:"a quadrilateral has 2 diagonals",tag:n+" diagonals",reply:lead[n]+" "+it.answer});}})));
   const pick=c=>()=>w.children[c].click();
   ctx.auto({right:pick(1),wrongs:[{expect:"You chose 1 diagonal",fn:pick(0)},{expect:"same line segment",fn:pick(2)}]});},
 check(ctx,it){const ang=it.c.map((c,i)=>c*55+it.e[i]);const P=Q7.layout(ctx,ang);Q7.picture(ctx,{P,c:it.c,e:it.e});
   ctx.say("The 4 angles of this quadrilateral are written at its corners.");
   ctx.say("Here is a worked answer. It says x = 55°.");
   ctx.say(it.shown.map((v,i)=>"∠"+"ABCD"[i]+" = "+v+"°").join(", ")+".");
   ctx.ask("Do the 4 angles in this worked answer add up to 360°?");
   const go=yes=>()=>{if(!ctx.open)return;const right=!yes;
     ctx.done({right,answer:yes?"yes":"no",eq:"110 + 85 + 110 + 65 = 370",tag:yes?"missed the slip":"found the slip",
       reply:`Your answer was ${yes?"yes":"no"}${right?". That is right.":". That is not right."} `+it.answer});};
   const w=ctx.choices([{t:"Yes, they add up to 360°",fn:go(true)},{t:"No, they do not add up to 360°",fn:go(false)}]);
   ctx.auto({right:()=>w.children[1].click(),wrongs:[{expect:"not right",fn:()=>w.children[0].click()}]});},
 number(ctx,it){(it.lines||[]).forEach(t=>ctx.say(t));ctx.ask(it.ask);
   const u=it.unit;
   const inp=ctx.numberBox(u?"Your answer in degrees":"Your answer",(v,raw)=>{
     if(v===null)return ctx.note(u?"Write a whole number of degrees, like 75.":"Write a whole number, like 12.");
     if(v===it.right)return ctx.done({right:true,answer:v+u,eq:it.ask,tag:"right",reply:`Your answer, ${v}${u}, is right. `+it.answer});
     /* a planned wrong answer gets what it describes; any other number gets the check of that number */
     const w=it.wrongs.find(z=>z.v===v),extra=(w&&w.text)?w.text:it.other(v);
     ctx.done({right:false,answer:v+u,eq:it.ask,tag:w?w.tag:"other",reply:`Your answer, ${v}${u}, is not right. `+(extra?extra+" ":"")+it.answer});});
   if(!u){const deg=inp.parentElement.querySelector("span");if(deg)deg.remove();}
   const type=v=>()=>{inp.value=String(v);press();};
   ctx.auto({right:type(it.right),wrongs:it.wrongs.map(w=>({expect:`${w.v}${u}, is not right`,fn:type(w.v)}))});}
};

/* ===================== the sitting: order, her place, one item per QE.start, rows ===================== */
const QS2=new URLSearchParams(location.search);
const TRY=QS2.get("try")==="1";                         /* play without sending or storing anything */
const LOG=!TRY&&typeof SheetLog!=="undefined";
const SKEY="student2-return-sitting-v1";
const store={get(){if(TRY)return null;try{return JSON.parse(localStorage.getItem(SKEY))}catch(e){return null}},set(v){if(TRY)return;try{localStorage.setItem(SKEY,JSON.stringify(v))}catch(e){}}};
let seed=Number(QS2.get("seed"))||((Date.now()%100000)+1);
const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
/* the first item is the shape that is a quadrilateral; the rest are shuffled so that no two of one group are next to each other */
function makeOrder(){const first=ITEMS[0],rest=ITEMS.slice(1);
  for(let t=0;t<2000;t++){const a=rest.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    const o=[first].concat(a);if(o.every((x,i)=>i===0||x.group!==o[i-1].group))return o;}
  return ITEMS.slice();}
/* her place: the order and the next seat. A saved order is used only if it names exactly these 13 items. */
let ST=store.get();
const validOrder=o=>Array.isArray(o)&&o.length===ITEMS.length&&ITEMS.every(i=>o.includes(i.id));
if(!ST||ST.v!==1||!validOrder(ST.order)||!(ST.pos>=0))ST={v:1,order:makeOrder().map(i=>i.id),pos:0,started:false,done:false};
const ORDER=ST.order.map(id=>ITEMS.find(i=>i.id===id));
window.__sitting={rows:[],order:ST.order,version:VERSION,seed:QS2.get("seed")||"random",try:TRY};
let pos=-1,cur=null;
const $=id=>document.getElementById(id);
function showRows(){if(QS2.get("teacher")!=="1")return;const r=$("rows");r.classList.remove("hide");
  r.textContent="For the teacher. Rows of this sitting"+(LOG?" (sent to the Sheet)":" (nothing is sent or stored)")+". Order: "+ST.order.join(", ")+"\n"+window.__sitting.rows.map(x=>JSON.stringify(x)).join("\n");}
/* one row: kept on the page for the test and the teacher strip, and sent to the Activity tab */
function send(row){window.__sitting.rows.push(row);showRows();
  if(LOG){try{SheetLog.activity(Object.assign({},row,{detail:JSON.stringify(row.detail)}));}catch(e){}}}
function logRow(it,r){const supplied=it.supplied.slice();if(cur.read)supplied.push("read aloud");if(cur.tried)supplied.push("lines she drew to try before answering");
  const row={event:"answer",set:"return-sitting",role:"first answer",eq:it.ask||it.id,answer:r.answer,right:r.right?1:0,own:1,support:supplied.length?supplied.join("; "):"none",checks:it.graph+" | "+it.id,
    detail:{item:it.id,seat:pos+1,first_attempt:true,decision:({"decide-yes":"classify","make-5":"construct","make-line":"construct","decide-open":"boundary","dart":"draw","howmany":"count","check-slip":"check","fourth-angle":"calculate","angle-beside":"calculate","angles-x":"substitute","eq-1":"solve-add","eq-2":"solve-add","eq-3":"solve-subtract"})[it.id],supplied,version:VERSION,tag:r.tag||"",reply:r.reply||""}};
  const target=(it.graph.match(/(?:KI|SK)-[A-Z]+-\d+/)||[])[0],d=TeachingCatalogue.get(target);
  if(d){LearningBridge.init(d.sets[0],VERSION);const adapted=Object.assign({},row,{set:d.sets[0]});LearningBridge.observe(adapted);row.detail=adapted.detail;row.own=adapted.own;}
  send(row);}
function endScreen(first){$("pic").innerHTML="";$("words").innerHTML="";$("acts").innerHTML="";
  for(const t of ["That is the end of these questions. Your answers are kept.","There are no more questions on this page."]){const p=document.createElement("p");p.className="say";p.textContent=t;$("words").appendChild(p);}
  const link=document.createElement("a");link.href="next-practice.html";link.className="btn";link.textContent="Choose the next page";$("acts").appendChild(link);
  if(first){send({event:"sitting end",set:"return-sitting",detail:{version:VERSION,answered:ORDER.length}});if(LOG)setTimeout(()=>{try{SheetLog.flush()}catch(e){}},50);}}
function showItem(){if(pos>=ORDER.length){ST.done=true;store.set(ST);return endScreen(true);}QE.start(PAGE);}
function intro(ctx){
  ctx.say("These questions are on shapes, angles and equations. Some are like questions you have answered before, with new shapes and numbers.");
  ctx.say("Answer each question on your own. After each answer, the page shows the answer, and then you go on to the next question.");
  ctx.button("Start",()=>{ST.started=true;store.set(ST);send({event:"sitting start",set:"return-sitting",detail:{version:VERSION,order:ST.order}});pos=0;showItem();});}
const PAGE={set:"return-sitting",ki:"mixed",title:"Answer questions on shapes, angles and equations",version:VERSION,teacher:"Return sitting: first answers after a gap, mixed order.",
  worked:[],plan:[],contrasts:[],contrastKind:{},gates:{},
  gen:{sitting(ctx){
    if(pos<0)return intro(ctx);
    const it=ORDER[pos];cur={it,read:false,tried:0};
    const orig=ctx.done;
    ctx.done=r=>{orig(r);logRow(it,r);
      ST.pos=pos+1;store.set(ST);                       /* an answered item is never asked again, even after a reload */
      const b=document.querySelector("#acts .next");if(b){const nb=b.cloneNode(true);nb.addEventListener("click",()=>{pos++;showItem();});b.replaceWith(nb);nb.focus({preventScroll:true});}};
    RUN[it.kind](ctx,it);}}};
document.addEventListener("DOMContentLoaded",()=>{$("readBtn").addEventListener("click",()=>{if(cur)cur.read=true;});});
if(LOG){try{SheetLog.setSession("s2r-"+Date.now().toString(36));}catch(e){}}
if(new URLSearchParams(location.search).get("screen")!=="sitting"){$("words").textContent="Open this page with ?screen=sitting at the end of its address.";}
else if(ST.done){endScreen(false);}
else if(ST.started){pos=ST.pos;send({event:"sitting resumed",set:"return-sitting",detail:{version:VERSION,seat:pos+1}});showItem();}
else QE.start(PAGE);
</script>
