<script>
"use strict";
/* ===================== Settings (teacher side, never on her screen) ===================== */
const QS=new URLSearchParams(location.search);
const CONFIG=Object.assign({
  /* Skip the supported item when every completion step in W1–W3 was right first time.
     OFF by default: Bijit has not decided (spec, teaching point 6). URL: ?skipSupported=1 */
  skipSupported:false,
  stateKey:"student2-ki-ag01-03-v1",
  kiKey:"student2-ki-v1",
  version:"ki-ag-01-03 1.0 (9 Nov 2026)"
},window.KI_CONFIG||{});
if(QS.get("skipSupported")==="1")CONFIG.skipSupported=true;
const TEACHER=QS.get("teacher")==="1";
const SEED=QS.get("seed");

/* ===================== Small helpers ===================== */
let rngState=SEED?Number(SEED)>>>0||1:0;
function rand(){if(!rngState)return Math.random();rngState=(rngState*1664525+1013904223)>>>0;return rngState/4294967296;}
const ri=(a,b)=>a+Math.floor(rand()*(b-a+1));
const pick=a=>a[Math.floor(rand()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const MINUS="−",TIMES="×";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>{const r=Math.round(n*1000)/1000;return String(r);};
/* Text uses `...` around mathematics. In maths, single letters are set in italics. */
function mathHTML(s){return esc(s).replace(/(^|[^A-Za-z])([a-z])(?![A-Za-z])/g,"$1<i>$2</i>").replace(/ /g," ");}
function rich(t){return esc(t).split("`").map((seg,i)=>i%2?`<span class="m">${mathHTML(seg.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"'))}</span>`:seg).join("").replace(/₹(\d)/g,"₹⁠$1");}
function plain(t){return String(t).replace(/`/g,"");}
function speakable(t){return plain(t).replace(/₹\s?(\d+)/g,"$1 rupees").replace(/(\d)([a-z])\b/g,"$1 $2").replace(new RegExp(MINUS,"g")," minus ").replace(/\+/g," plus ").replace(new RegExp(TIMES,"g")," times ").replace(/=/g," equals ").replace(/▢/g," blank ").replace(/\s+/g," ");}
const todayKey=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ===================== Reading what she types ===================== */
/* Numbers: digits with one decimal point, optional leading minus. */
function readNumber(s){s=s.replace(new RegExp(MINUS,"g"),"-");if(!/^-?(\d+(\.\d*)?|\.\d+)$/.test(s))return null;return parseFloat(s);}
/* Expressions in one or more letters, linear: returns {coef:{x:3}, c:2, times, tokens} or null. */
function tokenize(s){const t=[];let i=0;s=s.replace(/\s+/g,"");
  while(i<s.length){const ch=s[i];
    if(/[0-9.]/.test(ch)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const num=s.slice(i,j);if((num.match(/\./g)||[]).length>1||num===".")return null;t.push({k:"n",v:parseFloat(num),s:num});i=j;}
    else if(/[a-z]/.test(ch)){t.push({k:"l",v:ch,s:ch});i++;}
    else if(ch==="+"||ch==="-"||ch===MINUS){t.push({k:"op",v:ch==="+"?"+":"-",s:ch==="+"?"+":MINUS});i++;}
    else if(ch===TIMES||ch==="*"){t.push({k:"x",s:TIMES});i++;}
    else return null;}
  return t;}
function readExpr(s){const t=tokenize(s);if(!t||!t.length)return null;let i=0,times=false;const coef={};let c=0;
  let sign=1;if(t[0].k==="op"){if(t[0].v==="-"){sign=-1;i=1;}else return null;}
  while(true){/* term */let num=1,letter=null,factors=0;
    while(i<t.length&&t[i].k!=="op"){const tk=t[i];
      if(tk.k==="x"){if(!factors)return null;times=true;i++;if(i>=t.length||t[i].k==="op"||t[i].k==="x")return null;continue;}
      if(factors&&t[i-1].k!=="x"){/* implicit multiplication only for number followed by letter */if(!(t[i-1].k==="n"&&tk.k==="l"))return null;}
      if(tk.k==="n")num*=tk.v;else{if(letter)return null;letter=tk.v;}
      factors++;i++;}
    if(!factors)return null;
    if(letter)coef[letter]=(coef[letter]||0)+sign*num;else c+=sign*num;
    if(i>=t.length)break;
    sign=t[i].v==="+"?1:-1;i++;if(i>=t.length)return null;}
  const letterCount={};t.filter(x=>x.k==="l").forEach(x=>letterCount[x.v]=(letterCount[x.v]||0)+1);
  return {coef,c,times,tokens:t,repeated:Object.values(letterCount).some(n=>n>1),letters:Object.keys(letterCount)};}
function sameExpr(e,a,L,b){/* e equals a·L + b for every L */const keys=Object.keys(e.coef).filter(k=>e.coef[k]!==0);
  if(a===0)return keys.length===0&&Math.abs(e.c-b)<1e-9;
  return keys.length===1&&keys[0]===L&&Math.abs(e.coef[L]-a)<1e-9&&Math.abs(e.c-b)<1e-9;}
function exprText(s){const t=tokenize(s);if(!t)return s;let out="";t.forEach((tk,i)=>{if(tk.k==="op"){out+=(i?" ":"")+tk.s+(i?" ":"");}else if(tk.k==="x")out+=" "+TIMES+" ";else out+=tk.s;});return out.trim();}
/* Works out her expression at a value, written the way a teacher writes it: 2x + 1 → 2 × 3 + 1 = 7 */
function substitute(s,L,v){const t=tokenize(s);let out="";t.forEach((tk,i)=>{
  if(tk.k==="op")out+=(i?" ":"")+tk.s+(i?" ":"");
  else if(tk.k==="x")out+=" "+TIMES+" ";
  else if(tk.k==="l"){if(i>0&&t[i-1].k==="n")out+=" "+TIMES+" ";out+=tk.v===L?fmt(v):tk.v;}
  else out+=tk.s;});return out.trim();}
function valueAt(e,L,v){let s=e.c;for(const k in e.coef)s+=e.coef[k]*(k===L?v:NaN);return s;}

/* ===================== Records ===================== */
const HAS_SHEET=typeof SheetLog!=="undefined";
let S=null,K=null;
function saveAll(){store.set(CONFIG.stateKey,S);store.set(CONFIG.kiKey,K);}
function record(event,f){const row=Object.assign({t:new Date().toISOString(),event,set:S?S.stop:"",role:"",eq:"",x:"",answer:"",right:"",own:"",support:"",checks:"",detail:""},f||{});
  if(S){S.events.push(row);if(S.events.length>2000)S.events.splice(0,S.events.length-2000);store.set(CONFIG.stateKey,S);}
  if(HAS_SHEET){try{SheetLog.activity({event:row.event,set:row.set,role:row.role,eq:row.eq,x:row.x,answer:row.answer,right:row.right,own:row.own,support:row.support,checks:row.checks,detail:typeof row.detail==="string"?row.detail:JSON.stringify(row.detail)});}catch(e){}}
  window.__records=(window.__records||[]);window.__records.push(row);
  renderTeacher();}
function sendState(stopId,status){if(!HAS_SHEET)return;const k=K[stopId]||{};try{SheetLog.state({set:stopId,ki:STOPS[stopId].ki,teacher:STOPS[stopId].teacher,status,stage:k.stage||"",own_right:(k.res||[]).filter(r=>r.own&&r.right).length,items:(k.res||[]).length});}catch(e){}}

/* ===================== Content: KI-AG-01 ===================== */
const LETTERS=["x","y","n","a"];
function letterFor(i){return LETTERS[i%LETTERS.length];}
/* Stories: the letter is never the first letter of the thing counted. */
const STORIES=[
  {thing:"pen",things:"pens",buyer:"Asha",judge:"Ravi",price:()=>pick([4,5,6,7])},
  {thing:"book",things:"books",buyer:"Ravi",judge:"Meera",price:()=>pick([20,25,30,40])},
  {thing:"bus ticket",things:"bus tickets",buyer:"Sunita",judge:"Imran",price:()=>pick([8,9,12,15])}
];
function storyLetter(st,avoid){return LETTERS.filter(l=>l!=="a"&&l!==st.thing[0]&&l!==avoid)[0];}

const W01=[
 {id:"W1",lines:["In `x + 4`, the letter `x` stands for a number."],
  table:{head:["x","x + 4"],rows:[["3","3 + 4 = 7"],["10","10 + 4 = 14"],["0","0 + 4 = 4"],["8",{box:0}]]},
  after:["The number that `x` stands for can be different each time. When `x` is 0, `x + 4` is 4."],
  steps:[
   {type:"num",q:"When `x` is 8, what is `x + 4`?",inTable:true,ans:12,why:"When `x` is 8, `x + 4` is `8 + 4 = 12`.",letters:["x"]},
   {type:"num",q:"In `n + 4`, the letter `n` stands for a number too. When `n` is 8, what is `n + 4`?",ans:12,why:"When `n` is 8, `n + 4` is `8 + 4 = 12`.",letters:["n"]}]},
 {id:"W2",lines:["A pen costs ₹5. Asha buys `x` pens.","`x` stands for the number of pens Asha buys. `x` does not stand for the pens.","The cost of the pens in rupees is `5 × x`. We write this as `5x`.","If Asha buys 4 pens, `x` is 4, and the cost is `5 × 4` = ₹20."],
  steps:[
   {type:"choice",q:"A book costs ₹30. Ravi buys `y` books. What does `y` stand for?",options:[{t:"the books"},{t:"the number of books Ravi buys",right:true},{t:"the cost of the books"}],
    why:"`y` stands for the number of books Ravi buys. The books are not a number, and the cost is `30y` rupees.",letters:["y"]},
   {type:"num",q:"Ravi buys 2 books. What is `30y`?",ans:60,why:"`30y` means `30 × y`. When `y` is 2, `30y` is `30 × 2 = 60`.",letters:["y"]}]},
 {id:"W3",lines:["In `x + x`, both `x`'s stand for the same number. If `x` is 4, `x + x` is `4 + 4 = 8`.","`x` and `y` can stand for different numbers, like 2 and 7. They can also stand for the same number, like 5 and 5."],
  steps:[{type:"num",q:"If `a` is 6, what is `a + a`?",ans:12,why:"Both `a`'s stand for 6, so `a + a` is `6 + 6 = 12`.",letters:["a"]}]}
];
const SUP01={support:["When `x` is 3, `x + 4` is `3 + 4 = 7`.","When `x` is 10, `x + 4` is `10 + 4 = 14`."],
  part:{type:"num",q:"If `x` is 6, what is `x + 4`?",ans:10,why:"When `x` is 6, `x + 4` is `6 + 4 = 10`.",letters:["x"],
   wrong:{6:"6 is the number that `x` stands for. The question asks for `x + 4`, which is `6 + 4 = 10`.",4:"4 is the number added to `x`. `x` stands for 6, so `x + 4` is `6 + 4 = 10`.",64:"`x + 4` means the number `x`, then 4 added. It is `6 + 4 = 10`, not 6 and 4 written side by side."}}};

/* Generators: each returns {signal, contrast, parts[]} with fresh numbers. L = the letter for this item. */
const G01={
 S1a(L){let v,k;do{v=ri(5,9);k=ri(2,5);}while(v===k);const sum=v+k,cat=Number(""+v+k);
  return {signal:"S1",parts:[{type:"num",q:`If \`${L}\` is ${v}, what is \`${L} + ${k}\`?`,ans:sum,x:`${L}=${v}`,why:`\`${L} + ${k}\` is \`${v} + ${k} = ${sum}\`.`,
   wrong:{[v]:`${v} is the number that \`${L}\` stands for. The question asks for \`${L} + ${k}\`, which is \`${v} + ${k} = ${sum}\`.`,[k]:`${k} is the number added to \`${L}\`. \`${L}\` stands for ${v}, so \`${L} + ${k}\` is \`${v} + ${k} = ${sum}\`.`,[cat]:`\`${L} + ${k}\` means the number \`${L}\`, then ${k} added. It is \`${v} + ${k} = ${sum}\`, not ${v} and ${k} written side by side.`},
   tags:{[v]:"letter value only",[k]:"letter ignored",[cat]:"juxtaposed"}}]};},
 S1b(L){let v,k;do{v=ri(9,15);k=ri(2,5);}while(v===k);const d=v-k;
  return {signal:"S1",parts:[{type:"num",q:`If \`${L}\` is ${v}, what is \`${L} ${MINUS} ${k}\`?`,ans:d,x:`${L}=${v}`,why:`\`${L} ${MINUS} ${k}\` is \`${v} ${MINUS} ${k} = ${d}\`.`,
   wrong:{[v]:`${v} is the number that \`${L}\` stands for. The question asks for \`${L} ${MINUS} ${k}\`, which is \`${v} ${MINUS} ${k} = ${d}\`.`,[v+k]:`${v+k} is \`${v} + ${k}\`. \`${L} ${MINUS} ${k}\` takes ${k} away from ${v}, so it is \`${v} ${MINUS} ${k} = ${d}\`.`},tags:{[v]:"letter value only",[v+k]:"operation"}}]};},
 S1c(L){let v,k;do{v=ri(4,9);k=ri(2,6);}while(v===k);const sum=v+k;
  return {signal:"S1",parts:[{type:"num",q:`If \`${L}\` is ${v}, what is \`${k} + ${L}\`?`,ans:sum,x:`${L}=${v}`,why:`\`${k} + ${L}\` is \`${k} + ${v} = ${sum}\`.`,
   wrong:{[v]:`${v} is the number that \`${L}\` stands for. The question asks for \`${k} + ${L}\`, which is \`${k} + ${v} = ${sum}\`.`,[k]:`${k} is the number that \`${L}\` is added to. \`${L}\` stands for ${v}, so \`${k} + ${L}\` is \`${k} + ${v} = ${sum}\`.`,[Number(""+k+v)]:`\`${k} + ${L}\` means ${k}, then the number \`${L}\` added. It is \`${k} + ${v} = ${sum}\`, not ${k} and ${v} written side by side.`},tags:{[v]:"letter value only",[k]:"letter ignored"}}]};},
 S2a(L){const k=ri(3,6),v=ri(11,19),T=v+k;
  return {signal:"S2",parts:[
   {type:"yn",q:`Can \`${L} + ${k}\` be ${T}?`,yes:"Yes, it can",no:"No, it cannot",ans:true,endOnWrong:true,
    wrongReply:`When \`${L}\` is ${v}, \`${L} + ${k}\` is \`${v} + ${k} = ${T}\`. So \`${L} + ${k}\` can be ${T}.`},
   {type:"num",q:`What number does \`${L}\` stand for when \`${L} + ${k}\` is ${T}?`,prefix:`${L} =`,ans:v,why:`When \`${L}\` is ${v}, \`${L} + ${k}\` is \`${v} + ${k} = ${T}\`.`,
    gen:w=>`When \`${L}\` is ${fmt(w)}, \`${L} + ${k}\` is \`${fmt(w)} + ${k} = ${fmt(w+k)}\`, not ${T}. \`${L}\` stands for ${v}.`}]};},
 S2z(L){const k=ri(3,9);
  return {signal:"S2",contrast:"x = 0",parts:[
   {type:"yn",q:`Can \`${L} + ${k}\` be ${k}?`,yes:"Yes, it can",no:"No, it cannot",ans:true,endOnWrong:true,
    wrongReply:`When \`${L}\` is 0, \`${L} + ${k}\` is \`0 + ${k} = ${k}\`. \`${L}\` can stand for 0.`},
   {type:"num",q:`What number does \`${L}\` stand for when \`${L} + ${k}\` is ${k}?`,prefix:`${L} =`,ans:0,why:`When \`${L}\` is 0, \`${L} + ${k}\` is \`0 + ${k} = ${k}\`.`,
    gen:w=>`When \`${L}\` is ${fmt(w)}, \`${L} + ${k}\` is \`${fmt(w)} + ${k} = ${fmt(w+k)}\`, not ${k}. \`${L}\` stands for 0.`}]};},

   forms:[{a:-a,b,reply:`\`${b} ${MINUS} ${a}${L}\` takes \`${a}${L}\` away from ${b}. Here ${b} is taken away from \`${a}${L}\`. That is \`${a}${L} ${MINUS} ${b}\`.`,tag:"order reversed"},{a,b,reply:`\`${a}${L} + ${b}\` is ${b} more than ${a} times \`${L}\`. ${b} less is \`${a}${L} ${MINUS} ${b}\`.`,tag:"operation"}]}]};},
 T5(L){const a=ri(2,5),b=ri(2,6),v=ri(2,4),lhs=a*v+b,rhs=(a+b)*v,nm=pick(["Meera","Imran","Sunita"]);
  return {signal:"T5",contrast:"conjoining",holdReply:true,parts:[
   {type:"yn",q:`${nm} writes \`${a}${L} + ${b} = ${a+b}${L}\`. Is ${nm} right?`,yes:`Yes, ${nm} is right`,no:`No, ${nm} is not right`,ans:false,tag:"conjoining"},
   {type:"nums",intro:`Check ${nm}'s work with a number.`,rows:[{q:`When \`${L}\` is ${v}, what is \`${a}${L} + ${b}\`?`,ans:lhs},{q:`When \`${L}\` is ${v}, what is \`${a+b}${L}\`?`,ans:rhs}],x:`${L}=${v}`}],
   summary:ok=>`When \`${L}\` is ${v}, \`${a}${L} + ${b}\` is \`${a} × ${v} + ${b} = ${lhs}\` and \`${a+b}${L}\` is \`${a+b} × ${v} = ${rhs}\`. They are not equal, so \`${a}${L} + ${b}\` is not \`${a+b}${L}\`. \`${a}${L}\` and ${b} cannot be joined into one term.`+(ok?"":` ${nm} is not right.`)};},
 T6(L){const v=ri(2,4),T=pick([9,11,13,14,17].filter(t=>t!==v));
  return {signal:"T6",parts:[{type:"ownexpr",q:`Write an expression with \`${L}\` in it that is ${T} when \`${L}\` is ${v}.`,L,v,T}]};}
};

/* A typed answer box. kind: "num" | "expr". */
function makeBox(kind,label){const b=el("button","box");b.type="button";b.dataset.kind=kind;b.setAttribute("aria-label",label||"answer box");b._v="";b._locked=false;
  b.addEventListener("click",()=>{if(!b._locked)focusBox(b);});return b;}

/* ---------- One part: shows its question and controls, calls done(result) ---------- */
/* result: {right, answer, tag, replyHTML?}  */
function runPart(part,ctx,done){
  window.__ki.part=part;window.__ki.ctx=ctx;
  const letters=part.letters||ctx.letters||[ctx.letter];
  if(part.intro)para(part.intro);
  if(part.type==="num"||part.type==="own"){
    const box=makeBox("num");boxesNow=[box];
    if(part.inTable&&ctx.tableBox){ctx.tableBox.replaceWith(box);para(part.q,"ask");}
    else{const row=el("div","qrow");const q=el("p","ask",rich(part.q));stage.appendChild(q);say(plain(part.q));if(part.prefix)row.appendChild(el("span","m",mathHTML(part.prefix)));row.appendChild(box);stage.appendChild(row);}
    focusBox(box);
    keypad(letters,()=>{const s=box._v;if(!s)return;const n=readNumber(s);
      if(n===null){unreadable(box,s);return;}
      clearUnreadable();box._locked=true;hideKeypad();paintBox(box);
      if(part.type==="own"){const r=part.check(n,ctx.prev||[]);if(r.retry){box._locked=false;box._v="";focusBox(box);keypad(letters,keyHandlerSaved);noteRetry(r.retry);return;}
        box.classList.add(r.right?"right":"wrong");done({right:r.right,answer:s,tag:r.tag,text:r.right?"Right. "+r.why:r.reply,value:n});return;}
      const right=Math.abs(n-part.ans)<1e-9;box.classList.add(right?"right":"wrong");
      let text;if(right)text="Right. "+(part.why||"");else{const key=fmt(n);text=(part.wrong&&part.wrong[key])||(part.gen?part.gen(n):"")||(part.why?part.why:`The answer is ${fmt(part.ans)}.`);}
      done({right,answer:s,tag:right?"":((part.tags&&part.tags[fmt(n)])||""),text});});
    var keyHandlerSaved=keyHandler;
  }
  else if(part.type==="nums"){
    const boxes=part.rows.map(()=>makeBox("num"));boxesNow=boxes;
    part.rows.forEach((r,i)=>{const row=el("div","qrow");const q=el("span","ask",rich(r.q));row.appendChild(q);say(plain(r.q));row.appendChild(boxes[i]);stage.appendChild(row);});
    focusBox(boxes[0]);
    keypad(letters,()=>{const i=boxes.indexOf(activeBox);if(!activeBox._v)return;const n=readNumber(activeBox._v);if(n===null){unreadable(activeBox,activeBox._v);return;}clearUnreadable();
      const empty=boxes.find(b=>!b._v);if(empty){focusBox(empty);return;}
      const vals=boxes.map(b=>readNumber(b._v));if(vals.some(v=>v===null)){focusBox(boxes[vals.findIndex(v=>v===null)]);unreadable(activeBox,activeBox._v);return;}
      boxes.forEach(b=>{b._locked=true;});hideKeypad();boxes.forEach(paintBox);
      const rights=vals.map((v,j)=>Math.abs(v-part.rows[j].ans)<1e-9);boxes.forEach((b,j)=>b.classList.add(rights[j]?"right":"wrong"));
      const right=rights.every(Boolean);
      const whys=part.rows.map(r=>r.why).filter(Boolean).join(" ");
      done({right,answer:boxes.map(b=>b._v).join(" | "),text:(right?"Right. ":"")+whys,rights});});
  }
  else if(part.type==="expr"||part.type==="ownexpr"){
    const box=makeBox("expr");boxesNow=[box];para(part.q,"ask");const row=el("div","qrow");row.appendChild(box);stage.appendChild(row);focusBox(box);
    const L=part.type==="ownexpr"?part.L:ctx.letter;
    keypad([L],()=>{const s=box._v;if(!s)return;const e=readExpr(s);
      if(!e){unreadable(box,s,true);return;}
      const otherLetter=e.letters.find(x=>x!==L);if(otherLetter){unreadable(box,s,true);return;}
      clearUnreadable();box._locked=true;hideKeypad();paintBox(box);const shown="`"+exprText(s)+"`";
      if(part.type==="ownexpr"){
        if(!e.letters.includes(L)){box.classList.add("wrong");const val=e.c;done({right:false,answer:s,tag:"no letter",text:`${shown} is a number with no \`${L}\` in it. Write one that uses \`${L}\`.`});return;}
        const val=valueAt(e,L,part.v);const work=`When \`${L}\` is ${part.v}, ${shown} is \`${substitute(s,L,part.v)} = ${fmt(val)}\`.`;
        const right=Math.abs(val-part.T)<1e-9;box.classList.add(right?"right":"wrong");
        done({right,answer:s,text:right?"Right. "+work+` So your expression is ${part.T} when \`${L}\` is ${part.v}.`:work+` That is not ${part.T}. One expression that works is \`${L} + ${part.T-part.v}\`, because \`${part.v} + ${part.T-part.v} = ${part.T}\`.`});return;}
      if(sameExpr(e,part.a,L,part.b)){box.classList.add("right");let note="";
        if(e.times||e.repeated)note=` We write this as \`${part.canon}\`.`;
        done({right:true,answer:s,text:"Right. "+part.why+note});return;}
      box.classList.add("wrong");const f=(part.forms||[]).find(f=>sameExpr(e,f.a,L,f.b));
      done({right:false,answer:s,tag:f?f.tag:"",text:f?f.reply:`${shown} is not ${part.q.replace(/^Write /,"").replace(/ as an expression\.$/,"")}. ${part.why}`});});
  }
  else if(part.type==="choice"||part.type==="yn"){
    const q=el("p","ask",rich(part.q));stage.appendChild(q);say(plain(part.q));
    const opts=part.type==="yn"?[{t:part.yes,v:true},{t:part.no,v:false}]:shuffle(part.options);
    const wrap=el("div","choices"+(part.type==="yn"?" yn":""));const btns=[];
    opts.forEach(o=>{const b=el("button","ch",rich(o.t));b.type="button";say(plain(o.t));btns.push(b);wrap.appendChild(b);
      b.addEventListener("click",()=>{if(b.disabled)return;btns.forEach(x=>x.disabled=true);
        const right=part.type==="yn"?o.v===part.ans:!!o.right;b.classList.add(ctx.hold?"picked":(right?"right":"wrong"));
        let text;if(part.type==="yn")text=right?(part.rightReply||""):(part.wrongReply||"");
        else text=right?"Right. "+(part.why||""):(o.reply||part.why||"");
        done({right,answer:plain(o.t),tag:right?"":(o.tag||part.tag||""),text:(right&&part.type==="yn"&&text&&!/^Right/.test(text)?"Right. ":"")+text});});});
    stage.appendChild(wrap);hideKeypad();
  }
}
let unreadEl=null;
function unreadable(box,s,expr){clearUnreadable();const shown=expr?exprText(s):s;
  let t;if(expr){if(/[+−×]$/.test(shown))t=`\`${shown}\` is not finished. Write a number or a letter after the last sign.`;else t=`\`${shown}\` cannot be read as an expression. Change it, then press OK.`;}
  else if(/[a-z]/.test(s))t=`The answer here is a number. Write the number without a letter, then press OK.`;
  else if(/[+−×]/.test(s))t=`Work out \`${exprText(s)}\` and write the answer as one number, then press OK.`;
  else t=`${s} cannot be read as a number. Change it, then press OK.`;
  unreadEl=reply(rich(t),"info");unreadEl.dataset.unreadable="1";record("unreadable answer",{answer:s,detail:{text:t}});}
function noteRetry(t){clearUnreadable();unreadEl=reply(rich(t),"info");unreadEl.dataset.unreadable="1";}
function clearUnreadable(){if(unreadEl){unreadEl.remove();unreadEl=null;}}

/* ===================== Flow ===================== */
const ST=()=>S.stops[S.stop]||(S.stops[S.stop]=freshStop());

function start(){
  loadState();
  if(HAS_SHEET)try{SheetLog.setSession("s2ki-"+Date.now().toString(36));}catch(e){}
  const today=todayKey();
  const newDay=S.lastDay!==today;S.lastDay=today;
  record("session start",{detail:{version:CONFIG.version,skipSupported:CONFIG.skipSupported}});
  if(S.stoppedOn===today){return endScreen("stopped");}
  if(S.stoppedOn&&S.stoppedOn!==today){S.stoppedOn=null;const st=S.stops[S.stop];if(st){st.phase="worked";st.w=0;st.resumed=true;st.missRun=0;}}
  if(!S.stop){S.stop=ORDER.find(id=>!kiOf(id).passed)||null;}
  saveAll();
  /* Review: each new session opens with one fresh item of every item already held. */
  const held=ORDER.filter(id=>kiOf(id).passed);
  if(newDay&&held.length&&S.events.some(e=>e.event==="answer")){S.review=held.slice();}
  go();
}
let SAMPLE=false;
function go(){if(SAMPLE){clearStage();return;}saveAll();renderTeacher();
  if(S.review&&S.review.length)return reviewItem(S.review[0]);
  if(!S.stop)return endScreen("all");
  const st=ST(),def=STOPS[S.stop];
  if(st.phase==="worked")return workedExample(def,st);
  if(st.phase==="supported")return supportedItem(def,st);
  if(st.phase==="own")return ownItem(def,st);
}

/* ---------- Worked examples ---------- */
function workedExample(def,st){
  const W=def.worked[st.w];clearStage();
  W.lines.forEach(l=>para(l));
  let tableBox=null;
  if(W.table){const boxes=[el("span","box locked","▢")];tableBox=boxes[0];stage.appendChild(valueTable(W.table,boxes));}
  if(W.wtable)stage.appendChild(wordTable(W.wtable));
  (W.after||[]).forEach(l=>para(l));
  let si=0;
  const nextStep=()=>{
    if(si>=W.steps.length){
      return nextButton("Next",()=>{st.w++;if(st.w>=def.worked.length){
        const allFirst=st.firstTry.length&&st.firstTry.every(Boolean);
        if(st.resumed){st.phase="own";st.resumed=false;}
        else if(CONFIG.skipSupported&&allFirst){st.phase="own";record("supported item skipped",{role:"supported",detail:{reason:"every completion step right first time",setting:"skipSupported on"}});}
        else st.phase="supported";}
        go();});}
    const step=W.steps[si];
    runPart(step,{letter:(step.letters||["x"])[0],letters:step.letters,tableBox,worked:true},res=>{
      st.firstTry.push(res.right);
      record("answer",{role:"worked example step",eq:plain(step.q||step.rows.map(r=>r.q).join(" | ")),answer:res.answer,right:res.right?1:0,own:1,support:"worked example on screen",checks:def.ki+" "+W.id,detail:{example:W.id,step:si+1,tag:res.tag||""}});
      reply(rich(res.text+(step.after&&res.right?" "+step.after:"")),res.right?"ok":"no");
      si++;saveAll();
      if(si<W.steps.length)nextButton("Next",()=>{const r=stage.querySelectorAll(".reply,.actions");r.forEach(x=>x.classList.add("done"));stage.querySelectorAll(".actions").forEach(a=>a.remove());nextStep();});
      else nextStep();});
  };
  nextStep();
}

/* ---------- Supported item ---------- */
function supportedItem(def,st){clearStage();
  def.sup.support.forEach(l=>para(l,"done"));
  const part=def.sup.part;
  runPart(part,{letter:part.letters[0],letters:part.letters},res=>{
    record("answer",{role:"supported",eq:plain(part.q),answer:res.answer,right:res.right?1:0,own:0,support:"worked lines on screen",checks:def.ki,detail:{tag:res.tag||""}});
    reply(rich(res.text),res.right?"ok":"no");
    kiOf(S.stop).stage="own items";
    nextButton("Next",()=>{st.phase="own";go();});});
}

/* ---------- Her own items ---------- */
function planQueue(def,st){if(!st.queue)st.queue=def.plan.slice();return st.queue;}
function heldNow(def,st){
  const own=st.res.filter(r=>r.own&&r.right);
  const last=st.res[st.res.length-1];
  const kinds=new Set(own.map(r=>r.signal));
  const contrastsOk=def.contrasts.every(c=>own.some(r=>r.contrast===c));
  return {held:!!last&&last.own&&last.right&&contrastsOk&&kinds.size>=3,contrastsOk,kinds:[...kinds],missing:def.contrasts.filter(c=>!own.some(r=>r.contrast===c))};
}
function ownItem(def,st){
  const q=planQueue(def,st);
  if(st.pi>=q.length){
    const h=heldNow(def,st);
    if(h.held)return holds(def,st);
    /* The authored set is done but the rule is not met: add a fresh item for what is still missing. */
    q.push(h.missing.length?def.contrastKind[h.missing[0]]:q[q.length-1]);
  }
  let kind=q[st.pi];
  /* Incorrect worked answers come only after her own items on the same signal were right. */
  const gate=def.gates[kind];
  if(gate){const ownRight=st.res.filter(r=>r.own&&r.right).map(r=>r.signal);const miss=gate.find(g=>!ownRight.includes(g));
    if(miss){const k=def.plan.find(p=>p.startsWith(miss))||miss;q.splice(st.pi,0,k);kind=k;}}
  showItem(def,st,kind,"own");
}
function makeItem(def,kind){const L=nextLetter();const ctx={story:nextStory()};const gen=def.gen[kind]||def.gen[kind.replace(/Why$/,"")];const it=gen(L,ctx);it.kind=kind;it.L=it.letter||L;return it;}
function showItem(def,st,kind,role,after){
  clearStage();const it=makeItem(def,kind);const results=[];let pi=0;const prevVals=[];
  const runNext=()=>{
    if(pi>=it.parts.length)return finish();
    const part=it.parts[pi];
    if(part.needsPrevRight&&!results[results.length-1].right){pi++;return runNext();}
    runPart(part,{letter:it.L,letters:it.letters||[it.L],hold:it.holdReply,prev:prevVals},res=>{
      results.push(res);if(res.value!==undefined)prevVals.push(res.value);
      const isLast=pi===it.parts.length-1||(part.endOnWrong&&!res.right)||(part.onlyIfRight&&!res.right);
      record("answer",{set:def.id,role,eq:plain(part.q||part.rows.map(r=>r.q).join(" | ")),x:part.x||(it.parts.find(p=>p.x)||{}).x||"",answer:res.answer,right:res.right?1:0,own:1,support:"none",
        checks:def.ki+" "+it.signal+(it.contrast?" | contrast: "+it.contrast:""),detail:{kind,part:pi+1,of:it.parts.length,tag:res.tag||"",reply:plain(res.text||""),itemDone:isLast,itemRight:isLast?results.every(r=>r.right):""}});
      if(!it.holdReply&&res.text)reply(rich(res.text),res.right?"ok":"no");
      if(part.endOnWrong&&!res.right){pi=it.parts.length;return finish();}
      if(part.onlyIfRight&&!res.right){pi=it.parts.length;return finish();}
      pi++;
      if(pi<it.parts.length){
        if(!it.holdReply&&res.text)nextButton("Next",()=>{stage.querySelectorAll(".reply").forEach(x=>x.classList.add("done"));stage.querySelectorAll(".actions").forEach(a=>a.remove());runNext();});
        else runNext();}
      else finish();});
  };
  const finish=()=>{
    const right=results.every(r=>r.right);
    if(it.summary)reply(rich(it.summary(right)),right?"ok":"no");
    const r={kind,signal:it.signal,contrast:it.contrast||"",right,own:true,t:new Date().toISOString(),role};
    if(role==="review")return after(r);
    st.res.push(r);kiOf(S.stop).res.push(r);
    if(right){st.missRun=0;st.pi++;}
    else{st.missRun++;
      /* A miss: the next item is a fresh one of the same kind. Two in a row end this practice for today. */
      if(st.missRun>=2){st.pi++;st.queue.splice(st.pi,0,kind);saveAll();return nextButton("Next",()=>stopForToday(def));}
      st.pi++;st.queue.splice(st.pi,0,kind);}
    saveAll();
    nextButton("Next",()=>go());
  };
  runNext();
}
function holds(def,st){const k=kiOf(S.stop);k.passed=true;k.stage="held on own items (mixed set and gap still to come)";k.heldOn=new Date().toISOString();
  record("item holds",{role:"own",checks:def.ki,detail:{rule:"last right on her own, every contrast case right on her own, at least three signal kinds right on her own",kinds:heldNow(def,st).kinds}});
  sendState(S.stop,"held");
  const i=ORDER.indexOf(S.stop);S.stop=ORDER.slice(i+1).find(id=>!kiOf(id).passed)||null;saveAll();go();}
function stopForToday(def){S.stoppedOn=todayKey();kiOf(S.stop).stage="saved stop: two items in a row not right";
  record("saved stop",{checks:def.ki,detail:{reason:"two items in a row not right on her own"}});sendState(S.stop,"stopped for today");saveAll();
  if(HAS_SHEET)setTimeout(()=>{try{SheetLog.flush()}catch(e){}},50);endScreen("stopped");}
function reviewItem(id){const def=STOPS[id];const kinds=def.plan.filter(k=>!def.gates[k]);const kind=pick(kinds);
  const fakeSt={res:[],queue:[]};
  showItem(def,fakeSt,kind,"review",r=>{S.review.shift();
    kiOf(id).res.push(r);
    if(!r.right){const k=kiOf(id);k.passed=false;k.stage="back to practice after a review miss";S.stops[id]=freshStop();S.stops[id].phase="own";S.stop=id;sendState(id,"back to practice");
      record("teaching decision",{checks:def.ki,detail:{action:"back to practice",reason:"review item not right"}});}
    saveAll();nextButton("Next",()=>go());});}
function endScreen(why){clearStage();
  if(why==="stopped"){para("We stop here for today. Your place is kept.");para("Next time, you start again with an example and then new questions.");}
  else{para("That is the end of this part. Your work is kept.");para("Next time, there will be new questions on both.");}
  record("session end",{detail:{reason:why}});if(HAS_SHEET)setTimeout(()=>{try{SheetLog.flush()}catch(e){}},50);}

/* ===================== Read it and Pause ===================== */
function stopSpeech(){try{speechSynthesis.cancel();}catch(e){}}
$("readBtn").addEventListener("click",()=>{stopSpeech();try{const u=new SpeechSynthesisUtterance(speakable(screenText.join(". ")));u.lang="en-IN";u.rate=.92;speechSynthesis.speak(u);}catch(e){}record("read it",{});});
$("pauseBtn").addEventListener("click",()=>{stopSpeech();$("pauseOv").classList.remove("hide");$("resumeBtn").focus();record("pause",{});saveAll();});
$("resumeBtn").addEventListener("click",()=>{$("pauseOv").classList.add("hide");record("resume",{});});

/* ===================== Teacher strip (?teacher=1 only) ===================== */
function renderTeacher(){if(!TEACHER||!S)return;const t=$("teacher");t.classList.remove("hide");
  const st=S.stop?S.stops[S.stop]:null;const def=S.stop?STOPS[S.stop]:null;const h=st&&def?heldNow(def,st):null;
  t.innerHTML=`<b>For the teacher.</b> ${S.stop?STOPS[S.stop].ki:"both held"}; phase ${st?st.phase:"-"}; item ${st?st.pi+1:"-"} of ${st&&st.queue?st.queue.length:"-"} (${st&&st.queue?st.queue[st.pi]||"":""}); misses in a row ${st?st.missRun:"-"}; contrasts still needed: ${h?h.missing.join(", ")||"none":"-"}; signals right: ${h?h.kinds.join(" "):"-"}. Supported item skip: ${CONFIG.skipSupported?"on":"off"}. ${S.events.length} records${HAS_SHEET?", "+SheetLog.pending()+" waiting to send":", no Sheet logger on this page"}. <button class="btn" id="tReset" type="button">Start again (clears this page's record)</button>`;
  $("tReset").onclick=()=>{try{localStorage.removeItem(CONFIG.stateKey);const k=store.get(CONFIG.kiKey)||{};ORDER.forEach(id=>delete k[id]);store.set(CONFIG.kiKey,k);}catch(e){}location.reload();};}

/* ===================== Sample screens (?screen=...) for review ===================== */
function sample(name){loadState();
  const wm=name.match(/^w(01|03)-(\d)$/),sm=name.match(/^sup(01|03)$/);
  S.stop=(wm||sm)?"ki-ag-"+(wm||sm)[1]:(G01[name]?"ki-ag-01":"ki-ag-03");
  const def=STOPS[S.stop];const st={phase:"own",w:0,firstTry:[],pi:0,queue:[],missRun:0,res:[]};
  if(wm){st.w=Number(wm[2])-1;st.phase="worked";return workedExample(def,st);}
  if(sm)return supportedItem(def,st);
  showItem(def,st,name,"own");}
window.__ki={part:null,ctx:null,readExpr,readNumber,sameExpr,substitute,STOPS,G01,G03,get S(){return S},get K(){return K},heldNow};
if(QS.get("screen")){SAMPLE=true;/* review mode: nothing is stored */CONFIG.stateKey="student2-ki-sample";CONFIG.kiKey="student2-ki-sample-k";sample(QS.get("screen"));}
else start();
</script>
